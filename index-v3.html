<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d18"><title>Souls On Earth — Live Population</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#080d18;color:#f2f6ff}body{display:flex;justify-content:center}.app{width:100%;max-width:1100px;height:100dvh;display:flex;flex-direction:column;background:radial-gradient(circle at 70% -15%,#1b3151 0,#0d1728 42%,#080d18 78%);overflow:hidden}.top{height:56px;display:flex;align-items:center;padding:0 15px;border-bottom:1px solid rgba(255,255,255,.09);flex-shrink:0}.brand{font-size:14px;font-weight:950;letter-spacing:1.7px}.live-label{margin-left:10px;font-size:8px;color:#637894;letter-spacing:1.2px}.actions{margin-left:auto;display:flex;gap:7px}.btn{width:36px;height:34px;border:1px solid rgba(255,255,255,.13);border-radius:10px;background:rgba(255,255,255,.06);color:#fff;font-size:16px;cursor:pointer}.hero{margin:10px 12px 8px;padding:18px 20px;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:rgba(8,15,28,.7);box-shadow:0 14px 40px rgba(0,0,0,.2);position:relative;overflow:hidden;flex-shrink:0}.hero:before,.hero:after{content:"";position:absolute;border:1px solid rgba(117,188,255,.13);border-radius:50%;pointer-events:none}.hero:before{width:260px;height:260px;right:-115px;top:-155px}.hero:after{width:190px;height:190px;right:-80px;top:-120px}.eyebrow{font-size:9px;letter-spacing:1.7px;text-transform:uppercase;color:#8195b0}.world{margin-top:5px;font-size:clamp(34px,7vw,67px);font-weight:950;letter-spacing:-2.8px;line-height:1.05;font-variant-numeric:tabular-nums}.meta{display:flex;align-items:center;gap:9px;margin-top:10px}.live{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;background:rgba(55,225,145,.1);color:#59e49b;font-size:9px;font-weight:900;letter-spacing:1px}.dot{width:6px;height:6px;border-radius:50%;background:#59e49b;box-shadow:0 0 10px #59e49b}.updated{font-size:9px;color:#657993}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 12px 8px;flex-shrink:0}.stat{border:1px solid rgba(255,255,255,.08);border-radius:13px;background:rgba(11,19,33,.7);padding:9px 12px}.stat-v{font-size:15px;font-weight:850;font-variant-numeric:tabular-nums}.stat-k{font-size:7px;color:#70839d;letter-spacing:1px;text-transform:uppercase;margin-top:3px}.birth{color:#59e49b}.death{color:#ff7777}.growth{color:#59e49b}.heading{height:28px;display:flex;align-items:center;padding:0 13px;flex-shrink:0}.heading strong{font-size:11px;letter-spacing:1.1px}.heading span{margin-left:auto;font-size:7px;color:#637894;letter-spacing:.7px}.list{margin:0 12px 8px;border:1px solid rgba(255,255,255,.1);border-radius:17px;overflow:hidden;display:flex;flex-direction:column;min-height:0;flex:1;background:rgba(8,14,25,.68)}.list-head{height:34px;display:grid;grid-template-columns:38px 30px minmax(0,1fr) 145px;align-items:center;padding:0 13px;border-bottom:1px solid rgba(255,255,255,.08);font-size:7px;color:#61748f;font-weight:900;letter-spacing:1px;text-transform:uppercase;flex-shrink:0}.rows{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(12,minmax(0,1fr));grid-auto-flow:column;min-height:0;flex:1}.row{display:grid;grid-template-columns:38px 30px minmax(0,1fr) 145px;align-items:center;padding:0 13px;border-bottom:1px solid rgba(255,255,255,.055);min-width:0}.row:nth-child(12),.row:nth-child(24){border-bottom:0}.rank{font-size:9px;color:#506581;text-align:center;font-weight:800}.flag{font-size:21px;text-align:center;line-height:1}.name{font-size:13px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.num{font-size:12px;font-weight:950;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.runtime-up{color:#59e49b!important}.runtime-down{color:#ff7777!important}.footer{text-align:center;height:17px;flex-shrink:0;font-size:7px;color:#40536d;letter-spacing:1px;text-transform:uppercase}@media(max-width:720px){.top{height:52px;padding:0 11px}.brand{font-size:13px}.live-label{display:none}.hero{margin:8px 8px 7px;padding:15px 15px;min-height:127px}.world{font-size:clamp(32px,9.4vw,47px);letter-spacing:-1.8px}.meta{margin-top:8px}.stats{margin:0 8px 7px;gap:6px}.stat{padding:8px 8px}.stat-v{font-size:12px}.stat-k{font-size:6.5px}.heading{height:27px;padding:0 9px}.heading strong{font-size:10px}.heading span{font-size:6.5px}.list{margin:0 8px 7px;border-radius:14px}.list-head{height:31px;grid-template-columns:25px 24px minmax(0,1fr) 100px;padding:0 7px}.rows{grid-template-rows:repeat(12,minmax(0,1fr))}.row{grid-template-columns:25px 24px minmax(0,1fr) 100px;padding:0 7px}.flag{font-size:19px}.name{font-size:11px;letter-spacing:-.2px}.num{font-size:9.5px}.rank{font-size:7px}.footer{height:14px;font-size:6px}}@media(max-width:390px){.list-head,.row{grid-template-columns:21px 21px minmax(0,1fr) 91px}.flag{font-size:17px}.name{font-size:10px}.num{font-size:9px}}
</style></head><body><main class="app"><header class="top"><div class="brand">SOULS ON EARTH</div><div class="live-label">WORLD POPULATION • LIVE</div><div class="actions"><button class="btn" id="theme" aria-label="Change theme">◐</button><button class="btn" id="music" aria-label="Toggle music">♫</button></div></header><section class="hero"><div class="eyebrow">Current world population</div><div class="world" id="world">—</div><div class="meta"><div class="live"><i class="dot"></i>LIVE</div><div class="updated" id="updated">Updating…</div></div></section><section class="stats"><div class="stat"><div class="stat-v birth" id="births">—</div><div class="stat-k">Births today</div></div><div class="stat"><div class="stat-v death" id="deaths">—</div><div class="stat-k">Deaths today</div></div><div class="stat"><div class="stat-v growth" id="growth">—</div><div class="stat-k">Net growth today</div></div></section><div class="heading"><strong>TOP 24 COUNTRIES</strong><span>LIVE DISPLAYED CHANGE</span></div><section class="list"><div class="list-head"><span>RANK</span><span></span><span>COUNTRY</span><span>POPULATION</span></div><div class="rows" id="rows"></div></section><div class="footer">SOULS ON EARTH · LIVE POPULATION ESTIMATE</div></main><audio id="audio" preload="auto" loop playsinline webkit-playsinline></audio><script>
const C=[['🇮🇳','India',1476625576,.87],['🇨🇳','China',1412914089,-.22],['🇺🇸','U.S.A.',349035494,.51],['🇮🇩','Indonesia',287886782,.76],['🇵🇰','Pakistan',259299791,1.6],['🇳🇬','Nigeria',242431832,2.06],['🇧🇷','Brazil',213562666,.35],['🇧🇩','Bangladesh',177818044,1.21],['🇷🇺','Russia',143394458,-.42],['🇪🇹','Ethiopia',138902185,2.53],['🇲🇽','Mexico',132997658,.8],['🇯🇵','Japan',122427731,-.55],['🇪🇬','Egypt',120101175,1.47],['🇵🇭','Philippines',117724471,.8],['🇨🇩','DR Congo',116452162,3.21],['🇻🇳','Vietnam',102177431,.57],['🇮🇷','Iran',93168497,.81],['🇹🇷','Turkey',87926082,.27],['🇩🇪','Germany',83644258,-.51],['🇹🇿','Tanzania',72563780,2.86],['🇹🇭','Thailand',71559614,-.08],['🇬🇧','U.K.',69931528,.55],['🇫🇷','France',66746401,.14],['🇿🇦','South Africa',65453084,1.09]];
const anchor=Date.UTC(2026,6,1),YEAR=365.25*86400,WORLD=8300678395,BIRTH=132503469/YEAR,DEATH=63637314/YEAR,NET=BIRTH-DEATH;const fmt=n=>new Intl.NumberFormat('en-US').format(Math.floor(n)),elapsed=()=>Math.max(0,(Date.now()-anchor)/1000),pop=c=>c[2]*Math.pow(1+c[3]/100,elapsed()/YEAR);let order=C.map((_,i)=>i),previous=new Map();function render(){order.sort((a,b)=>pop(C[b])-pop(C[a]));rows.innerHTML=order.map((i,r)=>`<div class="row"><span class="rank">${r+1}</span><span class="flag">${C[i][0]}</span><span class="name" data-i="${i}">${C[i][1]}</span><span class="num" data-i="${i}">${fmt(pop(C[i]))}</span></div>`).join('')}function update(){const now=Date.now(),midnight=new Date(new Date(now).setHours(0,0,0,0)).getTime(),today=(now-midnight)/1000;world.textContent=fmt(WORLD+elapsed()*NET);births.textContent=fmt(today*BIRTH);deaths.textContent=fmt(today*DEATH);growth.textContent=fmt(today*NET);document.querySelectorAll('.num').forEach(e=>{const i=+e.dataset.i,n=Math.floor(pop(C[i])),old=previous.get(i),name=document.querySelector('.name[data-i="'+i+'"]');e.textContent=fmt(n);e.classList.remove('runtime-up','runtime-down');if(name)name.classList.remove('runtime-up','runtime-down');if(old!==undefined&&n>old){e.classList.add('runtime-up');if(name)name.classList.add('runtime-up')}else if(old!==undefined&&n<old){e.classList.add('runtime-down');if(name)name.classList.add('runtime-down')}previous.set(i,n)});updated.textContent='Updated '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})}render();update();setInterval(update,1000);setInterval(render,30000);const themes=['dark','light'];let ti=localStorage.getItem('soe-v3-theme')==='light'?1:0;function applyTheme(){document.documentElement.toggleAttribute('data-theme',themes[ti]==='light')}theme.onclick=()=>{ti=(ti+1)%2;applyTheme();localStorage.setItem('soe-v3-theme',themes[ti])};applyTheme();const audio=document.getElementById('audio'),musicButton=document.getElementById('music');audio.src='./cathedral%20of%20stars.mp3';audio.volume=.25;musicButton.onclick=async()=>{if(audio.paused){try{await audio.play();musicButton.textContent='🔊'}catch(e){musicButton.textContent='⚠'}}else{audio.pause();musicButton.textContent='♫'}};</script></body></html>
