</style></head><body><div class="app"><div class="channel"><img class="avatar" src="channels4_profile.jpg" alt="History Warrior"><div class="channel-info"><div class="channel-name">History Warrior</div><div class="channel-sub">🔴 ♙ 6629 &nbsp; 👍 820</div></div><div class="links"><a href="index.html">WORLD</a><a href="historical-clock.html">CLOCK</a><a href="civilizations.html">CIVS</a><a href="historical-events.html">EVENTS</a></div></div><div class="hero"><div class="eyebrow">LIVE HISTORICAL TIMELINE</div><div class="hero-title">Time Since a Historic Event</div><div class="hero-name" id="heroName">—</div><div class="hero-age" id="heroAge">—</div><div class="hero-meta" id="heroMeta">—</div><div class="utc" id="utc">—</div></div><div class="comment">👇 WHICH HISTORICAL EVENT SHOULD WE ADD? 👇</div><div class="head">10 HISTORICAL MILESTONES • ELAPSED TIME CALCULATED LIVE</div><div class="timeline"><div class="col" id="left"></div><div class="col" id="right"></div></div></div><script>const events=[['🏛️','Fall of the Western Roman Empire','04 Sep 0476',Date.UTC(476,8,4)],['📜','Magna Carta sealed','15 Jun 1215',Date.UTC(1215,5,15)],['🏰','Fall of Constantinople','29 May 1453',Date.UTC(1453,4,29)],['🧭','Columbus reaches the Americas','12 Oct 1492',Date.UTC(1492,9,12)],['⚔️','American Declaration of Independence','04 Jul 1776',Date.UTC(1776,6,4)],['🇫🇷','French Revolution begins','14 Jul 1789',Date.UTC(1789,6,14)],['🚂','First public railway passenger service','27 Sep 1825',Date.UTC(1825,8,27)],['🌍','World War I begins','28 Jul 1914',Date.UTC(1914,6,28)],['🕊️','World War II begins','01 Sep 1939',Date.UTC(1939,8,1)],['🌕','First Moon landing','20 Jul 1969',Date.UTC(1969,6,20)]];const Y=365.2425*86400000;function elapsed(ms){let s=Math.max(0,(Date.now()-ms)/1000);const y=Math.floor(s/(365.2425*86400));s-=y*365.2425*86400;const d=Math.floor(s/86400);s-=d*86400;const h=Math.floor(s/3600);s-=h*3600;const m=Math.floor(s/60);const sec=Math.floor(s%60);return `${y.toLocaleString()}y ${d}d ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(sec).padStart(2,'0')}s`};function render(){const ordered=[...events].sort((a,b)=>a[3]-b[3]);const focus=ordered[(Math.floor(Date.now()/10000))%ordered.length];document.getElementById('heroName').textContent=focus[1];document.getElementById('heroAge').textContent=elapsed(focus[3]);document.getElementById('heroMeta').textContent=`Event date: ${focus[2]} • continuously updating`;document.getElementById('utc').textContent=new Date().toISOString().replace('T',' ').slice(0,19)+' UTC';const row=e=>{const days=Math.floor((Date.now()-e[3])/86400000);const pct=20+((Date.now()-e[3])%30000)/30000*80;return `<div class="event"><div class="dot">${e[0]}</div><div><div class="event-name">${e[1]}</div><div class="event-date">${e[2]}</div><div class="event-time">${elapsed(e[3])}</div></div><div class="bar"><i style="width:${pct}%"></i></div></div>`};const half=Math.ceil(ordered.length/2);document.getElementById('left').innerHTML=ordered.slice(0,half).map(row).join('');document.getElementById('right').innerHTML=ordered.slice(half).map(row).join('')}render();setInterval(render,1000)</script><script type="module" src="js/ambient-ui.js"></script></body></html>
