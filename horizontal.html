<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Souls On Earth — Horizontal YouTube Live</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{display:flex;align-items:center;justify-content:center}
#frame{
  width:100vw;
  height:56.25vw;
  max-height:100vh;
  max-width:177.7777778vh;
  border:0;
  display:block;
  background:#fff;
}
@media(max-aspect-ratio:16/9){
  #frame{width:100vw;height:56.25vw}
}
@media(min-aspect-ratio:16/9){
  #frame{width:177.7777778vh;height:100vh}
}
</style>
</head>
<body>
<iframe id="frame" src="./index.html" title="Souls On Earth — Horizontal YouTube Live" allow="autoplay"></iframe>
<script>
/*
  Horizontal Live is deliberately built from index.html rather than copying
  its population engine. This keeps the live calculations, ranking updates,
  music, theme system, subscriber display, animations and future index fixes
  identical to the main page.

  The wrapper is 16:9 and, because GitHub Pages serves both documents from the
  same origin, we can safely apply a small presentation override to the child
  after it loads. The normal index.html is untouched.
*/
const frame=document.getElementById('frame');
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    const style=doc.createElement('style');
    style.id='horizontal-live-overrides';
    style.textContent=`
      html,body{overflow:hidden!important;width:100%!important;height:100%!important}
      body{justify-content:center!important}
      .app{width:100%!important;max-width:none!important;height:100%!important}
      .channel{height:72px!important}
      .summary{min-height:154px!important}
      .hero{padding-top:18px!important}
      .world-pop{font-size:clamp(42px,5.2vw,76px)!important}
      .live-row{margin-top:12px!important}
      .rank-head{min-height:40px!important}
      .rank-wrap{padding-bottom:10px!important}
      .country{font-size:14px!important}
      .pop{font-size:14px!important}
      @media(max-height:720px){
        .channel{height:64px!important}
        .summary{min-height:142px!important}
        .hero{padding-top:12px!important}
        .world-pop{font-size:clamp(38px,5vw,64px)!important}
        .rank-head{min-height:36px!important}
        .country{font-size:12.5px!important}
        .pop{font-size:12.5px!important}
      }
    `;
    doc.head.appendChild(style);
  }catch(e){
    console.warn('Horizontal layout override unavailable:',e);
  }
});
</script>
</body>
</html>
