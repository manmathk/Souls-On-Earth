<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Souls On Earth — Horizontal YouTube Live</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{display:flex;align-items:center;justify-content:center}
#frame{width:100vw;height:56.25vw;max-width:177.7778vh;max-height:100vh;border:0;display:block;background:#fff}
</style>
</head>
<body>
<iframe id="frame" src="./index.html" title="Souls On Earth — Horizontal YouTube Live" allow="autoplay"></iframe>
<script>
const frame=document.getElementById('frame');
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    const style=doc.createElement('style');
    style.id='horizontal-live-overrides';
    style.textContent=`
      /* Horizontal YouTube Live: display all 50 ranked countries in four
         compact vertical columns. The underlying index calculation remains
         the single source of truth. */
      html,body{width:100%!important;height:100%!important;overflow:hidden!important}
      body{display:flex!important;justify-content:center!important}
      .app{width:100%!important;max-width:none!important;height:100%!important;overflow:hidden!important}

      .channel{height:58px!important;min-height:58px!important;padding:5px 18px!important}
      .avatar{width:40px!important;height:40px!important}
      .channel-name{font-size:15px!important}
      .channel-sub{font-size:11px!important}
      .subscribe{padding:8px 15px!important;font-size:12px!important}

      .summary{height:132px!important;min-height:132px!important;max-height:132px!important;grid-template-columns:28% 72%!important}
      .today{padding:7px 9px 4px!important}
      .today-title{font-size:11px!important;margin-bottom:4px!important}
      .stat{margin:3px 0!important}
      .stat-label{font-size:10px!important}
      .stat-value{font-size:16px!important}
      .hero{padding:8px 8px 4px!important}
      .hero-title{font-size:16px!important;margin-bottom:2px!important}
      .world-pop{font-size:clamp(38px,4.8vw,64px)!important;line-height:.95!important}
      .live-row{margin-top:6px!important;gap:8px!important}
      .live,.yt{padding:7px 18px!important;font-size:12px!important}

      .comment{height:34px!important;min-height:34px!important;font-size:13px!important}
      .rank-head{height:32px!important;min-height:32px!important;padding:4px 10px!important;font-size:11px!important}
      .rank-wrap{height:auto!important;flex:1!important;min-height:0!important;padding-bottom:0!important;overflow:hidden!important}

      /* The normal page has two 25-row columns. Making those wrappers
         transparent lets the 50 country rows become one four-column grid.
         13 rows fit in the first two columns; the final two columns contain
         12 rows each. CSS grid fills downward before moving to the next
         column, preserving ranks 1 → 50. */
      .rank-grid{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;grid-template-rows:repeat(13,minmax(0,1fr))!important;grid-auto-flow:column!important;height:100%!important}
      .rank-grid>.col{display:contents!important}
      .rank-grid>.col:first-child{border-right:0!important}
      .country{min-height:0!important;height:auto!important;padding:0 9px!important;grid-template-columns:19px 21px minmax(0,1fr) auto!important;gap:4px!important;font-size:11px!important;line-height:1!important;border-bottom:1px solid var(--line-row)!important}
      .rank{font-size:9px!important}
      .flag{font-size:11px!important}
      .name{font-size:11px!important;letter-spacing:-.2px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
      .pop{font-size:11px!important;white-space:nowrap!important}

      /* Subtle dividers between the four ranking columns. */
      .country:nth-child(13n+1){border-left:1px solid transparent}

      @media(max-height:700px){
        .channel{height:52px!important;min-height:52px!important}
        .avatar{width:36px!important;height:36px!important}
        .summary{height:120px!important;min-height:120px!important;max-height:120px!important}
        .stat{margin:2px 0!important}
        .stat-value{font-size:14px!important}
        .hero{padding-top:6px!important}
        .world-pop{font-size:clamp(34px,4.5vw,56px)!important}
        .live-row{margin-top:4px!important}
        .live,.yt{padding:5px 15px!important;font-size:11px!important}
        .comment{height:30px!important;min-height:30px!important;font-size:12px!important}
        .rank-head{height:28px!important;min-height:28px!important;font-size:10px!important}
        .country{grid-template-columns:17px 19px minmax(0,1fr) auto!important;gap:3px!important}
        .rank{font-size:8px!important}.flag{font-size:10px!important}.name,.pop{font-size:10px!important}
      }
    `;
    doc.head.appendChild(style);
  }catch(e){console.warn('Horizontal layout override unavailable:',e)}
});
</script>
</body>
</html>
