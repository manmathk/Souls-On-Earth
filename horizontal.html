<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Souls On Earth — World Countries YouTube Live</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#222}body{display:flex;justify-content:center}.app{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;background:#fff}.channel{height:54px;min-height:54px;display:flex;align-items:center;justify-content:space-between;padding:5px 18px;border-bottom:1px solid #e7e7e7}.identity{display:flex;align-items:center;gap:9px}.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#eee}.channel-name{font-weight:700;font-size:15px}.channel-sub{font-size:10px;color:#777;margin-top:2px}.subscribe{border:0;border-radius:7px;background:#f00;color:#fff;font-weight:700;font-size:12px;padding:8px 14px}.summary{height:105px;min-height:105px;display:grid;grid-template-columns:27% 73%;border-bottom:1px solid #e7e7e7}.today{padding:7px 12px;border-right:1px solid #e7e7e7}.today-title{font-size:10px;font-weight:700;color:#777}.stats{display:flex;gap:20px;margin-top:5px}.stat-label{font-size:9px;color:#777}.stat-value{font-size:15px;font-weight:700;margin-top:2px}.hero{padding:8px 14px;text-align:center}.hero-title{font-size:13px;font-weight:700}.world-pop{font-size:clamp(30px,4.2vw,56px);font-weight:800;line-height:1;margin:3px 0}.hero-label{font-size:10px;color:#777}.live-row{display:flex;justify-content:center;gap:8px;margin-top:5px}.live,.yt{border-radius:5px;padding:5px 14px;font-size:10px;font-weight:700}.live{background:#ff3030;color:#fff}.yt{background:#ffe7e7;color:#ff3030}.comment{height:29px;min-height:29px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border-bottom:1px solid #e7e7e7}.rank-head{height:25px;min-height:25px;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;background:#fafafa;border-bottom:1px solid #ddd;font-size:9px;font-weight:700;color:#666;padding:0 5px}.rank-head div{text-align:center}.countries{height:auto;flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-flow:column;overflow:hidden}.country{min-width:0;display:grid;grid-template-columns:18px 20px minmax(0,1fr) auto;align-items:center;gap:3px;padding:0 7px;border-bottom:1px solid #eee;border-right:1px solid #eee;font-size:9px;line-height:1}.rank{color:#999;font-size:8px;text-align:right}.flag{font-size:10px}.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pop{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}.status{font-size:9px;color:#777;text-align:center;padding:3px;grid-column:1/-1}@media(max-height:650px){.channel{height:46px;min-height:46px}.avatar{width:32px;height:32px}.summary{height:88px;min-height:88px}.world-pop{font-size:clamp(25px,3.8vw,46px)}.comment{height:24px;min-height:24px}.rank-head{height:21px;min-height:21px}.country{font-size:8px}.rank{font-size:7px}.flag{font-size:9px}.pop{font-size:8px}.name{font-size:8px}}
</style>
</head>
<body>
<div class="app">
<header class="channel"><div class="identity"><img class="avatar" src="./channels4_profile.jpg" alt=""><div><div class="channel-name">History Warrior</div><div class="channel-sub">World Population Live</div></div></div><button class="subscribe">SUBSCRIBE</button></header>
<section class="summary"><div class="today"><div class="today-title">WORLD TODAY</div><div class="stats"><div><div class="stat-label">BIRTHS</div><div id="births" class="stat-value">—</div></div><div><div class="stat-label">DEATHS</div><div id="deaths" class="stat-value">—</div></div><div><div class="stat-label">NET</div><div id="net" class="stat-value">—</div></div></div></div><div class="hero"><div class="hero-title">World Population — All Countries</div><div id="worldPop" class="world-pop">—</div><div id="heroLabel" class="hero-label">LOADING COUNTRY DATA…</div><div class="live-row"><span class="live">● LIVE</span><span class="yt">YouTube Live</span></div></div></section>
<div class="comment">EVERY COUNTRY IN THE WORLD · LIVE ESTIMATES</div>
<div class="rank-head"><div>RANK · COUNTRY</div><div>RANK · COUNTRY</div><div>RANK · COUNTRY</div><div>RANK · COUNTRY</div></div>
<div id="countries" class="countries"><div class="status">Loading all countries…</div></div>
</div>
<script>
const YEAR=365.25*86400,nf=new Intl.NumberFormat('en-US');
const fmt=n=>nf.format(Math.floor(Math.max(0,n)));const esc=s=>String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]||m));
const flag=cc=>cc?cc.toUpperCase().replace(/./g,c=>String.fromCodePoint(127397+c.charCodeAt(0))):'🌐';
let countries=[],world={pop:8300678395,b:16,d:7.7,anchor:Date.now()};
async function json(url){const r=await fetch(url);if(!r.ok)throw Error(`${r.status} ${url}`);return r.json()}
function collect(j){const o={};for(const x of(j[1]||[])){if(typeof x.value!=='number'||!x.countryiso3code)continue;const y=+x.date;if(!o[x.countryiso3code]||y>o[x.countryiso3code].year)o[x.countryiso3code]={year:y,value:x.value}}return o}
async function indicator(codes,indicator){const out=[];for(let i=0;i<codes.length;i+=25){const chunk=codes.slice(i,i+25).join(';');const j=await json(`https://api.worldbank.org/v2/country/${chunk}/indicator/${indicator}?format=json&mrv=8&per_page=2000`);out.push(collect(j));}return out.reduce((a,o)=>Object.assign(a,o),{})}
async function load(){
  const list=await json('https://api.worldbank.org/v2/country?format=json&per_page=400');
  countries=(list[1]||[]).filter(c=>c.region&&c.region.id!=='NA'&&c.id).map(c=>({iso:c.id,name:c.name,cc:c.iso2Code,pop:0,b:16,d:7.7}));
  const codes=countries.map(c=>c.iso);
  const [P,B,D]=await Promise.all([indicator(codes,'SP.POP.TOTL'),indicator(codes,'SP.DYN.CBRT.IN'),indicator(codes,'SP.DYN.CDRT.IN')]);
  countries=countries.map(c=>({...c,pop:P[c.iso]?.value||0,b:B[c.iso]?.value||16,d:D[c.iso]?.value||7.7})).filter(c=>c.pop>0).sort((a,b)=>b.pop-a.pop);
  const [wp,wb,wd]=await Promise.all([json('https://api.worldbank.org/v2/country/WLD/indicator/SP.POP.TOTL?format=json&mrv=8'),json('https://api.worldbank.org/v2/country/WLD/indicator/SP.DYN.CBRT.IN?format=json&mrv=8'),json('https://api.worldbank.org/v2/country/WLD/indicator/SP.DYN.CDRT.IN?format=json&mrv=8')]);
  const latest=j=>((j[1]||[]).find(x=>typeof x.value==='number')||{}).value;
  world={pop:latest(wp)||countries.reduce((s,c)=>s+c.pop,0),b:latest(wb)||16,d:latest(wd)||7.7,anchor:Date.now()};
  render();setInterval(render,1000);setInterval(refreshRates,3600000);
}
function projected(c){return c.pop*Math.pow(1+(c.b-c.d)/1000,Math.max(0,(Date.now()-world.anchor)/YEAR))}
function render(){
  const now=new Date(),mid=new Date(now);mid.setHours(0,0,0,0);const sec=(Date.now()-mid)/1000;
  const elapsed=(Date.now()-world.anchor)/1000;const pop=world.pop+(world.pop*(world.b-world.d)/1000/YEAR)*elapsed;
  const birthPerSec=world.pop*world.b/1000/YEAR,deathPerSec=world.pop*world.d/1000/YEAR,netPerSec=birthPerSec-deathPerSec;
  document.getElementById('worldPop').textContent=fmt(pop);document.getElementById('births').textContent=fmt(birthPerSec*sec);document.getElementById('deaths').textContent=fmt(deathPerSec*sec);document.getElementById('net').textContent=(netPerSec>=0?'+':'−')+fmt(Math.abs(netPerSec*sec));document.getElementById('heroLabel').textContent=`${countries.length} COUNTRIES · ${netPerSec>=0?'+':''}${netPerSec.toFixed(2)} NET / SEC`;
  const rows=[...countries].sort((a,b)=>projected(b)-projected(a));const perCol=Math.ceil(rows.length/4);document.getElementById('countries').style.gridTemplateRows=`repeat(${perCol},minmax(0,1fr))`;
  document.getElementById('countries').innerHTML=rows.map((c,i)=>`<div class="country"><span class="rank">${i+1}</span><span class="flag">${flag(c.cc)}</span><span class="name">${esc(c.name)}</span><span class="pop">${fmt(projected(c))}</span></div>`).join('');
}
async function refreshRates(){try{const codes=countries.map(c=>c.iso);const [B,D]=await Promise.all([indicator(codes,'SP.DYN.CBRT.IN'),indicator(codes,'SP.DYN.CDRT.IN')]);countries.forEach(c=>{if(B[c.iso])c.b=B[c.iso].value;if(D[c.iso])c.d=D[c.iso].value});}catch(e){console.warn('Rate refresh failed',e)}}
load().catch(e=>{document.getElementById('countries').innerHTML='<div class="status">Country data could not be loaded. Refresh the page to try again.</div>';console.error(e)});
</script>
</body>
</html>
