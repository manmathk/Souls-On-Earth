<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Souls On Earth &mdash; Scale of a Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@700;800&display=swap">
<style>
/* ---- Souls On Earth vertical frame · "ember" visual system -----------------
   Palette, display faces and devices lifted from index-backup.html so the
   vertical family reads as the same channel: obsidian ground, ember glow from
   below, gold rim light from above, bone text.
   Fonts load from Google with full system fallbacks and font-display:swap, so a
   page with no network still renders correctly — these pages must survive weeks
   on a phone without connectivity. ------------------------------------------ */
:root{
  --obsidian:#0a0807; --obsidian-2:#151010; --ink:#1d1613;
  --bone:#f4ecdb; --smoke:#8a7f72; --hair:rgba(244,236,219,.10);
  --ember:#ff6a2b; --ember-hot:#ffc257; --gold:#e8b86d;
  --blood:#e0503f; --grow:#5fe39b;
  --accent:var(--ember-hot); --glow:255,194,87;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  color:var(--bone);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,Helvetica,sans-serif;
  background:
    radial-gradient(125% 58% at 50% 107%, rgba(255,106,43,.24), transparent 62%),
    radial-gradient(92% 40% at 50% -6%, rgba(232,184,109,.11), transparent 60%),
    linear-gradient(180deg,var(--obsidian) 0%,var(--obsidian-2) 58%,#1b1210 100%);
  -webkit-font-smoothing:antialiased}
.display{font-family:"Bebas Neue",Impact,"Haettenschweiler","Arial Narrow",sans-serif}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}

.chrome-top{flex:0 0 56px;display:flex;align-items:center;gap:10px;
  padding:0 56px 0 12px;position:relative;
  background:linear-gradient(180deg,rgba(255,194,87,.05),transparent);
  border-bottom:1px solid var(--hair)}
/* right padding clears the fixed 34px music button ambient-ui.js pins at right:10px */
.chrome-top .avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;
  border:1px solid rgba(232,184,109,.45);box-shadow:0 0 14px rgba(255,106,43,.35)}
.chrome-top .who{flex:1;min-width:0}
.chrome-top .name{font-size:16px;font-weight:400;letter-spacing:.04em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--bone)}
.chrome-top .subs{font-size:11px;color:var(--smoke)}
.chrome-top .nav{display:flex;gap:6px;font-size:10px;flex:0 0 auto;letter-spacing:.08em}
.chrome-top .nav a{color:var(--smoke);text-decoration:none}
.chrome-top .nav a[aria-current]{color:var(--ember-hot)}

.stage-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.stage{width:min(100vw,calc((100dvh - 100px) * 9 / 16));aspect-ratio:9/16;
  position:relative;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:inset 0 0 120px 30px rgba(0,0,0,.70)}

/* Ember field: a fixed set of 9 nodes, created once in markup and animated purely
   in CSS. No JS loop and no node churn, so it costs nothing over a long session. */
.embers{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.embers i{position:absolute;bottom:-12px;width:3px;height:3px;border-radius:50%;
  background:var(--ember-hot);box-shadow:0 0 7px 2px rgba(255,140,60,.75);
  opacity:0;animation:emberRise linear infinite}
@keyframes emberRise{
  0%{opacity:0;transform:translateY(0) scale(.6)}
  12%{opacity:.9}
  70%{opacity:.5}
  100%{opacity:0;transform:translateY(-88vh) scale(1.15)}}
.embers i:nth-child(1){left:8%;animation-duration:17s;animation-delay:0s}
.embers i:nth-child(2){left:19%;animation-duration:23s;animation-delay:3s}
.embers i:nth-child(3){left:31%;animation-duration:19s;animation-delay:7s}
.embers i:nth-child(4){left:43%;animation-duration:26s;animation-delay:1s}
.embers i:nth-child(5){left:55%;animation-duration:21s;animation-delay:9s}
.embers i:nth-child(6){left:67%;animation-duration:24s;animation-delay:5s}
.embers i:nth-child(7){left:78%;animation-duration:18s;animation-delay:12s}
.embers i:nth-child(8){left:88%;animation-duration:28s;animation-delay:2s}
.embers i:nth-child(9){left:96%;animation-duration:20s;animation-delay:14s}
.stage > *:not(.embers){position:relative;z-index:1}

.chrome-bottom{flex:0 0 44px;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;text-align:center;padding:0 10px;color:#fff;
  background:linear-gradient(180deg,#e0503f,#b2291f);
  box-shadow:0 -8px 26px rgba(224,80,63,.30)}

.seg-progress{position:absolute;left:0;right:0;bottom:0;height:3px;
  background:rgba(244,236,219,.09);z-index:5}
.seg-progress i{display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--ember),var(--ember-hot));
  box-shadow:0 0 10px rgba(255,140,60,.8)}
.seg-progress.run i{animation:seg-sweep 50s linear forwards}
@keyframes seg-sweep{from{width:0}to{width:100%}}
@media(prefers-reduced-motion:reduce){
  .seg-progress.run i{animation:none;width:100%}
  .embers{display:none}}
/* ---- page: scale ---------------------------------------------------------- */
.head{padding:16px 16px 4px;text-align:center}
.eyebrow{font-size:13px;letter-spacing:.28em;color:var(--gold);opacity:.9}
.countwrap{position:relative;margin:2px 0}
.countwrap::before{content:"";position:absolute;left:50%;top:52%;
  width:78%;height:120%;transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(closest-side,rgba(var(--glow),.30),transparent 72%);
  animation:heroPulse 5.5s ease-in-out infinite}
@keyframes heroPulse{0%,100%{opacity:.55}50%{opacity:1}}
.count{position:relative;font-size:clamp(38px,13vw,74px);font-weight:800;
  line-height:1;letter-spacing:-.035em;font-variant-numeric:tabular-nums;
  color:var(--accent);text-shadow:0 0 30px rgba(var(--glow),.55),0 2px 0 rgba(0,0,0,.45)}
.sub{font-size:11px;color:var(--smoke);letter-spacing:.03em}
.barwrap{flex:1;min-height:0;display:flex;justify-content:center;padding:12px 16px 6px}
.bar{position:relative;width:60%;max-width:176px;height:100%;border-radius:13px;
  border:1px solid rgba(232,184,109,.22);overflow:hidden;
  background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(255,106,43,.05));
  box-shadow:inset 0 0 30px rgba(0,0,0,.6),0 0 24px rgba(255,106,43,.10)}
.fill{position:absolute;left:0;right:0;bottom:0;height:0;
  /* Composed from --glow so the whole column stays in the metric's own hue. An
     earlier version hardcoded ember orange at the midpoint, which turned the green
     births column muddy brown below the halfway mark. */
  background:linear-gradient(180deg,
    rgba(var(--glow),.95) 0%,
    rgba(var(--glow),.55) 45%,
    rgba(var(--glow),.22) 78%,
    rgba(var(--glow),.08) 100%);
  box-shadow:0 0 26px rgba(var(--glow),.45);transition:height .9s linear}
.fill::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;
  background:var(--bone);opacity:.85;box-shadow:0 0 12px 2px rgba(var(--glow),.9)}
.mark{position:absolute;left:0;right:0;height:0;border-top:1px dashed rgba(244,236,219,.22)}
.mark span{position:absolute;left:6px;bottom:3px;font-size:9px;letter-spacing:.06em;
  color:rgba(244,236,219,.62);white-space:nowrap;text-shadow:0 1px 4px #000}
.mark.high span{bottom:auto;top:4px}
.mark.passed{border-top-color:rgba(255,194,87,.75)}
.mark.passed span{color:var(--bone)}
.caption{padding:8px 18px 18px;text-align:center;font-size:12.5px;line-height:1.45;
  color:rgba(244,236,219,.72);min-height:54px}
.caption b{color:var(--ember-hot);font-weight:700}
</style>
</head>
<body data-page="scale">

<div class="chrome-top">
  <img class="avatar" src="channels4_profile.jpg" alt="History Warrior">
  <div class="who"><div class="name display">History Warrior</div><div class="subs">&#128308; 6629 &nbsp; &#128077; 820</div></div>
  <div class="nav display">
    <a href="index.html">WORLD</a><a href="vs.html">VS</a><a href="focus.html">FOCUS</a><a href="scale.html" aria-current="page">SCALE</a><a href="chronicle.html">HISTORY</a>
  </div>
</div>

<div class="stage-wrap"><div class="stage">
  <div class="embers" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="head">
    <div class="eyebrow display" id="eyebrow">&mdash;</div>
    <div class="countwrap"><div class="count mono" id="count">&mdash;</div></div>
    <div class="sub" id="sub">&mdash;</div>
  </div>
  <div class="barwrap"><div class="bar"><div class="fill" id="fill"></div><div id="marks"></div></div></div>
  <div class="caption" id="caption">&mdash;</div>
  <div class="seg-progress" id="segProgress"><i></i></div>
</div></div>

<div class="chrome-bottom">&#128071; WHICH NUMBER SURPRISED YOU? TELL US &#128071;</div>

<script type="module">
import { segmentIndex, projectPopulation, dayFraction, formatCount, crossedThresholds }
  from './js/vertical-math.js';
import { initVoice } from './js/vertical-voice.js';

/* Baked world figures. Self-contained on purpose: this page must keep running
   for weeks on a phone without depending on a network call.

   The three rates are reconciled rather than independently baked. The net rate
   is derived from the published annual change, and the death rate is derived
   from birth minus net, so births - deaths always equals growth exactly. */
const WORLD_POP_2026 = 8300678395;
const WORLD_ANNUAL_CHANGE_2026 = 69065325;
const WORLD_NET_PER_1000 = (WORLD_ANNUAL_CHANGE_2026 / WORLD_POP_2026) * 1000;
const WORLD_CBR_PER_1000 = 16.4;
const WORLD_CDR_PER_1000 = WORLD_CBR_PER_1000 - WORLD_NET_PER_1000;
const DAYS_PER_YEAR = 365.25;

/* Real places, ascending, all small enough that a single day of global births
   (~373,000) climbs past most of them. The point is that the viewer watches
   the bar cross a name they recognise. */
/* Roughly evenly spaced on the bar, each about 1.7x the last. An earlier list had
   Gibraltar 32,700 / San Marino 33,600 / Monaco 38,900 / Liechtenstein 40,100 all
   within 7,400 of each other — about 2% of the bar — so their four labels collided
   into an unreadable smear. Spacing matters more here than quantity. */
const PLACES = [
  { label: 'Gibraltar', value: 32700 },
  { label: 'Greenland', value: 56900 },
  { label: 'Andorra', value: 80900 },
  { label: 'Reykjavik, Iceland', value: 140000 },
  { label: 'Geneva, Switzerland', value: 203000 },
  { label: 'Florence, Italy', value: 367000 }
];

/* `glow` is the accent as raw RGB channels, because the hero text-shadow and the
   bar's bloom compose it with their own alpha via rgba(var(--glow), a). */
const ITEMS = [
  { key: 'births', eyebrow: 'BORN TODAY',       accent: '#5fe39b', glow: '95,227,155',  phrase: 'people have been born' },
  { key: 'deaths', eyebrow: 'DIED TODAY',       accent: '#e0503f', glow: '224,80,63',   phrase: 'people have died' },
  { key: 'growth', eyebrow: 'NET GROWTH TODAY', accent: '#ffc257', glow: '255,194,87',  phrase: 'people have been added' }
];

function dailyTotal(key, now) {
  const pop = projectPopulation(WORLD_POP_2026, 2026, WORLD_NET_PER_1000, now);
  const rate = key === 'births' ? WORLD_CBR_PER_1000
             : key === 'deaths' ? WORLD_CDR_PER_1000
             : WORLD_NET_PER_1000;
  return (pop * rate) / 1000 / DAYS_PER_YEAR;
}

const el = (id) => document.getElementById(id);

function renderSegment(i) {
  const item = ITEMS[i];
  const total = dailyTotal(item.key, Date.now());
  document.documentElement.style.setProperty('--accent', item.accent);
  document.documentElement.style.setProperty('--glow', item.glow);
  el('eyebrow').textContent = item.eyebrow;
  el('sub').textContent = `of about ${formatCount(total)} expected by midnight`;
  el('marks').innerHTML = PLACES
    .filter((p) => p.value <= total)
    .map((p) => {
      const pct = (p.value / total) * 100;
      return `<div class="mark${pct > 92 ? ' high' : ''}" data-value="${p.value}" style="bottom:${pct}%"><span>${p.label} &middot; ${formatCount(p.value)}</span></div>`;
    })
    .join('');
}

function renderTick(i) {
  const item = ITEMS[i];
  const now = Date.now();
  const total = dailyTotal(item.key, now);
  const fraction = dayFraction(now);
  const value = total * fraction;

  el('count').textContent = formatCount(value);
  el('fill').style.height = `${fraction * 100}%`;

  const passed = crossedThresholds(value, PLACES);
  document.querySelectorAll('.mark').forEach((m) => {
    m.classList.toggle('passed', Number(m.dataset.value) <= value);
  });

  const last = passed[passed.length - 1];
  el('caption').innerHTML = last
    ? `Since midnight, more ${item.phrase} than live in <b>${last.label}</b>.`
    : `Today's count has not yet reached the population of <b>${PLACES[0].label}</b>.`;
}

const SEG_MS = 50000;
let shown = -1;
function syncProgress(){
  const bar = el('segProgress');
  const fill = bar.firstElementChild;
  bar.classList.remove('run');
  void bar.offsetWidth;
  fill.style.animationDelay = `-${(Date.now() % SEG_MS) / 1000}s`;
  bar.classList.add('run');
}
function tick(){
  const i = segmentIndex(Date.now(), SEG_MS, ITEMS.length);
  if (i !== shown){ shown = i; renderSegment(i); syncProgress(); }
  renderTick(i);
}
tick();
setInterval(tick, 1000);

/* Narration reads the rendered DOM, so it always describes the segment on
   screen rather than a fixed script. */
initVoice({
  segmentMs: SEG_MS,
  /* A clear, neutral reader for a page that is mostly numbers. */
  prefer: [/samantha/i, /google uk english female/i, /serena/i, /martha/i, /\bflo\b/i],
  rate: 0.93, pitch: 1.0,
  lines: () => {
    const item = ITEMS[shown] || ITEMS[0];
    const count = el('count').textContent;
    const total = el('sub').textContent.replace(/^of about /, '').replace(/ expected.*$/, '');
    if (!count || count === '\u2014') return null;
    /* The on-screen caption opens with "Since midnight", which the first spoken
       sentence already says — read the place out of it and rephrase instead. */
    const place = (el('caption').textContent.match(/than live in (.+?)\.?$/) || [])[1];
    return [
      `Since midnight, an estimated ${count} ${item.phrase} worldwide.`,
      `By the end of today that figure is projected to reach about ${total}.`,
      place ? `That is already more than the entire population of ${place}.` : null
    ];
  }
});
</script>
<script type="module" src="js/ambient-ui.js"></script>
</body>
</html>
