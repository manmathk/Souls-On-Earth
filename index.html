<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Souls On Earth — World Population Live</title>
<style>
*{box-sizing:border-box}

/* --- YouTube mobile safe area ---------------------------------------------
   On a phone the YouTube player draws its own chrome over the video: action
   buttons down the right edge and the progress bar across the bottom. These
   insets hold the right-hand population figures and the last table row clear
   of it. --safe-x insets BOTH outer edges (the left column's ranks and the
   right column's figures); --pad-x is the interior gutter either side of the
   centre divider, which nothing can cover. Raise --safe-x / --safe-bottom if
   data still sits under the overlay -- the rows absorb it automatically.

   If --safe-x has to go so wide that country names start truncating, buy the
   room back by dropping --num (the population figure's type size). Those two
   knobs trade against each other; nothing else needs touching.
   -------------------------------------------------------------------------- */
:root{--pad-x:12px;--safe-x:24px;--safe-bottom:14px;--num:13.5px}

/* --- Themes ----------------------------------------------------------------
   Every neutral in this file is a token so the whole page can be recoloured
   from one block. The semantic accents are NOT themed away: the LIVE red, and
   the green/red on the birth and death counters, carry meaning, so they only
   shift enough to keep their contrast on a dark ground.

   The two gradient themes set --app to transparent so the body gradient shows
   through, and give the panels a faint veil instead of an opaque fill.
   -------------------------------------------------------------------------- */
:root{
 --bg:#fff; --app:#fff; --panel:#fff; --panel-alt:#fafafa;
 --chip:#f1f1f1; --avatar:#f0f0f0;
 --text:#222; --text-mid:#555; --text-dim:#777;
 --line:#e7e7e7; --line-soft:#eee; --line-row:#ededed; --line-strong:#ddd;
 --growth:#179447; --deaths:#d62c2c;
 --yt-bg:#ffe7e7; --yt-fg:#ff4d4d;
 --btn-bg:#fff; --btn-fg:#333;
 --mote-rgb:91,124,196;
}
html[data-theme="dark"]{
 --bg:#0f0f0f; --app:#0f0f0f; --panel:#0f0f0f; --panel-alt:#1c1c1c;
 --chip:#272727; --avatar:#272727;
 --text:#f1f1f1; --text-mid:#c9c9c9; --text-dim:#a3a3a3;
 --line:#2c2c2c; --line-soft:#262626; --line-row:#242424; --line-strong:#333;
 --growth:#3ddc84; --deaths:#ff6b6b;
 --yt-bg:#2c1517; --yt-fg:#ff8a8a;
 --btn-bg:#202020; --btn-fg:#f1f1f1;
 --mote-rgb:150,190,255;
}
html[data-theme="ocean"]{
 --bg:linear-gradient(165deg,#08172e 0%,#0e2f52 55%,#123f63 100%);
 --app:transparent; --panel:rgba(4,16,34,.42); --panel-alt:rgba(4,16,34,.60);
 --chip:rgba(255,255,255,.16); --avatar:rgba(255,255,255,.12);
 --text:#eaf3ff; --text-mid:#c8dcf2; --text-dim:#a8c6e2;
 --line:rgba(255,255,255,.15); --line-soft:rgba(255,255,255,.10);
 --line-row:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.20);
 --growth:#5ce8a4; --deaths:#ff8f8f;
 --yt-bg:rgba(255,255,255,.14); --yt-fg:#ffc0c0;
 --btn-bg:rgba(255,255,255,.16); --btn-fg:#eaf3ff;
 --mote-rgb:175,220,255;
}
html[data-theme="sunset"]{
 --bg:linear-gradient(165deg,#210b28 0%,#5c2338 52%,#8d3f2b 100%);
 --app:transparent; --panel:rgba(24,6,14,.46); --panel-alt:rgba(24,6,14,.62);
 --chip:rgba(255,255,255,.17); --avatar:rgba(255,255,255,.13);
 --text:#fff4ec; --text-mid:#f4d6c8; --text-dim:#e6bdac;
 --line:rgba(255,255,255,.16); --line-soft:rgba(255,255,255,.11);
 --line-row:rgba(255,255,255,.10); --line-strong:rgba(255,255,255,.21);
 --growth:#8ceeb0; --deaths:#ffc2b6;
 --yt-bg:rgba(255,255,255,.15); --yt-fg:#ffd0c6;
 --btn-bg:rgba(255,255,255,.17); --btn-fg:#fff4ec;
 --mote-rgb:255,216,175;
}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
body{display:flex;justify-content:center}
.app{width:100%;height:100%;max-width:900px;background:var(--app);overflow:hidden;display:flex;flex-direction:column}

/* Header / channel bar */
.channel{
  height:72px;display:flex;align-items:center;padding:8px 14px;
  border-bottom:1px solid var(--line);gap:10px;flex-shrink:0;background:var(--panel)
}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--avatar);flex-shrink:0;object-fit:cover;border:2px solid var(--line)}
.channel-info{min-width:0;flex:1}
.channel-name{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.channel-sub{font-size:13px;color:var(--text-dim);margin-top:2px}
.subscribe{border:0;border-radius:24px;background:var(--chip);color:var(--text);padding:11px 18px;font-size:16px;font-weight:700;white-space:nowrap;cursor:pointer;line-height:1}
.more{font-size:24px;line-height:1;margin-left:3px;color:var(--text-mid)}

/* Live summary */
.summary{display:grid;grid-template-columns:33% 67%;min-height:154px;background:var(--panel);border-bottom:1px solid var(--line-soft)}
.today{padding:12px 12px 8px;border-right:1px solid var(--line-soft);text-align:center}
.today-title{font-weight:800;font-size:13px;margin-bottom:8px}
.stat{margin:7px 0}
.stat-label{font-size:12px;color:var(--text-dim)}
.stat-value{font-size:19px;font-weight:800;margin-top:1px}
.growth{color:var(--growth)}
.deaths{color:var(--deaths)}
.hero{text-align:center;padding:18px 10px 10px}
.hero-title{font-size:18px;color:var(--text-mid);margin-bottom:5px}
.world-pop{font-size:clamp(34px,7vw,58px);line-height:1;font-weight:800;letter-spacing:-1.5px}
/* Each character of the counter is its own box so a single digit can be
   transformed without disturbing its neighbours. tabular-nums keeps the number
   from shuffling sideways as the digits change width. */
.world-pop .digit{display:inline-block;font-variant-numeric:tabular-nums}
.live-row{display:flex;justify-content:center;gap:12px;margin-top:13px}
.live{background:#ff0808;color:white;font-weight:800;border-radius:5px;padding:9px 25px;font-size:14px}
.live:before{content:"";display:inline-block;width:7px;height:7px;background:white;border-radius:50%;margin-right:7px;vertical-align:1px;animation:live-pulse 2s ease-in-out infinite}
/* One element pulsing, so it costs almost nothing -- unlike animating the
   per-second counters, which would run continuously for the life of the
   stream. */
@keyframes live-pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.live:before{animation:none}}
.yt{background:var(--yt-bg);color:var(--yt-fg);font-weight:800;border-radius:5px;padding:9px 25px;font-size:14px}

/* Banner */
.comment{
  height:39px;background:#ff0808;color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:800;letter-spacing:.2px;box-shadow:0 1px 4px rgba(0,0,0,.2);flex-shrink:0
}

/* Ranking */
.rank-head{
  min-height:42px;background:var(--panel-alt);border-bottom:1px solid var(--line-strong);display:flex;
  align-items:center;justify-content:center;text-align:center;padding:7px 14px;
  font-size:13px;font-weight:800;color:var(--text-dim);text-transform:uppercase;flex-shrink:0;letter-spacing:.3px
}
.rank-wrap{flex:1;min-height:0;overflow:hidden;background:var(--panel);padding-bottom:var(--safe-bottom)}
.rank-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr;height:100%}
.col{min-width:0;min-height:0;display:flex;flex-direction:column}
.col:first-child{border-right:1px solid var(--line-soft)}
/* Rows share the available height, so all 25 per column stay on screen no
   matter how short the viewport is — padding never pushes a row out. At 25
   rows a phone gives each one under 19px, so the flag (the tallest thing in
   a row, and what actually sets the row height) is capped against viewport
   height rather than given a fixed size. */
.country{
  flex:1;min-height:0;overflow:hidden;display:grid;grid-template-columns:28px 30px minmax(0,1fr) auto;
  align-items:center;gap:8px;padding:clamp(0.5px,0.25vh,9px) var(--pad-x);
  border-bottom:1px solid var(--line-row);font-size:14px;line-height:1.2
}
/* Each column has one edge at the frame boundary: that side takes the inset. */
#left .country{padding-left:calc(var(--pad-x) + var(--safe-x))}
#right .country{padding-right:calc(var(--pad-x) + var(--safe-x))}
.rank{color:var(--text-dim);text-align:center;font-size:12px}
.flag{font-size:min(20px,1.5vh);text-align:center}
.name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop{font-variant-numeric:tabular-nums;font-weight:700;font-size:var(--num)}
#left .country:nth-child(-n+3) .name{font-weight:700}

/* mobile adjustments */
@media(max-width:520px){
 .channel{height:68px;padding:7px 10px}
 .avatar{width:43px;height:43px}
 .channel-name{font-size:15px}
 .subscribe{padding:10px 16px;font-size:13px}
 .summary{min-height:151px}
 .today{padding:10px 5px}
 .today-title{font-size:12px}
 .stat-label{font-size:11px}
 .stat-value{font-size:17px}
 .hero-title{font-size:16px}
 .world-pop{font-size:clamp(29px,8.7vw,44px)}
 .live-row{gap:8px;margin-top:10px}
 .live,.yt{padding:8px 16px;font-size:12px}
 .comment{font-size:13px;height:37px}
 .rank-head{font-size:11px;min-height:40px;padding:7px 10px;line-height:1.25}
 /* Everything that competes for room across a row scales continuously with
    viewport width -- no steps. These used to jump at 395px and 340px, which
    left a gap either side of 402px (iPhone 16 Pro): the figure had grown to
    the full 3.05vw while the gutters and the rank/flag columns were still at
    their widest, and "Bangladesh" lost its tail to an ellipsis.

    --num is also capped against viewport height, because at 25 rows per
    column a short handset gives each row ~13px and a figure sized only by
    width overflows that and gets its glyphs sliced. */
 :root{
  --pad-x:clamp(3px,1.1vw,5px);
  --safe-x:clamp(13px,4.6vw,20px);
  --safe-bottom:clamp(12px,3.6vw,16px);
  --num:min(clamp(10.2px,2.85vw,12.5px),1.38vh)
 }
 /* font-size here only sets the line box: rank, flag, name and figure all
    carry their own size. 25 rows per column leaves under 19px each on a tall
    handset and barely 13px on a 667pt one, so the line box and the flag are
    both capped against viewport height -- a fixed size clips every row on the
    short phones. */
 .country{
  grid-template-columns:clamp(12px,3.4vw,15px) clamp(15px,4.2vw,19px) minmax(0,1fr) auto;
  gap:clamp(2px,0.9vw,4px);font-size:min(12px,1.34vh);
  padding:clamp(0.5px,0.15vh,8px) var(--pad-x)
 }
 .rank{font-size:min(10px,1.3vh)}
 .name{font-size:min(clamp(9.6px,2.9vw,12.5px),1.38vh);letter-spacing:-.3px}
 .flag{font-size:min(11px,1.28vh)}
}


/* --- Ambient drift ---------------------------------------------------------
   Layered OVER the page, not behind it: every panel here paints an opaque
   white background, so particles underneath would never be seen at all.

   Pure CSS on the compositor -- no canvas, no requestAnimationFrame. On a
   phone that is also encoding video for the stream, a per-frame JS loop
   competes with the encoder and makes heat; these are transform/opacity only
   and cost the main thread nothing.

   Faint by design: 50 rows of names and 9-digit figures sit underneath, and
   they are what the viewer is meant to read. -------------------------------- */
/* Longhand rather than inset:0 -- the shorthand needs Safari 14.1, and this
   page has to survive whatever handset is running the stream. A collapsed
   layer plus overflow:hidden would silently show nothing at all. */
.souls{position:fixed;top:0;right:0;bottom:0;left:0;z-index:40;pointer-events:none;overflow:hidden}
.souls i{
  position:absolute;bottom:-10vh;left:var(--x);width:var(--s);height:var(--s);
  border-radius:50%;opacity:0;
  background:radial-gradient(circle,rgba(var(--mote-rgb),.95) 0%,rgba(var(--mote-rgb),0) 70%);
  animation:soul-rise var(--t) linear var(--d) infinite
}
@keyframes soul-rise{
  0%{transform:translate(0,0);opacity:0}
  14%{opacity:.42}
  50%{transform:translate(9px,-58vh)}
  86%{opacity:.42}
  100%{transform:translate(-7px,-118vh);opacity:0}
}
/* Decorative only, so it simply goes away rather than degrading. */
@media(prefers-reduced-motion:reduce){.souls{display:none}}

.music-btn{position:fixed;right:12px;top:12px;z-index:50;border:1px solid var(--line-strong);background:var(--btn-bg);color:var(--btn-fg);border-radius:50%;width:34px;height:34px;padding:0;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer}
/* Each button keeps one constant icon and signals off by dimming. Swapping in
   a muted-speaker glyph would give both buttons the same off-state icon, and
   with the text labels gone there would be nothing left to tell them apart. */
.music-btn.off{opacity:.4;filter:grayscale(1)}

</style>

   The counters are driven by real time, not by page load, so they never reset
   on deploy or refresh: every figure is its baseline plus the elapsed time
   since that baseline's anchor date. What DOES go stale is the baseline
   itself, so the page refreshes it at runtime from World Bank open data
   (keyless, CORS-enabled, cached for a day) and re-ranks the table from it.
   No redeploy needed to stay current.

   SNAPSHOT below is the built-in mid-2026 UN baseline. It paints the first
   frame instantly, covers the offline case, and stays in charge for as long
   as it is more current than what the live source offers.

};

const CACHE_KEY="souls-baseline-v2";   // v1 cached a mis-anchored world total
const CACHE_TTL=864e5;   // re-check the live source once a day

/* UN WPP projections stay the source of truth for growth rates: a projection
   looks forward, where a World Bank CAGR can only average the years already
   on record. So when the live feed wins on freshness we take its observed
   levels and its ranking, but restore the snapshot's projected rate for every
   country the snapshot covers. The other POOL countries keep the feed's own
   CAGR -- there is no UN figure here to prefer. Matched on display name,
   which is the only key the two lists share. */
const UN_RATES=new Map(SNAPSHOT.countries.slice(0,UN_COUNT).map(c=>[c[1],c[3]]));

function withUnRates(b){
 let kept=0;
 const countries=b.countries.map(c=>{
  if(!UN_RATES.has(c[1])) return c;
  kept++;
  return [c[0],c[1],c[2],UN_RATES.get(c[1])];
 });
 return {...b,countries,rates:`UN WPP for ${kept}/${countries.length}, World Bank CAGR for the rest`};
}

/* Prefer whichever baseline is anchored to the later year. Right now the
   built-in 2026 snapshot beats the World Bank's 2025 release; once the Bank
   publishes 2026 the live feed takes over -- carrying UN rates with it. */
const newer=(a,b)=>(b&&b.year>a.year)?withUnRates(b):a;

let data=SNAPSHOT;
try{
 const c=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");
 if(c&&c.year&&c.countries&&c.countries.length) data=newer(data,c);
}catch(e){}

/* Always group in thousands. A bare toLocaleString() follows the device
   locale, so en-IN phones rendered 1,47,66,25,576 instead of 1,476,625,576. */
const nf=new Intl.NumberFormat("en-US");
const fmt=n=>nf.format(n);

/* Growth is measured from the date the baseline is actually true for, so use
   its asOf stamp. Older cached baselines have no stamp, so fall back to
   1 July -- the mid-year reference date both the UN and the World Bank
   publish against. */
function anchor(){
 const t=data.asOf?Date.parse(data.asOf+"T00:00:00Z"):NaN;
 return Number.isFinite(t)?t:Date.UTC(data.year,6,1);
}
const elapsed=()=>(Date.now()-anchor())/1000;
const birthsPerSec=()=>data.birthsPerYear/SECS_PER_YEAR;
const deathsPerSec=()=>data.deathsPerYear/SECS_PER_YEAR;
const netPerSec=()=>birthsPerSec()-deathsPerSec();

function worldPopulation(){
 return Math.floor(data.world+elapsed()*netPerSec());
}
function todaySeconds(){
 const d=new Date(), m=new Date(d.getFullYear(),d.getMonth(),d.getDate());
 return (Date.now()-m.getTime())/1000;
}
/* Compound the country's annual rate over the time since the anchor, so a
   positive rate grows and a negative one shrinks at a rate proportional to
   what is left. Applying the rate to the frozen baseline instead makes a
   shrinking country fall linearly -- past zero, given a stale enough
   baseline -- and drifts millions off a growing one within a few years. */
function countryPopulation(c){
 return Math.floor(c[2]*Math.pow(1+c[3]/100,elapsed()/SECS_PER_YEAR));
}

/* Row order follows the live figures, not the baseline order, so a country
   that overtakes another actually changes rank on screen. Without this the
   numbers keep moving while the ranks stay frozen at whatever the baseline
   said -- one year past the anchor the snapshot already has Egypt above
   Japan and DR Congo above the Philippines. */
function ranking(){
 const live=data.countries.map(countryPopulation);
 return data.countries.map((c,i)=>i)
  .sort((a,b)=>live[b]-live[a])
  .slice(0,SHOW);
}
let order=[];

function countryRow(idx,rank){
 const c=data.countries[idx];
 return `<div class="country" data-i="${idx}">
   <div class="rank">${rank+1}</div>
   <div class="flag">${c[0]}</div>
   <div class="name">${c[1]}</div>
   <div class="pop" data-i="${idx}">${fmt(countryPopulation(c))}</div>
 </div>`;
}

const MOVE_MS=380;
const TINT="rgba(255,196,0,.5)";

/* Where every row currently sits, keyed by country.

   offsetLeft/offsetTop rather than getBoundingClientRect(): a client rect
   folds in any transform still in flight from a previous swap, so a second
   overtake arriving mid-animation would measure a displaced row and animate
   from a corrupted origin. Layout offsets ignore transforms entirely. */
function rowPositions(){
 const m=new Map();
 for(const el of document.querySelectorAll(".country")){
  m.set(Number(el.dataset.i),{x:el.offsetLeft,y:el.offsetTop});
 }
 return m;
}

/* Rows are thrown away wholesale by the re-render below, and an animation on a
   detached row keeps ticking against the document timeline. Cancel them first
   so nothing accumulates over the weeks this page stays open -- and so a swap
   landing mid-animation starts from a settled layout. */
function stopRowAnimations(){
 for(const el of document.querySelectorAll(".country")){
  if(el.getAnimations) for(const a of el.getAnimations()) a.cancel();
 }
}

/* An overtake is the one moment this table is genuinely live rather than just
   counting upward, and a wholesale innerHTML re-render turns it into a jump
   cut nobody notices. So: animate each moved row from where it used to be to
   where it landed, and tint it briefly so the eye catches which pair crossed.
   Transform only, so none of this costs a layout. */
function animateShifts(shifts){
 if(!shifts.size) return;
 for(const el of document.querySelectorAll(".country")){
  const s=shifts.get(Number(el.dataset.i));
  if(!s||!el.animate) continue;   // no WAAPI on very old WebKit: no animation, same table
  /* Web Animations rather than a transition class: each animation cleans
     itself up, which is what matters on a page left open for weeks. */
  el.animate([{transform:`translate(${s.dx}px,${s.dy}px)`},{transform:"none"}],
   {duration:MOVE_MS,easing:"cubic-bezier(.22,.61,.36,1)"});
  el.animate([{backgroundColor:TINT},{backgroundColor:"transparent"}],
   {duration:MOVE_MS*2,easing:"ease-out"});
 }
}

const STILL=window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)");

/* A hidden page freezes the animation timeline, which would park an animation
   on its first keyframe until the browser came forward. An un-animated repaint
   is always correct, just less pretty. */
function motionOk(){
 return !((STILL&&STILL.matches)||document.hidden);
}

function render(){
 const half=Math.ceil(order.length/2);
 stopRowAnimations();
 const before=rowPositions();
 document.getElementById("left").innerHTML=order.slice(0,half).map((idx,r)=>countryRow(idx,r)).join("");
 document.getElementById("right").innerHTML=order.slice(half).map((idx,r)=>countryRow(idx,r+half)).join("");
 document.getElementById("rankHead").textContent=
  `TOP ${order.length} LARGEST COUNTRIES BY POPULATION (LIVE)`;
 /* Skipped when the page is hidden: a backgrounded tab freezes the animation
    timeline, and a swap animated there would leave its rows parked at the
    start keyframe -- visibly displaced -- until the phone brought the browser
    back. An un-animated re-render is always correct, just less pretty. */
 if(motionOk()) animateShifts(computeShifts(before,rowPositions()));
}

function build(){
 order=ranking();
 render();
}

const DIGIT_MS=260;
const worldEl=document.getElementById("world");
let worldSpans=[];
let worldText="";

/* The counter is the one thing on this page that changes every single second,
   so it is where motion is actually visible -- the rank swaps it sits above
   only happen every week or so. Only the characters that moved get animated;
   at roughly two souls a second that is the last digit or two, not all
   thirteen. */
function paintWorld(text){
 const {rebuild,changed}=diffDigits(worldText,text);
 worldText=text;
 if(rebuild){
  worldEl.textContent="";
  worldSpans=[...text].map(ch=>{
   const el=document.createElement("span");
   el.className="digit";
   el.textContent=ch;
   worldEl.appendChild(el);
   return el;
  });
  return;
 }
 const moving=motionOk();
 for(const i of changed){
  const el=worldSpans[i];
  el.textContent=text[i];
  if(!moving||!el.animate) continue;
  /* This runs about ninety thousand times a day, so a digit whose previous
     roll has not finished -- a throttled timeline, low power mode -- must not
     be allowed to stack a second one on top. */
  for(const a of el.getAnimations()) a.cancel();
  /* Rolls up into place from just below the baseline. */
  el.animate([{transform:"translateY(0.42em)",opacity:0.35},{transform:"none",opacity:1}],
   {duration:DIGIT_MS,easing:"cubic-bezier(.2,.7,.3,1)"});
 }
}

function update(){
 const t=todaySeconds();
 paintWorld(fmt(worldPopulation()));
 document.getElementById("births").textContent=fmt(Math.floor(t*birthsPerSec()));
 document.getElementById("deaths").textContent=fmt(Math.floor(t*deathsPerSec()));
 document.getElementById("growth").textContent=fmt(Math.floor(t*netPerSec()));

 /* A full re-render only when someone has actually changed places -- every
    other tick just repaints the figures already in the right rows. */
 const next=ranking();
 if(next.length!==order.length||next.some((idx,i)=>idx!==order[i])){
  order=next;
  render();
  /* The narrator listens for this; nothing else does. Kept as a plain event so
     a narration fault can never reach the counter. */
  document.dispatchEvent(new CustomEvent("souls:tick",{detail:{
    births:Math.floor(t*birthsPerSec()),
    deaths:Math.floor(t*deathsPerSec()),
    growth:Math.floor(t*netPerSec()),
    order:order.map(i=>data.countries[i][1])
  }}));
  return;
 }

 document.querySelectorAll(".pop").forEach(el=>{
   el.textContent=fmt(countryPopulation(data.countries[Number(el.dataset.i)]));
 });

 /* The narrator listens for this; nothing else does. Kept as a plain event so
    a narration fault can never reach the counter. */
 document.dispatchEvent(new CustomEvent("souls:tick",{detail:{
   births:Math.floor(t*birthsPerSec()),
   deaths:Math.floor(t*deathsPerSec()),
   growth:Math.floor(t*netPerSec()),
   order:order.map(i=>data.countries[i][1])
 }}));
}

build();
update();
setInterval(update,1000);

/* --- Live baseline refresh ------------------------------------------------
   World Bank open data: no key, CORS-enabled, ~1 request per indicator.
   Growth is a CAGR across the returned years rather than a single-year
   delta, so one revised release cannot distort a country's rate.
   Any failure here is silent by design -- the page keeps whatever baseline
   it is already showing. */
const WB="https://api.worldbank.org/v2/country/";
const get=u=>fetch(u).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});

/* A World Bank response reduced to {year:value}. */
function series(j){
 const out={};
 for(const r of ((j&&j[1])||[])) if(typeof r.value==="number") out[+r.date]=r.value;
 return out;
}
/* The value for `year`, else the closest earlier year on record. The crude
   rate indicators trail the population series by one release, so this keeps
   a refresh usable instead of discarding it. */
function at(s,year){
 const ys=Object.keys(s).map(Number).filter(y=>y<=year).sort((a,b)=>b-a);
 return ys.length?s[ys[0]]:null;
}

async function fetchBaseline(){
 const codes=Object.keys(POOL).join(";");
 const [pop,wld,cbrt,cdrt]=await Promise.all([
  get(`${WB}${codes}/indicator/SP.POP.TOTL?format=json&mrv=4&per_page=500`),
  get(`${WB}WLD/indicator/SP.POP.TOTL?format=json&mrv=4`),
  get(`${WB}WLD/indicator/SP.DYN.CBRT.IN?format=json&mrv=4`),
  get(`${WB}WLD/indicator/SP.DYN.CDRT.IN?format=json&mrv=4`)
 ]);

 const wldPop=series(wld), cbr=series(cbrt), cdr=series(cdrt);

 const by={};
 for(const r of (pop[1]||[])){
  if(typeof r.value==="number" && POOL[r.countryiso3code])
   (by[r.countryiso3code]||(by[r.countryiso3code]={}))[+r.date]=r.value;
 }

 const rows=[];
 for(const code in by){
  const v=by[code], ys=Object.keys(v).map(Number).sort((a,b)=>a-b);
  if(ys.length<2) continue;
  const lo=ys[0], hi=ys[ys.length-1];
  const growth=(Math.pow(v[hi]/v[lo],1/(hi-lo))-1)*100;
  rows.push({code,year:hi,pop:v[hi],growth:+growth.toFixed(2)});
 }

 /* One year has to govern the whole baseline, because that year's 1 July is
    the date everything gets extrapolated from. Take the newest year reported
    by both the country pool and the world series: pairing a 2026 world total
    with a 2025 anchor would double-count a year of growth (~70 million). */
 const shared=rows.map(r=>r.year).filter(y=>y in wldPop);
 if(!shared.length) throw new Error("no shared year");
 const year=Math.max(...shared);

 const world=wldPop[year], br=at(cbr,year), dr=at(cdr,year);
 if(!world||!br||!dr||br<=dr) throw new Error("bad world figures");

 const ranked=rows.filter(r=>r.year===year).sort((a,b)=>b.pop-a.pop);
 /* A floor, not SHOW: POOL holds exactly SHOW countries, so demanding all of
    them would let one country missing from a future World Bank release throw
    the whole refresh away and strand the page on the 30-row snapshot. */
 if(ranked.length<MIN_ROWS) throw new Error("not enough countries");

 return {
  year, asOf:`${year}-07-01`, source:"World Bank open data",
  world, birthsPerYear:br/1000*world, deathsPerYear:dr/1000*world,
  countries:ranked.slice(0,SHOW).map(r=>[POOL[r.code][0],POOL[r.code][1],r.pop,r.growth])
 };
}

async function refresh(){
 let stamp=0;
 try{stamp=+(localStorage.getItem(CACHE_KEY+":at")||0)}catch(e){}
 if(Date.now()-stamp<CACHE_TTL) return;
 try{
  const live=await fetchBaseline();
  try{
   localStorage.setItem(CACHE_KEY,JSON.stringify(live));
   localStorage.setItem(CACHE_KEY+":at",String(Date.now()));
  }catch(e){}
  const chosen=newer(data,live);
  if(chosen!==data){ data=chosen; build(); update(); }
 }catch(e){/* offline or API hiccup: keep the current baseline */}
}
refresh();

/* Theme cycles on tap and persists, the same shape as the music and voice
   toggles. "light" clears the attribute rather than setting it, so the default
   palette lives in :root alone and there is no duplicate light theme block. */
const THEMES=["light","dark","ocean","sunset"];
let themeAt=0;
try{
 const saved=localStorage.getItem("souls-theme");
 if(THEMES.indexOf(saved)>0) themeAt=THEMES.indexOf(saved);
}catch(e){}

function applyTheme(){
 const name=THEMES[themeAt];
 if(name==="light") document.documentElement.removeAttribute("data-theme");
 else document.documentElement.setAttribute("data-theme",name);
 try{localStorage.setItem("souls-theme",name);}catch(e){}
}

const themeBtn=document.getElementById("themeBtn");
if(themeBtn){
 /* Deliberately not stopping propagation: the tap should also count as the
    first user gesture that unlocks audio. */
 themeBtn.addEventListener("click",()=>{
  themeAt=(themeAt+1)%THEMES.length;
  applyTheme();
 });
}
applyTheme();

// Inspect the active baseline from the console: __souls.data.source / .year
window.__souls={get data(){return data},refresh,SNAPSHOT};
</script>

<button class="music-btn" id="musicBtn" type="button" aria-label="Toggle music">🔊</button>
<script type="module">
import { createPlaylist } from "./js/playlist.js";

/* The background music bed. Add filenames here to extend the rotation; the
   playlist shuffles them, plays through, and reshuffles.

   One <audio> element serves every track, with its src swapped between them.
   js/narrator.js binds a MediaElementSource to this exact element so the bed
   can be ducked under voice clips, and that binding follows the element, not
   the src — a second element would need its own source node and would never
   get ducked. */
const TRACKS = [
  "Felt Keys for Marchers.mp3",
  "Faith build up.mp3",
   "Gentle+Dreams (1).mp3",
   "Gentle+Dreams.mp3",
   "Through+the+Foggy+Gates.mp3"
];

(function(){
  const audio=document.getElementById("bgMusic");
  const btn=document.getElementById("musicBtn");
  if(!audio||!btn)return;
  // Pre-unlock fallback only: this listener can fire before narrator.js's
  // module script runs unlock() and connects musicGain, so the element could
  // otherwise play a beat at full volume. This is a no-op on iOS and roughly
  // correct on Android in that gap. Once unlock() runs, musicGain owns the
  // audible level (it sets audio.volume=1 first, so there is no double
  // attenuation) and this line stops mattering.
  audio.volume=0.18;

  const playlist=createPlaylist({tracks:TRACKS});
  let current=null;
  let exhausted=false;

  function render(){
    btn.classList.toggle("off",audio.paused||exhausted);
  }

  // Loads the next track into the element. False means every track has failed
  // and there is nothing left to play — callers must stop rather than retry,
  // or a fully-broken TRACKS list spins.
  function cue(){
    const next=playlist.next();
    if(!next){exhausted=true;current=null;render();return false;}
    current=next;
    audio.src=next;
    return true;
  }

  async function play(){
    if(exhausted)return;
    audio.muted=false;
    // A pause keeps `current`, so resuming picks the track back up rather
    // than skipping to the next one.
    if(!current&&!cue())return;
    try{await audio.play();}catch(e){}
    render();
  }

  function pause(){
    audio.pause();
    render();
  }

  audio.addEventListener("ended",function(){
    if(cue())play();
  });

  // A file that 404s or fails to decode is retired for the session and the bed
  // moves on, so one bad filename in TRACKS cannot silence the stream. This
  // terminates: every retirement shrinks the pool, and cue() reports false
  // once the pool is empty.
  audio.addEventListener("error",function(){
    if(!current)return;
    playlist.retire(current);
    current=null;
    if(cue())play();
  });

  btn.addEventListener("click",function(e){
    e.stopPropagation();
    // Persist the intent rather than audio.paused: play() calls the element's
    // play() synchronously, so by the time a second handler read .paused it
    // would already be false and store the opposite of what was clicked.
    const on=audio.paused;
    if(on) play(); else pause();
    try{localStorage.setItem("souls-music",on?"on":"off");}catch(e){}
  });

  // Browsers block audible autoplay. If music was enabled previously,
  // start it after the first user interaction.
  let wanted=false;
  try{wanted=localStorage.getItem("souls-music")!=="off";}catch(e){wanted=true}

  function firstGesture(){
    if(wanted) play();
    document.removeEventListener("click",firstGesture);
    document.removeEventListener("touchstart",firstGesture);
    document.removeEventListener("keydown",firstGesture);
  }
  document.addEventListener("click",firstGesture,{once:true});
  document.addEventListener("touchstart",firstGesture,{once:true});
  document.addEventListener("keydown",firstGesture,{once:true});

  audio.addEventListener("play",render);
  audio.addEventListener("pause",render);
  render();
})();
</script>
