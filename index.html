r;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--text-mid);letter-spacing:.12em;text-transform:uppercase}.panel-body{padding:8px 8px 10px;display:flex;flex-direction:column;gap:6px;min-height:0}.country{display:grid;grid-template-columns:22px 28px minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 6px;border-radius:10px;border:1px solid transparent;transition:.2s ease}.country:hover{background:rgba(0,0,0,.02);border-color:var(--line-soft)}.country .rank{font-size:11px;font-weight:800;color:var(--text-dim);text-align:center}.country .flag{font-size:20px;display:flex;justify-content:center}.country .name{font-size:14px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.country .pop{font-size:13px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}.country .trend{font-size:10px;font-weight:700;padding:4px 6px;border-radius:999px;background:rgba(109,197,143,.12);color:#36a366}.country.negative .trend{background:rgba(217,117,117,.09);color:#d36666}.country .empty{color:var(--text-dim);font-size:12px;padding:12px 8px;text-align:center}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 4px}.stat{padding:10px 12px;border:1px solid var(--line);background:var(--panel-alt);border-radius:14px;display:flex;flex-direction:column;gap:6px}.stat .label{font-size:10px;letter-spacing:.12em;color:var(--text-dim);text-transform:uppercase}.stat .value{font-size:clamp(16px,2vw,26px);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}.stat .value.birth{color:#2ea66f}.stat .value.death{color:#d75d5d}.stat .value.net{color:var(--accent)}.status-row{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 0;color:var(--text-dim);font-size:11px;letter-spacing:.06em;text-transform:uppercase}.status-row strong{font-weight:800;color:var(--text)}.souls{position:fixed;top:0;right:0;bottom:0;left:0;z-index:40;pointer </head>
<body>
<div class="app">
  <div class="channel">
    <img class="avatar" src="channels4_profile.jpg" alt="History Warrior Logo">
    <div class="channel-info">
      <div class="channel-name">History Warrior</div>
      <div class="channel-sub"><span class="live-dot"></span>Live global population tracker</div>
    </div>
    <div class="top-meta">
      <button class="theme-toggle" type="button" aria-label="Toggle theme">Theme</button>

  </div>

  <div class="hero">

  <div class="table">

      <div class="stat"><div class="label">Deaths today</div><div class="value death" id="deaths">—</div></div>

    </div>

    <div class="rankings">
      <div class="panel">
        <div class="panel-header"><span>Top countries</span><span id="rank-count">#1-25</span></div>
        <div class="panel-body" id="leftCol"></div>
      </div>
      <div class="panel">
        <div class="panel-header"><span>Top countries</span><span id="rank-count-2">#26-50</span></div>
        <div class="panel-body" id="rightCol"></div>
      </div>
    </div>
  </div>

  <div class="status-row">
    <span>Baseline: <strong id="baseline">loading…</strong></span>
    <span id="status">Est. by annual growth</span>
  </div>
</div>
<div class="souls" aria-hidden="true"><i style="--x:4%;--s:16px;--t:31s;--d:-2s"></i><i style="--x:11%;--s:11px;--t:24s;--d:-14s"></i><i style="--x:17%;--s:22px;--t:37s;--d:-6s"></i><i style="--x:23%;--s:18px;--t:25s;--d:-8s"></i><i style="--x:29%;--s:13px;--t:33s;--d:-20s"></i><i style="--x:34%;--s:15px;--t:28s;--d:-12s"></i><i style="--x:41%;--s:17px;--t:36s;--d:-3s"></i><i style="--x:47%;--s:12px;--t:26s;--d:-18s"></i><i style="--x:54%;--s:21px;--t:39s;--d:-9s"></i><i style="--x:61%;--s:14px;--t:23s;--d:-16s"></i><i style="--x:68%;--s:17px;--t:32s;--d:-5s"></i><i style="--x:75%;--s:11px;--t:27s;--d:-11s"></i><i style="--x:82%;--s:16px;--t:40s;--d:-22s"></i><i style="--x:89%;--s:14px;--t:30s;--d:-7s"></i><i style="--x:96%;--s:10px;--t:24s;--d:-15s"></i></div>
<script type="module">
import { computeShifts } from "./js/flip.js";
import { diffDigits } from "./js/digits.js";
import "./js/ambient-ui.js";

const SECS_PER_YEAR=365.25*86400;
const SNAPSHOT={year:2026,asOf:"2026-07-01",world:8300678395,birthsPerYear:132503469,deathsPerYear:63637314,countries:[["🇮🇳","India",1476625576,0.87],["🇨🇳","China",1412914089,-0.22],["🇺🇸","U.S.A.",349035494,0.51],["🇮🇩","Indonesia",287886782,0.76],["🇵🇰","Pakistan",259299791,1.6],["🇳🇬","Nigeria",242431832,2.06],["🇧🇷","Brazil",213562666,0.35],["🇧🇩","Bangladesh",177818044,1.21],["🇷🇺","Russia",143394458,-0.42],["🇪🇹","Ethiopia",138902185,2.53],["🇲🇽","Mexico",132597205,0.77],["🇯🇵","Japan",123291000,-0.53],["🇵🇭","Philippines",119785000,1.33],["🇪🇬","Egypt",119290000,1.68],["🇨🇴","Colombia",117588000,0.65],["🇹🇷","Turkey",86038874,0.76],["🇮🇷","Iran",90247908,0.79],["🇦🇫","Afghanistan",41076613,2.4],["🇩🇪","Germany",84408290,-0.17],["🇹🇿","Tanzania",65356131,2.75],["🇰🇪","Kenya",55060747,1.95],["🇦🇷","Argentina",45738299,0.9],["🇦🇱","Albania",2829091,-0.01],["🇬🇭","Ghana",35286364,1.91],[""], [""], [""], [""], [""], [""], [""], [""], [""], [""], [""], [""], [""],[""],[""],[""],[""],[""],[""],[""],[""],[""],[""],[""],[""],[""],[""],[""],[""],[""],[""],[""],[""],[""],[""],[""],[""],[""],[""],[""],[""],[""],[""],[""],[""],[""],[""],[""],[""],[""],[""],[""]]};
const UN_COUNT=30,SHOW=50,MIN_ROWS=30;const POP=new Map();const CACHE_KEY="souls-baseline-v2",CACHE_TTL=864e5,UN_RATES=new Map(SNAPSHOT.countries.slice(0,UN_COUNT).map(c=>[c[1],c[3]])),nf=new Intl.NumberFormat("en-US");const newer=(a,b)=>b&&b.year>a.year?b:a;
let data=structuredClone(SNAPSHOT);
const elapsed=()=>((Date.now()-(data.asOf?Date.parse(data.asOf+"T00:00:00Z"):Date.UTC(data.year,6,1)))/1000),birthsPerSec=()=>data.birthsPerYear/SECS_PER_YEAR,deathsPerSec=()=>data.deathsPerYear/SECS_PER_YEAR,netPerSec=()=>birthsPerSec()-deathsPerSec();
const fmt=n=>nf.format(Math.max(0,Math.round(Number(n)||0)));
const pct=(n)=>`${(Number(n)||0).toFixed(1)}%`;
function countryPopulation(c){
  if(!Array.isArray(c)) return 0;
  const pop=Number(c[2]), rate=Number(c[3]);
  if(!Number.isFinite(pop)||!Number.isFinite(rate)||pop<0) return 0;
  const years=elapsed()/SECS_PER_YEAR;
  const factor=Math.pow(1+rate/100,years);
  return Number.isFinite(factor)?Math.floor(pop*factor):0;
}
function ranking(){
  const valid=data.countries.map((c,i)=>Array.isArray(c)&&c.length>=4?i:-1).filter(i=>i>=0);
  const live=data.countries.map(countryPopulation);
  return valid.sort((a,b)=>live[b]-live[a]).slice(0,SHOW);
}
let order=[];const rowPositions=()=>{const m=new Map();document.querySelectorAll(".country").forEach(e=>m.set(+e.dataset.i,{x:e.offsetLeft,y:e.offsetTop}));return m};function stopRowAnimations(){document.querySelectorAll(".country").forEach(e=>e.style.transition="none")}
function renderList(list, items){
  if(!list) return;
  list.innerHTML = items.length ? items.map((item, index)=>`<div class="country ${item.rate < 0 ? 'negative' : ''}" data-i="${item.index}"><div class="rank">${index+1}</div><div class="flag">${item.flag}</div><div class="name">${item.name}</div><div class="pop">${fmt(item.population)}</div><div class="trend">${item.rate >= 0 ? '+' : ''}${pct(item.rate)}</div></div>`).join("") : '<div class="empty">No data</div>';
}
function refresh(){
  const ranked=ranking();
  const items=ranked.map((idx,i)=>{
    const c=data.countries[idx];
    return {index:idx,flag:c[0],name:c[1],population:countryPopulation(c),rate:Number(c[3]),label:c[1]};
  });
  renderList(document.getElementById("leftCol"), items.slice(0,Math.ceil(items.length/2)));
  renderList(document.getElementById("rightCol"), items.slice(Math.ceil(items.length/2)));
  const worldText=fmt(Math.floor(data.world+elapsed()*netPerSec()));
  document.getElementById("world").textContent = worldText;
  document.getElementById("births").textContent = fmt(Math.floor(elapsed()*birthsPerSec()));
  document.getElementById("deaths").textContent = fmt(Math.floor(elapsed()*deathsPerSec()));
  document.getElementById("net").textContent = fmt(Math.floor(elapsed()*netPerSec()));
  const delta = birthPerSecondDelta();
  document.getElementById("delta").textContent = `${delta>0?'+':''}${fmt(delta)} / sec`;
  document.getElementById("asof").textContent = `Updated ${data.asOf || new Date().toISOString().slice(0,10)}`;
  document.getElementById("baseline").textContent = data.asOf || '2026-07-01';
}
function birthPerSecondDelta(){return birthsPerSec()-deathsPerSec();}
const WB="https://api.worldbank.org/v2/country/",get=u=>fetch(u).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}),series=j=>{const o={};for(const r of((j&&j[1])||[]))if(typeof r.value==="number"){const code=String(r.countryiso3code||"").toUpperCase(),year=Number(String(r.date).slice(0,4));if(!code||!/^\w{3}$/.test(code))continue;const existing=o[code];if(!existing||year>existing.year)o[code]={value:r.value,year,name:String(r.country?.value||code)};} return o};
async function loadWorldBank(){
  try{
    const popAll=await get("/country/all/indicator/SP.POP.TOTL?format=json&mrv=8&per_page=10000");
    const birthAll=await get("/country/all/indicator/SP.DYN.CBRT.IN?format=json&mrv=8&per_page=10000");
    const deathAll=await get("/country/all/indicator/SP.DYN.CDRT.IN?format=json&mrv=8&per_page=10000");
    const pm=series(popAll), bm=series(birthAll), dm=series(deathAll), wPop=pm.WLD, wBirth=bm.WLD, wDeath=dm.WLD;
    if(wPop&&wBirth&&wDeath){
      data={
        year:Math.max(wPop.year,wBirth.year,wDeath.year),
        asOf:String(new Date().toISOString().slice(0,10)),
        world:wPop.value,
        birthsPerYear:wBirth.value*wPop.value/1000,
        deathsPerYear:wDeath.value*wPop.value/1000,
        countries:SNAPSHOT.countries.map(([flag,name,pop,rate])=>[flag,name,pop,rate])
      };
    }
  }catch(e){console.warn("World Bank fallback used",e);}
  refresh();
}

const THEMES=['light','dark','ocean','sunset'];let themeAt=0;try{const saved=localStorage.getItem('souls-theme');if(THEMES.includes(saved))themeAt=THEMES.indexOf(saved)}catch(e){}
function applyTheme(){const t=THEMES[themeAt];document.documentElement.setAttribute('data-theme',t);document.querySelector('.theme-toggle').textContent=t.charAt(0).toUpperCase()+t.slice(1)}
function cycleTheme(){themeAt=(themeAt+1)%THEMES.length;try{localStorage.setItem('souls-theme',THEMES[themeAt])}catch(e){}applyTheme()}
document.querySelector('.theme-toggle').addEventListener('click',cycleTheme);
applyTheme();
setInterval(refresh,1000);
loadWorldBank();
</script>
