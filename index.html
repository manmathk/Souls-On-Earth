<body>

<script type="module">
import { computeShifts } from "./js/flip.js";

import "./js/ambient-ui.js";

const SECS_PER_YEAR=365.25*86400;
const SNAPSHOT={year:2026,asOf:"2026-07-01",world:8300678395,birthsPerYear:132503469,deathsPerYear:63637314,countries:[["🇮🇳","India",1476625576,0.87],["🇨🇳","China",1412914089,-0.22],["🇺🇸","United States",345426571,0.58],["🇮🇩","Indonesia",277534123,0.74],["🇵🇰","Pakistan",254039475,1.92],["🇧🇷","Brazil",216422446,0.68],["🇳🇬","Nigeria",223804632,2.41],["🇧🇩","Bangladesh",176046996,1.01],["🇷🇺","Russia",144444359,-0.18],["🇲🇽","Mexico",130262216,0.79],["🇯🇵","Japan",122851984,-0.53],["🇪🇹","Ethiopia",126527060,2.56],["🇵🇭","Philippines",117337368,1.36],["🇪🇬","Egypt",117866258,1.69],["🇨🇴","Colombia",5253381,0.79],["🇨🇩","Democratic Republic of the Congo",118?],["🇨🇦","Canada",41000000,0.7],["🇿🇦","South Africa",60414495,1.17],["🇰🇪","Kenya",55676100,2.1],["🇦🇷","Argentina",45616938,0.9],["🇦🇱","Algeria",45606480,1.53],["🇮🇷","Iran",89470641,0.72],["🇺🇦","Ukraine",36744634,-0.65],["🇴🇲","Oman",4658552,1.15],["🇦🇺","Australia",27419339,1.1],["🇳🇴","Norway",5485310,0.8],["🇵🇪","Peru",34352719,0.9],["🇸🇦","Saudi Arabia",36947025,1.12],["🇹🇭","Thailand",71801279,0.2],["🇲🇦","Morocco",38048000,0.9],["🇩🇿","Algeria",45300000,1.1],["🇰🇷","South Korea",51784059,0.12],["🇵🇹","Portugal",10276617,0.1],["🇳🇿","New Zealand",5200000,0.8],["🇭🇺","Hungary",9600000,-0.2],["🇨🇿","Czech Republic",10693939,0.1],["🇧🇪","Belgium",11655930,0.34],["🇱🇰","Sri Lanka",21893579,-0.38],["🇨🇺","Cuba",11194482,-0.19],["🇦🇪","United Arab Emirates",10000000,1.4],["🇸🇪","Sweden",10612086,0.54],["🇳🇴","Norway",5400000,0.72],["🇧🇴","Bolivia",12400000,1.1],["🇨🇱","Chile",19600000,0.84],["🇬🇭","Ghana",34100000,2.1],["🇦🇲","Armenia",2950000,-0.3],["🇬🇪","Georgia",3980000,-0.17],["🇰🇿","Kazakhstan",20100000,1.3],["🇹🇿","Tanzania",63200000,2.8],["🇺🇿","Uzbekistan",36600000,1.5],["🇵🇬","Papua New Guinea",11000000,1.9],["🇦🇫","Afghanistan",41900000,2.4],["🇮🇶","Iraq",45100000,2.2],["🇲🇾","Malaysia",34300000,1.2],["🇨🇻","Cape Verde",598000,1.0],["🇻🇳","Vietnam",101000000,0.9],["🇱🇦","Laos",7800000,1.7],["🇹🇲","Turkmenistan",6500000,1.5],["🇰🇭","Cambodia",18000000,1.4],["🇲🇲","Myanmar",54500000,0.7],["🇹🇯","Tajikistan",10500000,2.3],["🇳🇵","Nepal",30500000,1.3],["🇧🇹","Bhutan",800000,1.2]]};
const UN_COUNT=30,SHOW=50,MIN_ROWS=30;const POP=new Map();const CACHE_KEY="souls-baseline-v2",CACHE_TTL=864e5,UN_RATES=new Map(SNAPSHOT.countries.slice(0,UN_COUNT).map(c=>[c[1],c[3]])),nf=new Intl.NumberFormat("en-US");
let data=structuredClone(SNAPSHOT);
const elapsed=()=>((Date.now()-(data.asOf?Date.parse(data.asOf+"T00:00:00Z"):Date.UTC(data.year,6,1)))/1000),birthsPerSec=()=>data.birthsPerYear/SECS_PER_YEAR,deathsPerSec=()=>data.deathsPerYear/SECS_PER_YEAR,netPerSec=()=>birthsPerSec()-deathsPerSec();
const fmt=n=>nf.format(Math.max(0,Math.round(Number(n)||0)));
const pct=(n)=>`${(Number(n)||0).toFixed(1)}%`;
function countryPopulation(c){
  if(!Array.isArray(c)) return 0;
  const pop=Number(c[2]), rate=Number(c[3]);
  if(!Number.isFinite(pop)||!Number.isFinite(rate)||pop<0) return 0;
  const years=elapsed()/SECS_PER_YEAR;
  const factor=Math.pow(1+rate/100,years);
  return Number.isFinite(factor)?Math.floor(pop*factor):0;
}
function ranking(){
  const valid=data.countries.map((c,i)=>Array.isArray(c)&&c.length>=4?i:-1).filter(i=>i>=0);
  const live=data.countries.map(countryPopulation);
  return valid.sort((a,b)=>live[b]-live[a]).slice(0,SHOW);
}
let order=[];const rowPositions=()=>{const m=new Map();document.querySelectorAll(".country").forEach(e=>m.set(+e.dataset.i,{x:e.offsetLeft,y:e.offsetTop}));return m};function stopRowAnimations(){document.querySelectorAll(".country").forEach(e=>{e.style.transition="none";e.style.transform="none"})}function renderList(list, items){

}
function refresh(){
  const ranked=ranking();
  const items=ranked.map((idx,i)=>{
    const c=data.countries[idx];
    return {index:idx,flag:c[0],name:c[1],population:countryPopulation(c),rate:Number(c[3]),label:c[1]};
  });
  renderList(document.getElementById("leftCol"), items.slice(0,Math.ceil(items.length/2)));

  document.getElementById("births").textContent = fmt(Math.floor(elapsed()*birthsPerSec()));

}
function birthPerSecondDelta(){return birthsPerSec()-deathsPerSec();}
const WB="https://api.worldbank.org/v2/country/";
const get=u=>fetch(u,{headers:{Accept:"application/json"}}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()});
const series=j=>{const o={};for(const r of((j&&j[1])||[]))if(typeof r.value==="number" && r.country&&r.country.id){o[r.country.id]=r;}
  return o;};
async function loadWorldBank(){
  try{
    const popAll=await get(`${WB}all/indicator/SP.POP.TOTL?format=json&mrv=8&per_page=10000`);
    const birthAll=await get(`${WB}all/indicator/SP.DYN.CBRT.IN?format=json&mrv=8&per_page=10000`);
    const deathAll=await get(`${WB}all/indicator/SP.DYN.CDRT.IN?format=json&mrv=8&per_page=10000`);
    const pm=series(popAll), bm=series(birthAll), dm=series(deathAll), wPop=pm.WLD, wBirth=bm.WLD, wDeath=dm.WLD;
    if(wPop&&wBirth&&wDeath){
      data={
        year:Math.max(wPop.year,wBirth.year,wDeath.year),
        asOf:String(new Date().toISOString().slice(0,10)),
        world:wPop.value,
        birthsPerYear:wBirth.value*wPop.value/1000,
        deathsPerYear:wDeath.value*wPop.value/1000,
        countries:SNAPSHOT.countries.map(([flag,name,pop,rate])=>[flag,name,pop,rate])
      };
    }
  }catch(e){
    console.warn("World Bank fallback used", e);
  }
  refresh();
}
const THEMES=['light','dark','ocean','sunset'];let themeAt=0;try{const saved=localStorage.getItem('souls-theme');if(THEMES.includes(saved))themeAt=THEMES.indexOf(saved)}catch(e){}
function applyTheme(){const t=THEMES[themeAt];document.documentElement.setAttribute('data-theme',t);document.querySelector('.theme-toggle').textContent=t.charAt(0).toUpperCase()+t.slice(1)}
function cycleTheme(){themeAt=(themeAt+1)%THEMES.length;try{localStorage.setItem('souls-theme',THEMES[themeAt])}catch(e){}applyTheme()}
document.querySelector('.theme-toggle').addEventListener('click',cycleTheme);
applyTheme();
setInterval(refresh,1000);
loadWorldBank();
</script>
