<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06101f"><title>World Population — Top 50 Countries</title><style>*{box-sizing:border-box}html,body{margin:0;background:#020914;color:#f5f8ff;font-family:Arial,sans-serif}body{min-height:100vh;background:radial-gradient(circle at 50% 0,#123052 0,#06101f 38%,#020711 100%)}.page{width:100%;max-width:1400px;margin:auto;padding:10px}.top{display:grid;grid-template-columns:150px 1fr 190px;gap:12px;align-items:center}.live{border:2px solid #e11;border-radius:12px;background:#c91414;text-align:center;padding:7px 8px;font-weight:900;font-size:25px;box-shadow:0 0 18px #d11}.live small{display:block;background:#071426;margin:6px -2px -7px;padding:5px;font-size:11px;letter-spacing:1px}.title{text-align:center;font-weight:1000;font-size:clamp(27px,4vw,58px);letter-spacing:2px;text-shadow:0 3px 12px #000}.title b{display:block;color:#ffd83d;font-size:.72em}.total{border:1px solid #168de0;border-radius:12px;padding:8px;text-align:center;background:#061426;box-shadow:0 0 16px #063c67}.total small{display:block;color:#9db8d5;letter-spacing:1px}.total strong{font-size:21px;color:#7fd5ff}.sub{text-align:center;letter-spacing:3px;color:#b8c8db;font-size:12px;margin:7px 0 10px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.card{min-width:0;height:158px;border:1px solid #167fbe;border-radius:7px;background:linear-gradient(145deg,rgba(10,30,52,.98),rgba(2,12,25,.98));box-shadow:inset 0 0 16px rgba(0,145,255,.08),0 2px 6px #000;position:relative;text-align:center;padding:8px 4px 5px}.rank{position:absolute;top:4px;left:4px;background:#061a31;border:1px solid #4389c2;border-radius:5px;padding:2px 6px;font-weight:900;font-size:13px;color:#fff}.flag{height:78px;display:flex;align-items:center;justify-content:center;font-size:68px;line-height:1;margin:4px 0 2px}.country{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}.pop{font-size:17px;font-weight:1000;color:#ffe34f;margin-top:5px;font-variant-numeric:tabular-nums;white-space:nowrap}.runtime-up{color:#58f09b!important}.runtime-down{color:#ff7474!important}.bottom{text-align:center;color:#8ea4bd;letter-spacing:3px;font-size:10px;padding:12px 0 4px}.music{position:fixed;right:14px;bottom:14px;width:44px;height:44px;border:1px solid #2d9de0;border-radius:50%;background:#061426;color:#fff;font-size:20px;font-weight:900;box-shadow:0 0 16px rgba(0,145,255,.3);cursor:pointer;z-index:20}.music.on{color:#58f09b;border-color:#58f09b}@media(max-width:700px){.page{padding:5px}.top{grid-template-columns:72px 1fr 92px;gap:5px}.live{font-size:13px;padding:5px 3px;border-radius:8px}.live small{font-size:7px;margin:4px -2px -5px}.title{font-size:21px;letter-spacing:1px}.sub{font-size:7px;letter-spacing:1.2px;margin:4px 0 6px}.total{padding:5px 2px;border-radius:8px}.total small{font-size:7px}.total strong{font-size:10px}.grid{gap:2px}.card{height:115px;padding:4px 2px}.rank{font-size:8px;padding:1px 4px}.flag{height:58px;font-size:48px;margin:1px 0}.country{font-size:8px}.pop{font-size:10px;margin-top:2px}.bottom{font-size:7px;padding:7px 0}.music{right:10px;bottom:10px;width:38px;height:38px;font-size:17px}}@media(max-width:420px){.card{height:105px}.flag{font-size:43px;height:53px}.country{font-size:7px}.pop{font-size:9px}.title{font-size:18px}}</style></head><body><main class="page"><section class="top"><div class="live">● LIVE<small id="clock">00:00:00</small></div><div class="title">WORLD POPULATION<b>BY COUNTRY</b></div><div class="total"><small>TOTAL WORLD</small><strong id="world">8,314,100,000</strong></div></section><div class="sub">50 LARGEST COUNTRIES • LIVE POPULATION ESTIMATE</div><section class="grid" id="grid"></section><div class="bottom">ONE PLANET • ONE HUMANITY</div></main><button class="music" id="music" aria-label="Play background music">♫</button><audio id="audio" preload="auto" autoplay playsinline webkit-playsinline loop></audio><script>const C=[['🇮🇳','India',1476625576,.87],['🇨🇳','China',1412914089,-.22],['🇺🇸','United States',349035494,.51],['🇮🇩','Indonesia',287886782,.76],['🇵🇰','Pakistan',259299791,1.6],['🇳🇬','Nigeria',242431832,2.06],['🇧🇷','Brazil',213562666,.35],['🇧🇩','Bangladesh',177818044,1.21],['🇷🇺','Russia',143394458,-.42],['🇪🇹','Ethiopia',138902185,2.53],['🇲🇽','Mexico',132997658,.8],['🇯🇵','Japan',122427731,-.55],['🇪🇬','Egypt',120101175,1.47],['🇵🇭','Philippines',117724471,.8],['🇨🇩','DR Congo',116452162,3.21],['🇻🇳','Vietnam',102177431,.57],['🇮🇷','Iran',93168497,.81],['🇹🇷','Turkey',87926082,.27],['🇩🇪','Germany',83644258,-.51],['🇹🇿','Tanzania',72563780,2.86],['🇹🇭','Thailand',71559614,-.08],['🇬🇧','United Kingdom',69931528,.55],['🇫🇷','France',66746401,.14],['🇿🇦','South Africa',65453084,1.09],['🇰🇪','Kenya',57870000,2.15],['🇲🇲','Myanmar',54800000,.72],['🇨🇴','Colombia',52800000,.9],['🇪🇸','Spain',48300000,-.1],['🇺🇬','Uganda',51000000,2.8],['🇦🇷','Argentina',46000000,.35],['🇸🇩','Sudan',53000000,2.5],['🇺🇦','Ukraine',39000000,-1.0],['🇮🇶','Iraq',46000000,2.4],['🇦🇫','Afghanistan',44000000,2.7],['🇵🇱','Poland',37800000,-.4],['🇨🇦','Canada',40000000,1.1],['🇲🇦','Morocco',38000000,1.0],['🇸🇦','Saudi Arabia',35000000,1.6],['🇺🇿','Uzbekistan',37000000,1.6],['🇲🇾','Malaysia',35000000,1.2],['🇵🇪','Peru',34500000,1.0],['🇻🇪','Venezuela',29000000,1.0],['🇦🇴','Angola',39000000,3.1],['🇲🇿','Mozambique',35000000,2.8],['🇲🇬','Madagascar',33000000,2.5],['🇬🇭','Ghana',35000000,2.1],['🇰🇵','North Korea',27000000,.4],['🇾🇪','Yemen',42000000,2.9],['🇨🇮','Ivory Coast',32000000,2.4],['🇨🇲','Cameroon',30000000,2.6]];const anchor=Date.UTC(2026,6,1),YEAR=365.25*86400,WORLD=8314100000,NET=2;const fmt=n=>new Intl.NumberFormat('en-US').format(Math.floor(n)),elapsed=()=>Math.max(0,(Date.now()-anchor)/1000);function pop(c){return c[2]*Math.pow(1+c[3]/100,elapsed()/YEAR)}function render(){grid.innerHTML=C.map((c,i)=>`<article class="card"><span class="rank">${i+1}</span><div class="flag">${c[0]}</div><div class="country" data-i="${i}">${c[1]}</div><div class="pop" data-i="${i}">${fmt(pop(c))}</div></article>`).join('')}let previous=new Map();function update(){document.getElementById('world').textContent=fmt(WORLD+elapsed()*NET);document.querySelectorAll('.pop').forEach(e=>{const i=+e.dataset.i,n=Math.floor(pop(C[i])),old=previous.get(i);e.textContent=fmt(n);e.classList.remove('runtime-up','runtime-down');const name=document.querySelector('.country[data-i="'+i+'"]');if(name)name.classList.remove('runtime-up','runtime-down');if(old!==undefined&&n>old){e.classList.add('runtime-up');if(name)name.classList.add('runtime-up')}else if(old!==undefined&&n<old){e.classList.add('runtime-down');if(name)name.classList.add('runtime-down')}previous.set(i,n)});document.getElementById('clock').textContent=new Date().toLocaleTimeString([], {hour12:false})}render();update();setInterval(update,1000);const audio=document.getElementById('audio'),musicButton=document.getElementById('music');audio.src='./Cathedral%20of%20Stars.mp3';audio.loop=true;audio.volume=.25;async function startMusic(){try{audio.currentTime=audio.currentTime||0;await audio.play();musicButton.textContent='🔊';musicButton.classList.add('on')}catch(e){musicButton.textContent='♫'}}window.addEventListener('load',()=>{startMusic()});musicButton.addEventListener('click',async e=>{e.preventDefault();if(audio.paused)await startMusic();else{audio.pause();musicButton.textContent='♫';musicButton.classList.remove('on')}});audio.addEventListener('ended',()=>{musicButton.textContent='♫';musicButton.classList.remove('on')});audio.addEventListener('error',()=>{musicButton.textContent='⚠️';musicButton.classList.remove('on')});</script></body></html>
