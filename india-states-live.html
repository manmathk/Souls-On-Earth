<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050814">
<title>India States — Live Population Counter</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#050814;color:#f7fbff}body{background:radial-gradient(circle at 50% -10%,#183b63 0,#091225 34%,#050814 72%);overflow:hidden}.page{width:100%;max-width:1180px;margin:auto;padding:6px 8px}.head{display:grid;grid-template-columns:110px 1fr 145px;gap:7px;align-items:stretch}.live,.total,.hero{border:1px solid #23466b;background:linear-gradient(145deg,rgba(14,32,57,.96),rgba(5,12,25,.96));box-shadow:0 8px 20px rgba(0,0,0,.25);border-radius:11px}.live{display:flex;flex-direction:column;justify-content:center;align-items:center;border-color:#e92e4d;font-size:19px;font-weight:1000}.live b{color:#ff4562}.live small{margin-top:2px;color:#91a7c0;font-size:8px;letter-spacing:1px}.hero{text-align:center;padding:7px}.kicker{font-size:8px;color:#64d8ff;font-weight:900;letter-spacing:2px}.title{margin:1px 0;font-size:clamp(22px,3.5vw,40px);font-weight:1000;line-height:.95}.title span{color:#ffc83d}.hero small{display:block;margin-top:3px;color:#7f95ae;font-size:7px;letter-spacing:1px}.total{display:flex;flex-direction:column;justify-content:center;text-align:center;padding:6px}.total small{font-size:7px;color:#829ab5;letter-spacing:1px}.total strong{margin-top:2px;font-size:16px;color:#7ce3ff;font-variant-numeric:tabular-nums}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:5px 0}.stat{padding:4px 7px;border:1px solid #1d3654;border-radius:8px;background:rgba(7,19,35,.82);min-width:0}.stat label{display:block;color:#7189a5;font-size:7px;font-weight:800;letter-spacing:.7px}.stat strong{display:block;margin-top:1px;font-size:12px;font-variant-numeric:tabular-nums}.birth strong{color:#54eea1}.death strong{color:#ff6677}.net strong{color:#64d8ff}.section{display:flex;justify-content:space-between;align-items:center;margin:4px 1px 3px}.section h2{margin:0;font-size:9px;letter-spacing:1.5px}.section span{color:#6f849d;font-size:7px;letter-spacing:.7px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.card{position:relative;min-width:0;height:calc((100vh - 142px)/7);min-height:62px;padding:6px 7px;border:1px solid #1b4164;border-radius:8px;background:linear-gradient(145deg,rgba(11,29,51,.98),rgba(5,13,26,.98));box-shadow:inset 0 0 14px rgba(0,190,255,.035);overflow:hidden}.card.flash-up{border-color:#37df91;box-shadow:0 0 12px rgba(55,223,145,.2)}.card.flash-down{border-color:#ff526b;box-shadow:0 0 12px rgba(255,82,107,.18)}.rank{position:absolute;top:4px;left:5px;border:1px solid #315979;border-radius:4px;background:#081a2f;color:#91abc5;padding:1px 3px;font-size:7px;font-weight:1000}.flag{position:absolute;top:3px;right:5px;font-size:14px}.state{padding-right:20px;margin-top:17px;font-size:11px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pop{margin-top:2px;font-size:16px;font-weight:1000;line-height:1;color:#ffe05a;font-variant-numeric:tabular-nums;white-space:nowrap}.flow{display:flex;gap:4px;margin-top:3px;font-size:6.5px;font-weight:850;font-variant-numeric:tabular-nums;white-space:nowrap}.flow .inc{color:#50ed9c}.flow .dec{color:#ff697a}.bar{height:2px;margin-top:4px;border-radius:99px;background:#0a1c30;overflow:hidden}.bar i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,#20c8ff,#62e7ff);border-radius:99px}.rate{margin-top:3px;color:#627b96;font-size:6.5px;letter-spacing:.2px;white-space:nowrap}.note,.footer{display:none}@media(max-width:850px){.page{padding:4px 5px}.head{grid-template-columns:60px 1fr 80px;gap:4px}.live{font-size:10px;border-radius:8px}.live small{font-size:6px}.hero{padding:5px 2px}.kicker{font-size:5.5px;letter-spacing:1px}.title{font-size:16px}.hero small{font-size:5px}.total{border-radius:8px}.total small{font-size:5.5px}.total strong{font-size:9px}.stats{gap:3px;margin:3px 0}.stat{padding:3px 4px;border-radius:6px}.stat label{font-size:5.5px}.stat strong{font-size:9px}.section{margin:2px 1px}.section h2{font-size:7px}.section span{font-size:5px}.grid{grid-template-columns:repeat(4,1fr);gap:3px}.card{height:calc((100vh - 108px)/7);min-height:52px;padding:4px 5px;border-radius:6px}.rank{top:3px;left:3px;font-size:5.5px}.flag{top:2px;right:3px;font-size:10px}.state{margin-top:14px;font-size:7.5px;padding-right:15px}.pop{margin-top:2px;font-size:10px}.flow{margin-top:2px;font-size:5px;gap:2px}.bar{margin-top:3px}.rate{margin-top:2px;font-size:5px}}@media(max-width:430px){.page{padding:3px}.head{grid-template-columns:48px 1fr 67px;gap:3px}.live{font-size:8px}.live small{font-size:5px}.hero{padding:4px 1px}.kicker{font-size:4.5px}.title{font-size:13px}.hero small{font-size:4px}.total small{font-size:4.5px}.total strong{font-size:7.5px}.stats{margin:2px 0;gap:2px}.stat{padding:2px 3px}.stat label{font-size:4.5px}.stat strong{font-size:7.5px}.section h2{font-size:6px}.section span{font-size:4px}.grid{gap:2px}.card{height:calc((100vh - 94px)/7);min-height:45px;padding:3px 4px}.rank{font-size:5px;padding:0 2px}.flag{font-size:8px}.state{margin-top:12px;font-size:6.2px;padding-right:11px}.pop{font-size:8px}.flow{font-size:4.2px}.bar{height:1px;margin-top:2px}.rate{font-size:4px;margin-top:1px}}
</style>
</head>
<body>
<main class="page">
<header class="head"><div class="live"><b>● LIVE</b><small id="clock">00:00:00</small></div><div class="hero"><div class="kicker">INDIA • POPULATION CONTROL</div><div class="title">STATE <span>COUNTER</span></div><small>CONTINUOUS INCREMENT / DECREMENT MODEL</small></div><div class="total"><small>28 STATES TOTAL</small><strong id="total">—</strong></div></header>
<section class="stats"><div class="stat birth"><label>↑ BIRTHS / SEC</label><strong id="births">—</strong></div><div class="stat death"><label>↓ DEATHS / SEC</label><strong id="deaths">—</strong></div><div class="stat net"><label>NET + / SEC</label><strong id="net">—</strong></div></section>
<div class="section"><h2>LIVE STATE RANKING</h2><span>POPULATION • FLOW • GROWTH</span></div><section class="grid" id="grid"></section>
</main>
<script>
const S=[['Uttar Pradesh',243466000,.91,'UP'],['Bihar',132850000,1.38,'BR'],['Maharashtra',129584000,.72,'MH'],['West Bengal',100631000,.43,'WB'],['Madhya Pradesh',89965000,1.10,'MP'],['Rajasthan',83879000,.99,'RJ'],['Tamil Nadu',77582000,.24,'TN'],['Gujarat',74343000,1.13,'GJ'],['Karnataka',69074000,.58,'KA'],['Andhra Pradesh',53740000,.29,'AP'],['Odisha',47221000,.57,'OD'],['Jharkhand',41108000,1.19,'JH'],['Telangana',38665000,.43,'TS'],['Assam',36815000,.88,'AS'],['Kerala',36239000,.35,'KL'],['Haryana',31409000,1.13,'HR'],['Punjab',31370000,.58,'PB'],['Chhattisgarh',31311000,1.06,'CG'],['Uttarakhand',12028000,.97,'UK'],['Himachal Pradesh',7588000,.44,'HP'],['Tripura',4268000,.85,'TR'],['Meghalaya',3447000,.88,'ML'],['Manipur',3318000,.88,'MN'],['Nagaland',2299000,.88,'NL'],['Arunachal Pradesh',1608000,.88,'AR'],['Goa',1601000,.50,'GA'],['Mizoram',1275000,.87,'MZ'],['Sikkim',709000,.85,'SK']];
const YEAR=365.2425*86400000,BASE=new Date('2026-07-01T00:00:00Z').getTime(),fmt=n=>new Intl.NumberFormat('en-IN').format(Math.floor(n)),deathRate=.0067;
function population(s){return s[1]*Math.pow(1+s[2]/100,(Date.now()-BASE)/YEAR)}function flow(s){const p=population(s),d=p*deathRate,n=p*s[2]/100;return{p,d,b:d+n,n}}
function render(){const max=S[0][1];grid.innerHTML=S.map((s,i)=>{const w=Math.max(5,s[1]/max*100);return `<article class="card"><span class="rank">${String(i+1).padStart(2,'0')}</span><span class="flag">🇮🇳</span><div class="state">${s[0]}</div><div class="pop">${fmt(s[1])}</div><div class="flow"><span class="inc">↑ <b class="b"></b></span><span class="dec">↓ <b class="d"></b></span></div><div class="bar"><i style="--w:${w}%"></i></div><div class="rate">+${s[2].toFixed(2)}% / year</div></article>`}).join('')}
function update(){let total=0,b=0,d=0;document.querySelectorAll('.card').forEach((e,i)=>{const f=flow(S[i]);total+=f.p;b+=f.b;d+=f.d;e.querySelector('.pop').textContent=fmt(f.p);e.querySelector('.b').textContent=f.b.toFixed(2);e.querySelector('.d').textContent=f.d.toFixed(2)});document.getElementById('total').textContent=fmt(total);document.getElementById('births').textContent=b.toFixed(2);document.getElementById('deaths').textContent=d.toFixed(2);document.getElementById('net').textContent=(b-d).toFixed(2);document.getElementById('clock').textContent=new Date().toLocaleTimeString([], {hour12:false})}
render();update();setInterval(update,1000);
</script>
</body></html>
