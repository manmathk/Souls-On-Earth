<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050814"><title>India States — Live Population Counter</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#050814;color:#f7fbff}body{background:radial-gradient(circle at 50% -10%,#183b63 0,#091225 34%,#050814 72%);overflow:hidden}.page{width:100%;max-width:1180px;margin:auto;padding:6px 8px}.head{display:grid;grid-template-columns:110px 1fr 145px;gap:7px}.live,.total,.hero,.audio{border:1px solid #23466b;background:linear-gradient(145deg,rgba(14,32,57,.96),rgba(5,12,25,.96));box-shadow:0 8px 20px rgba(0,0,0,.25);border-radius:11px}.live{display:flex;flex-direction:column;justify-content:center;align-items:center;border-color:#e92e4d;font-size:19px;font-weight:1000}.live b{color:#ff4562}.live small{margin-top:2px;color:#91a7c0;font-size:8px}.hero{text-align:center;padding:7px}.kicker{font-size:8px;color:#64d8ff;font-weight:900;letter-spacing:2px}.title{margin:1px 0;font-size:clamp(22px,3.5vw,40px);font-weight:1000;line-height:.95}.title span{color:#ffc83d}.hero small{display:block;margin-top:3px;color:#7f95ae;font-size:7px}.total{display:flex;flex-direction:column;justify-content:center;text-align:center;padding:6px}.total small{font-size:7px;color:#829ab5}.total strong{margin-top:2px;font-size:16px;color:#7ce3ff;font-variant-numeric:tabular-nums}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:5px 0}.stat{padding:4px 7px;border:1px solid #1d3654;border-radius:8px;background:rgba(7,19,35,.82);min-width:0}.stat label{display:block;color:#7189a5;font-size:7px;font-weight:800}.stat strong{display:block;margin-top:1px;font-size:12px;font-variant-numeric:tabular-nums}.birth strong{color:#54eea1}.death strong{color:#ff6677}.net strong{color:#64d8ff}.section{display:flex;justify-content:space-between;align-items:center;margin:4px 1px 3px}.section h2{margin:0;font-size:9px;letter-spacing:1.5px}.section span{color:#6f849d;font-size:7px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;align-content:start}.card{position:relative;min-width:0;height:82px;padding:6px 7px;border:1px solid #1b4164;border-radius:8px;background:linear-gradient(145deg,rgba(11,29,51,.98),rgba(5,13,26,.98));overflow:hidden}.rank{position:absolute;top:4px;left:5px;border:1px solid #315979;border-radius:4px;background:#081a2f;color:#91abc5;padding:1px 3px;font-size:7px;font-weight:1000}.flag{position:absolute;top:3px;right:5px;font-size:14px}.state{padding-right:20px;margin-top:17px;font-size:11px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pop{margin-top:2px;font-size:16px;font-weight:1000;line-height:1;color:#ffe05a;font-variant-numeric:tabular-nums;white-space:nowrap}.flow{display:flex;gap:4px;margin-top:3px;font-size:6.5px;font-weight:850;white-space:nowrap}.flow .inc{color:#50ed9c}.flow .dec{color:#ff697a}.bar{height:2px;margin-top:4px;border-radius:99px;background:#0a1c30;overflow:hidden}.bar i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,#20c8ff,#62e7ff)}.rate{margin-top:3px;color:#627b96;font-size:6.5px;white-space:nowrap}.audio{position:fixed;right:10px;bottom:10px;z-index:20;padding:7px 11px;border-color:#ffc83d;color:#fff;background:#08182b;font-size:11px;font-weight:900;cursor:pointer}.fact{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:19;max-width:55%;padding:5px 10px;border:1px solid #24496c;border-radius:8px;background:rgba(3,12,25,.9);color:#b9d1e8;font-size:9px;text-align:center;pointer-events:none}@media(max-width:850px){.page{padding:4px 5px}.head{grid-template-columns:60px 1fr 80px;gap:4px}.live{font-size:10px}.live small{font-size:6px}.hero{padding:5px 2px}.kicker{font-size:5.5px}.title{font-size:16px}.hero small{font-size:5px}.total small{font-size:5.5px}.total strong{font-size:9px}.stats{gap:3px;margin:3px 0}.stat{padding:3px 4px}.stat label{font-size:5.5px}.stat strong{font-size:9px}.section{margin:2px 1px}.section h2{font-size:7px}.section span{font-size:5px}.grid{grid-template-columns:repeat(4,1fr);gap:3px}.card{height:82px;padding:4px 5px}.rank{font-size:5.5px}.flag{font-size:10px}.state{font-size:7.5px;margin-top:14px}.pop{font-size:10px}.flow{font-size:5px}.bar{margin-top:3px}.rate{font-size:5px}.audio{right:5px;bottom:5px;font-size:8px;padding:5px 7px}.fact{bottom:5px;left:5px;transform:none;max-width:70%;font-size:7px;padding:4px 6px}}@media(max-width:430px){.page{padding:3px}.head{grid-template-columns:48px 1fr 67px;gap:3px}.live{font-size:8px}.live small{font-size:5px}.hero{padding:4px 1px}.kicker{font-size:4.5px}.title{font-size:13px}.hero small{font-size:4px}.total small{font-size:4.5px}.total strong{font-size:7.5px}.stats{margin:2px 0;gap:2px}.stat{padding:2px 3px}.stat label{font-size:4.5px}.stat strong{font-size:7.5px}.section h2{font-size:6px}.section span{font-size:4px}.grid{gap:2px}.card{height:72px;padding:3px 4px}.rank{font-size:5px}.flag{font-size:8px}.state{font-size:6.2px;margin-top:12px}.pop{font-size:8px}.flow{font-size:4.2px}.bar{height:1px}.rate{font-size:4px}.audio{font-size:7px;padding:4px 6px}.fact{font-size:6px;max-width:66%;bottom:4px}}</style></head><body><main class="page"><header class="head"><div class="live"><b>● LIVE</b><small id="clock">00:00:00</small></div><div class="hero"><div class="kicker">🇮🇳 INDIA • POPULATION CONTROL</div><div class="title">STATE <span>COUNTER</span></div><small>CONTINUOUS INCREMENT / DECREMENT MODEL</small></div><div class="total"><small>28 STATES TOTAL</small><strong id="total">—</strong></div></header><section class="stats"><div class="stat birth"><label>↑ BIRTHS / SEC</label><strong id="births">—</strong></div><div class="stat death"><label>↓ DEATHS / SEC</label><strong id="deaths">—</strong></div><div class="stat net"><label>NET + / SEC</label><strong id="net">—</strong></div></section><div class="section"><h2>LIVE STATE RANKING</h2><span>POPULATION • FLOW • GROWTH</span></div><section class="grid" id="grid"></section></main><button class="audio" id="audioBtn">🔊 START MUSIC + HINDI FACTS</button><div class="fact" id="fact">🎙️ हिंदी भारत तथ्य: ऑडियो शुरू करने के लिए बटन दबाएँ।</div><audio id="bgMusic" loop preload="auto" src="./Felt%20Keys%20for%20Marchers.mp3"></audio><script>
const S=[['Uttar Pradesh',243466000,.91],['Bihar',132850000,1.38],['Maharashtra',129584000,.72],['West Bengal',100631000,.43],['Madhya Pradesh',89965000,1.10],['Rajasthan',83879000,.99],['Tamil Nadu',77582000,.24],['Gujarat',74343000,1.13],['Karnataka',69074000,.58],['Andhra Pradesh',53740000,.29],['Odisha',47221000,.57],['Jharkhand',41108000,1.19],['Telangana',38665000,.43],['Assam',36815000,.88],['Kerala',36239000,.35],['Haryana',31409000,1.13],['Punjab',31370000,.58],['Chhattisgarh',31311000,1.06],['Uttarakhand',12028000,.97],['Himachal Pradesh',7588000,.44],['Tripura',4268000,.85],['Meghalaya',3447000,.88],['Manipur',3318000,.88],['Nagaland',2299000,.88],['Arunachal Pradesh',1608000,.88],['Goa',1601000,.50],['Mizoram',1275000,.87],['Sikkim',709000,.85]];
const YEAR=365.2425*86400000,BASE=Date.parse('2026-07-01T00:00:00Z'),DEATH_RATE=.0067,fmt=n=>new Intl.NumberFormat('en-IN').format(Math.floor(n));
const grid=document.getElementById('grid');
function population(s,now=Date.now()){return s[1]*Math.pow(1+s[2]/100,Math.max(0,now-BASE)/YEAR)}
function flow(s,now){const p=population(s,now),net=p*s[2]/100,deaths=p*DEATH_RATE,births=net+deaths;return{p,births,deaths,net}}
function render(){const max=S[0][1];grid.innerHTML=S.map((s,i)=>`<article class="card"><span class="rank">${String(i+1).padStart(2,'0')}</span><span class="flag">🇮🇳</span><div class="state">${s[0]}</div><div class="pop" data-pop="${i}">${fmt(s[1])}</div><div class="flow"><span class="inc">↑ <b data-b="${i}">0</b></span><span class="dec">↓ <b data-d="${i}">0</b></span></div><div class="bar"><i style="--w:${Math.max(5,s[1]/max*100)}%"></i></div><div class="rate">+${s[2].toFixed(2)}% / year</div></article>`).join('')}
function update(){const now=Date.now();let total=0,b=0,d=0;S.forEach((s,i)=>{const f=flow(s,now);total+=f.p;b+=f.births;d+=f.deaths;document.querySelector(`[data-pop="${i}"]`).textContent=fmt(f.p);document.querySelector(`[data-b="${i}"]`).textContent=f.births.toFixed(2);document.querySelector(`[data-d="${i}"]`).textContent=f.deaths.toFixed(2)});document.getElementById('total').textContent=fmt(total);document.getElementById('births').textContent=b.toFixed(2);document.getElementById('deaths').textContent=d.toFixed(2);document.getElementById('net').textContent=(b-d).toFixed(2);document.getElementById('clock').textContent=new Date(now).toLocaleTimeString([], {hour12:false})}
render();update();setInterval(update,250);
const facts=['भारत दुनिया का सातवाँ सबसे बड़ा देश है और इसका क्षेत्रफल लगभग 3.29 मिलियन वर्ग किलोमीटर है।','भारत में 28 राज्य हैं और यह लाइव काउंटर उन्हीं 28 राज्यों को दिखाता है।','उत्तर प्रदेश भारत का सबसे अधिक आबादी वाला राज्य है।','महाराष्ट्र भारत के सबसे बड़े राज्यों में से एक है और इसकी राजधानी मुंबई है।','भारत की राजधानी नई दिल्ली है।','भारत में हिमालय उत्तर दिशा में एक विशाल प्राकृतिक पर्वत श्रृंखला बनाता है।','गंगा भारत की सबसे प्रसिद्ध नदियों में से एक है और उत्तर भारत के जीवन में इसका बड़ा महत्व है।','राजस्थान क्षेत्रफल के हिसाब से भारत का सबसे बड़ा राज्य है।','गोवा क्षेत्रफल के हिसाब से भारत का सबसे छोटा राज्य है।'];
let audioOn=false,factIndex=0,speaking=false,timer=null;const audio=document.getElementById('bgMusic'),btn=document.getElementById('audioBtn'),fact=document.getElementById('fact');
function speakFact(){if(!audioOn||speaking||!('speechSynthesis'in window))return;speaking=true;const text=facts[factIndex++%facts.length];fact.textContent='🎙️ '+text;const u=new SpeechSynthesisUtterance(text);u.lang='hi-IN';u.rate=.92;u.pitch=1;u.volume=1;const voices=speechSynthesis.getVoices();const hi=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('hi'));if(hi)u.voice=hi;u.onend=()=>{speaking=false};u.onerror=()=>{speaking=false};speechSynthesis.cancel();speechSynthesis.speak(u)}
btn.addEventListener('click',async()=>{audioOn=!audioOn;if(audioOn){audio.volume=.16;audio.load();try{await audio.play()}catch(e){fact.textContent='🎵 Music blocked — tap MUSIC + HINDI FACTS again.'}btn.textContent='🔊 MUSIC + HINDI FACTS ON';speakFact();clearInterval(timer);timer=setInterval(speakFact,26000)}else{audio.pause();speechSynthesis.cancel();speaking=false;clearInterval(timer);btn.textContent='🔇 START MUSIC + HINDI FACTS';fact.textContent='🎙️ हिंदी भारत तथ्य: ऑडियो बंद है।'}});
</script></body></html>
