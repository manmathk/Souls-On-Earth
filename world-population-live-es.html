<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Población Mundial — Contador en Vivo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#eee;font-family:Arial,Helvetica,sans-serif}body{min-height:100vh}.app{width:min(100%,720px);margin:0 auto;background:#000;min-height:100vh}.top{padding:8px 10px 7px;border-bottom:1px solid #333}.title{font-size:20px;font-weight:800;line-height:1.05;color:#fff}.subtitle{margin-top:5px;font-size:13px;font-weight:700;color:#ddd}.tabs{display:flex;gap:0;padding:5px 7px;border-bottom:1px solid #333}.tab{padding:8px 11px;font-size:14px;color:#888}.tab.active{color:#fff;background:#222;border:1px solid #444}.tools{display:flex;align-items:center;gap:12px;padding:8px;border-bottom:1px solid #222}.play{width:28px;height:28px;border-radius:50%;border:2px solid #ddd;background:#000;color:#fff;font-size:11px}.track{height:3px;background:#383838;flex:1;position:relative}.track i{position:absolute;left:45%;top:-5px;width:13px;height:13px;border-radius:50%;background:#35b85a}.live{display:flex;align-items:center;gap:5px;font-size:15px;font-weight:700;white-space:nowrap}.live input{accent-color:#5b57ef;width:18px;height:18px}.year{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:700;white-space:nowrap}.filterbar{display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid #222}.worldtag{display:flex;gap:8px;align-items:center;font-size:15px;font-weight:700}.sort{font-size:21px;color:#ddd}.summary{display:flex;justify-content:space-between;align-items:center;padding:9px 10px 8px;border-bottom:1px solid #383838;font-size:16px;font-weight:800}.summary .num{font-size:16px;font-variant-numeric:tabular-nums}.rows{display:block}.row{display:grid;grid-template-columns:42px 1fr minmax(125px,165px);gap:7px;align-items:center;min-height:44px;padding:5px 9px;border-bottom:1px solid #303030}.flag{width:30px;height:20px;object-fit:cover;border-radius:1px;background:#222;display:block}.name{font-size:15px;line-height:1.1}.num{font-size:15px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.row.up .num{color:#44e78f}.row.down .num{color:#ff5e73}.row.zero .num{color:#eee}.foot{padding:12px;color:#666;font-size:10px;line-height:1.35}.hidden{display:none!important}@media(max-width:480px){.title{font-size:17px}.subtitle{font-size:12px}.row{grid-template-columns:34px 1fr minmax(102px,44vw);gap:5px;min-height:43px;padding:5px 7px}.flag{width:27px;height:18px}.name{font-size:14px}.num{font-size:14px}.summary{font-size:15px;padding:8px}.summary .num{font-size:15px}.tools{gap:8px}.live{font-size:14px}.year{font-size:14px}.filterbar{padding:7px}.worldtag{font-size:14px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="title">🌎 POBLACIÓN MUNDIAL</div><div class="subtitle">Población total al 1 de enero</div></header>
<div class="tabs"><div class="tab active">Tabla</div><div class="tab">Mapa</div><div class="tab">Gráfico</div></div>
<div class="tools"><button class="play" id="play">▶</button><div class="track"><i></i></div><label class="live"><input id="live" type="checkbox" checked> En vivo</label><div class="year"><span>‹</span><span id="year">2026</span><span>›</span></div></div>
<div class="filterbar"><div class="worldtag"><span>ＡŽ</span><span>⚑ Mundo</span></div><div class="sort">☷</div></div>
<div class="summary"><span>Mundo</span><span class="num" id="world">—</span></div>
<div class="rows" id="rows"></div>
<div class="foot">Los valores son estimaciones continuas calculadas a partir de una base poblacional y tasas anuales de crecimiento. No representan registros oficiales en tiempo real.</div>
</div>
<script>
const flags={AR:'https://flagcdn.com/w40/ar.png',AU:'https://flagcdn.com/w40/au.png',BD:'https://flagcdn.com/w40/bd.png',BR:'https://flagcdn.com/w40/br.png',CN:'https://flagcdn.com/w40/cn.png',CO:'https://flagcdn.com/w40/co.png',CD:'https://flagcdn.com/w40/cd.png',DE:'https://flagcdn.com/w40/de.png',EG:'https://flagcdn.com/w40/eg.png',ET:'https://flagcdn.com/w40/et.png',FR:'https://flagcdn.com/w40/fr.png',GB:'https://flagcdn.com/w40/gb.png',ID:'https://flagcdn.com/w40/id.png',IN:'https://flagcdn.com/w40/in.png',IR:'https://flagcdn.com/w40/ir.png',IT:'https://flagcdn.com/w40/it.png',JP:'https://flagcdn.com/w40/jp.png',KE:'https://flagcdn.com/w40/ke.png',KR:'https://flagcdn.com/w40/kr.png',MX:'https://flagcdn.com/w40/mx.png',MM:'https://flagcdn.com/w40/mm.png',NG:'https://flagcdn.com/w40/ng.png',PK:'https://flagcdn.com/w40/pk.png',PH:'https://flagcdn.com/w40/ph.png',RU:'https://flagcdn.com/w40/ru.png',SD:'https://flagcdn.com/w40/sd.png',ZA:'https://flagcdn.com/w40/za.png',TZ:'https://flagcdn.com/w40/tz.png',TH:'https://flagcdn.com/w40/th.png',TR:'https://flagcdn.com/w40/tr.png',UG:'https://flagcdn.com/w40/ug.png',US:'https://flagcdn.com/w40/us.png',VN:'https://flagcdn.com/w40/vn.png'};
const data=[['IN','India',1479199731,.00857],['CN','China',1412286004,-.0021],['US','Estados Unidos',349384191,.0028],['ID','Indonesia',288320505,.0092],['PK','Pakistán',260138918,.0215],['NG','Nigeria',243433896,.0230],['BR','Brasil',213709288,.0050],['BD','Bangladés',178249724,.0110],['RU','Rusia',143327332,-.0042],['ET','Etiopía',139602709,.0248],['MX','México',133208097,.0090],['JP','Japón',122287705,-.0052],['EG','Egipto',120453875,.0160],['PH','Filipinas',117914319,.0152],['CD','República Democrática del Congo',117193758,.0320],['VN','Vietnam',102291484,.0060],['IR','Irán',93312390,.0070],['TR','Turquía',87979422,.0055],['DE','Alemania',83604823,-.0025],['TZ','Tanzania',72976205,.0300],['TH','Tailandia',71546073,-.0010],['GB','Reino Unido',70005624,.0022],['FR','Francia',66764980,.0020],['ZA','Sudáfrica',65593358,.0120],['IT','Italia',58879090,-.0040],['KE','Kenia',58861226,.0200],['MM','Myanmar',55251197,-.0015],['CO','Colombia',54037071,.0060],['SD','Sudán',53611215,.0200],['UG','Uganda',53041978,.0320],['KR','Corea del Sur',51585513,-.0020],['AU','Australia',27957680,.0100]];
const worldBase=8314681242,worldGrowth=.00857,base=Date.parse('2026-01-01T00:00:00Z'),yearMs=365.2425*86400000;
const rows=document.getElementById('rows');const live=document.getElementById('live');const yearEl=document.getElementById('year');let paused=false;
function val(x,now=Date.now()){return x[2]*Math.pow(1+x[3],Math.max(0,now-base)/yearMs)}
function world(now=Date.now()){return worldBase*Math.pow(1+worldGrowth,Math.max(0,now-base)/yearMs)}
function render(){rows.innerHTML=data.map((d,i)=>`<div class="row ${d[3]>0?'up':d[3]<0?'down':'zero'}"><img class="flag" src="${flags[d[0]]}" alt=""><div class="name">${d[1]}</div><div class="num" id="n${i}">${Math.floor(d[2]).toLocaleString('es-MX')}</div></div>`).join('')}
function update(){if(paused)return;const now=Date.now();document.getElementById('world').textContent=Math.floor(world(now)).toLocaleString('es-MX');data.forEach((d,i)=>document.getElementById('n'+i).textContent=Math.floor(val(d,now)).toLocaleString('es-MX'));yearEl.textContent='2026'}
live.addEventListener('change',()=>paused=!live.checked);document.getElementById('play').addEventListener('click',()=>{live.checked=!live.checked;paused=!live.checked;document.getElementById('play').textContent=paused?'▶':'Ⅱ'});
render();update();setInterval(update,250);
</script>
</body></html>
