<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b14"><title>Souls On Earth — Population Command Center</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#070b14;color:#edf3ff}body{display:flex;justify-content:center}.app{width:100%;max-width:1180px;height:100dvh;display:flex;flex-direction:column;background:radial-gradient(circle at 50% -20%,#17243d 0,#0b1220 42%,#070b14 78%);overflow:hidden}.top{height:52px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.09);flex-shrink:0}.brand{font-weight:900;letter-spacing:1.5px;font-size:14px}.status{margin-left:12px;font-size:9px;letter-spacing:1px;color:#8fa1bb;text-transform:uppercase}.actions{margin-left:auto;display:flex;gap:7px}.btn{height:34px;min-width:34px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#edf3ff;border-radius:10px;cursor:pointer;font-weight:800}.dashboard{display:grid;grid-template-columns:1.55fr .75fr;gap:10px;padding:8px 10px;flex-shrink:0}.hero,.metric-panel,.list{border:1px solid rgba(255,255,255,.09);background:rgba(11,18,32,.72);box-shadow:0 16px 45px rgba(0,0,0,.22);backdrop-filter:blur(14px)}.hero{min-height:128px;border-radius:18px;padding:14px 18px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:240px;height:240px;right:-90px;top:-110px;border-radius:50%;border:1px solid rgba(117,188,255,.18);box-shadow:0 0 0 28px rgba(117,188,255,.025),0 0 0 58px rgba(117,188,255,.018)}.eyebrow{font-size:9px;color:#7f94b2;letter-spacing:1.5px;text-transform:uppercase}.world{font-size:clamp(34px,6vw,66px);font-weight:950;letter-spacing:-2.5px;line-height:1.03;margin-top:7px;font-variant-numeric:tabular-nums}.hero-bottom{display:flex;gap:8px;margin-top:8px;align-items:center}.live{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:rgba(42,211,128,.1);color:#59e49b;font-size:9px;font-weight:900;letter-spacing:1px}.dot{width:6px;height:6px;background:#59e49b;border-radius:50%;box-shadow:0 0 10px #59e49b}.updated{font-size:9px;color:#667b99}.metric-panel{border-radius:18px;padding:9px;display:grid;grid-template-columns:1fr 1fr;gap:6px}.metric{border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:7px;background:rgba(255,255,255,.025)}.metric .v{font-size:14px;font-weight:900;font-variant-numeric:tabular-nums}.metric .k{margin-top:2px;font-size:7px;color:#71839d;letter-spacing:.6px;text-transform:uppercase}.up{color:#59e49b}.down{color:#ff7777}.toolbar{display:flex;align-items:center;padding:2px 12px 5px;flex-shrink:0}.title{font-size:12px;font-weight:900;letter-spacing:1px;color:#b5c5da;text-transform:uppercase}.hint{margin-left:auto;font-size:8px;color:#657894}.list{margin:0 10px 7px;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-height:0;flex:1}.list-head{height:34px;display:grid;grid-template-columns:38px 48px minmax(0,1fr) 165px;align-items:center;padding:0 14px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.025);font-size:8px;color:#7186a1;font-weight:900;letter-spacing:1px;text-transform:uppercase;flex-shrink:0}.rows{display:grid;grid-template-columns:1fr 1fr;min-height:0;flex:1;overflow:hidden}.col{min-width:0;min-height:0;display:grid;grid-template-rows:repeat(12,minmax(0,1fr));flex:1}.col:first-child{border-right:1px solid rgba(255,255,255,.07)}.row{min-height:0;display:grid;grid-template-columns:38px 48px minmax(0,1fr) 165px;align-items:center;padding:0 14px;border-bottom:1px solid rgba(255,255,255,.055)}.row:last-child{border-bottom:0}.rank{font-size:9px;color:#607692;text-align:center;font-weight:800}.flag{font-size:24px;text-align:center}.name{font-size:17px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.num{font-size:13px;font-weight:950;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.runtime-up{color:#59e49b!important}.runtime-down{color:#ff7777!important}.footer{height:16px;text-align:center;font-size:7px;color:#4f627d;letter-spacing:.8px;flex-shrink:0;text-transform:uppercase}html[data-theme="light"] body{background:#eef3f8;color:#152033}html[data-theme="light"] .app{background:linear-gradient(150deg,#f8fbff,#e8eef5)}html[data-theme="light"] .hero,html[data-theme="light"] .metric-panel,html[data-theme="light"] .list{background:rgba(255,255,255,.82);border-color:rgba(21,32,51,.1);box-shadow:0 12px 35px rgba(30,50,80,.08)}html[data-theme="light"] .top{border-color:rgba(21,32,51,.1)}html[data-theme="light"] .btn{color:#152033;background:#fff;border-color:rgba(21,32,51,.1)}html[data-theme="light"] .name{color:#152033}html[data-theme="light"] .row,html[data-theme="light"] .list-head{border-color:rgba(21,32,51,.07)}@media(max-width:720px){.top{height:48px;padding:0 11px}.status{display:none}.dashboard{grid-template-columns:1fr;gap:6px;padding:6px}.hero{min-height:105px;padding:11px 14px}.world{font-size:clamp(29px,8.5vw,44px);letter-spacing:-1.5px}.hero-bottom{margin-top:6px}.metric-panel{min-height:78px;padding:6px;gap:5px}.metric{padding:6px 8px}.metric .v{font-size:12px}.metric .k{font-size:6px}.toolbar{padding:2px 9px 4px}.title{font-size:11px}.hint{font-size:6.5px}.list{margin:0 7px 5px;border-radius:14px}.list-head{height:29px;grid-template-columns:18px 30px minmax(0,1fr) 78px;padding:0 6px;font-size:6.5px;letter-spacing:.7px}.row{grid-template-columns:18px 30px minmax(0,1fr) 78px;padding:0 6px}.flag{font-size:21px}.name{font-size:14px;font-weight:900}.num{font-size:11.5px}.rank{font-size:7px}.footer{height:11px}}@media(max-width:390px){.list-head,.row{grid-template-columns:17px 28px minmax(0,1fr) 74px}.name{font-size:13px}.num{font-size:10.5px}.flag{font-size:20px}}</style></head><body><main class="app"><header class="top"><div class="brand">SOULS ON EARTH</div><div class="status">GLOBAL POPULATION COMMAND CENTER</div><div class="actions"><button class="btn" id="theme" aria-label="Change theme" type="button">◐</button><button class="btn" id="music" aria-label="Toggle music" type="button">♫</button></div></header><section class="dashboard"><div class="hero"><div class="eyebrow">Current world population</div><div class="world" id="world">—</div><div class="hero-bottom"><div class="live"><i class="dot"></i>LIVE ESTIMATE</div><div class="updated" id="updated">Updating every second</div></div></div><div class="metric-panel"><div class="metric"><div class="v up" id="births">—</div><div class="k">Births today</div></div><div class="metric"><div class="v down" id="deaths">—</div><div class="k">Deaths today</div></div><div class="metric"><div class="v up" id="growth">—</div><div class="k">Net growth today</div></div><div class="metric"><div class="v" id="rate">—</div><div class="k">Net / second</div></div></div></section><div class="toolbar"><div class="title">Top 24 countries</div><div class="hint">LIVE POPULATION</div></div><section class="list"><div class="list-head"><span>Rank</span><span>Flag</span><span>Country</span><span>Population</span></div><div class="rows"><div class="col" id="left"></div><div class="col" id="right"></div></div></section><div class="footer">SOULS ON EARTH · LIVE POPULATION ESTIMATE</div></main><audio id="audio" preload="auto" loop playsinline webkit-playsinline></audio><script>const C=[['🇮🇳','India',1476625576,.87],['🇨🇳','China',1412914089,-.22],['🇺🇸','U.S.A.',349035494,.51],['🇮🇩','Indonesia',287886782,.76],['🇵🇰','Pakistan',259299791,1.6],['🇳🇬','Nigeria',242431832,2.06],['🇧🇷','Brazil',213562666,.35],['🇧🇩','Bangladesh',177818044,1.21],['🇷🇺','Russia',143394458,-.42],['🇪🇹','Ethiopia',138902185,2.53],['🇲🇽','Mexico',132997658,.8],['🇯🇵','Japan',122427731,-.55],['🇪🇬','Egypt',120101175,1.47],['🇵🇭','Philippines',117724471,.8],['🇨🇩','DR Congo',116452162,3.21],['🇻🇳','Vietnam',102177431,.57],['🇮🇷','Iran',93168497,.81],['🇹🇷','Turkey',87926082,.27],['🇩🇪','Germany',83644258,-.51],['🇹🇿','Tanzania',72563780,2.86],['🇹🇭','Thailand',71559614,-.08],['🇬🇧','U.K.',69931528,.55],['🇫🇷','France',66746401,.14],['🇿🇦','South Africa',65453084,1.09]];const anchor=Date.UTC(2026,6,1),YEAR=365.25*86400,WORLD=8300678395,BIRTH=132503469/YEAR,DEATH=63637314/YEAR,NET=BIRTH-DEATH;const fmt=n=>new Intl.NumberFormat('en-US').format(Math.floor(n)),elapsed=()=>Math.max(0,(Date.now()-anchor)/1000);function pop(c){return c[2]*Math.pow(1+c[3]/100,elapsed()/YEAR)}function sorted(){return C.map((_,i)=>i).sort((a,b)=>pop(C[b])-pop(C[a]))}function makeRow(i,r){return `<div class="row"><span class="rank">${r+1}</span><span class="flag">${C[i][0]}</span><span class="name" data-i="${i}">${C[i][1]}</span><span class="num" data-i="${i}">${fmt(pop(C[i]))}</span></div>`}function render(){const o=sorted();document.getElementById('left').innerHTML=o.slice(0,12).map((i,r)=>makeRow(i,r)).join('');document.getElementById('right').innerHTML=o.slice(12,24).map((i,r)=>makeRow(i,r+12)).join('')}let previous=new Map();function update(){const now=Date.now(),dayStart=new Date(new Date(now).setHours(0,0,0,0)).getTime(),today=(now-dayStart)/1000;document.getElementById('world').textContent=fmt(WORLD+elapsed()*NET);document.getElementById('births').textContent=fmt(today*BIRTH);document.getElementById('deaths').textContent=fmt(today*DEATH);document.getElementById('growth').textContent=fmt(today*NET);document.getElementById('rate').textContent=fmt(NET);document.querySelectorAll('.num').forEach(e=>{const i=+e.dataset.i,n=Math.floor(pop(C[i])),old=previous.get(i);e.textContent=fmt(n);e.classList.remove('runtime-up','runtime-down');const name=document.querySelector('.name[data-i="'+i+'"]');if(name)name.classList.remove('runtime-up','runtime-down');if(old!==undefined&&n>old){e.classList.add('runtime-up');if(name)name.classList.add('runtime-up')}else if(old!==undefined&&n<old){e.classList.add('runtime-down');if(name)name.classList.add('runtime-down')}previous.set(i,n)});document.getElementById('updated').textContent='Updated '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})}render();update();setInterval(update,1000);setInterval(render,30000);
const themeButton=document.getElementById('theme');const themes=['dark','light'];let ti=localStorage.getItem('soe-v2-theme')==='light'?1:0;function applyTheme(){document.documentElement.setAttribute('data-theme',themes[ti]);themeButton.textContent=themes[ti]==='light'?'☀':'◐'}themeButton.addEventListener('click',()=>{ti=(ti+1)%themes.length;applyTheme();localStorage.setItem('soe-v2-theme',themes[ti])});applyTheme();
const audio=document.getElementById('audio'),musicButton=document.getElementById('music');const primaryTrack='./cathedral%20of%20stars.mp3',fallbackTrack='./Felt%20Keys%20for%20Marchers.mp3';let usingFallback=false;function setTrack(src){audio.src=src;audio.load()}setTrack(primaryTrack);audio.volume=.25;audio.addEventListener('error',()=>{if(!usingFallback){usingFallback=true;setTrack(fallbackTrack)}});musicButton.addEventListener('click',async()=>{try{if(audio.paused){await audio.play();musicButton.textContent='🔊'}else{audio.pause();musicButton.textContent='♫'}}catch(e){musicButton.textContent='⚠'}});</script></body></html>
