14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pop{font-size:17px;font-weight:1000;color:#ffe34f;margin-top:5px;font-variant-numeric:tabular-nums;white-space:nowrap}.runtime-up{color:#58f09b!important}.runtime-down{color:#ff7474!important}.bottom{text-align:center;color:#8ea4bd;letter-spacing:2px;font-size:10px;padding:9px 0 3px}@media(max-width:700px){.page{padding:4px}.top{grid-template-columns:66px 1fr 86px;gap:4px}.live{font-size:12px;padding:5px 2px}.live small{font-size:7px;margin:4px -2px -5px}.title{font-size:20px}.sub{font-size:7px;letter-spacing:1px;margin:3px 0 5px}.total{padding:4px 2px}.total small{font-size:6px}.total strong{font-size:9px}.grid{gap:2px}.card{height:116px;padding:3px 2px}.rank{font-size:8px;padding:1px 4px}.flag{height:59px;font-size:49px;margin:0}.country{font-size:8px}.pop{font-size:10px;margin-top:2px}.bottom{font-size:6px;padding:5px 0}}@media(max-width:420px){.card{height:106px}.flag{height:53px;font-size:44px}.country{font-size:7px}.pop{font-size:9px}.title{font-size:17px}}</style></head><body><main class="page"><section class="top"><div class="live">● LIVE<small id="clock">00:00:00</small></div><div class="title">विश्व जनसंख्या<b>देश के अनुसार</b></div><div class="total"><small>कुल विश्व जनसंख्या</small><strong id="world">8,314,100,000</strong></div></section><div class="sub">दुनिया के 50 सबसे अधिक आबादी वाले देश • लाइव अनुमान</div><section class="grid" id="grid"></section><div class="bottom">एक ग्रह • एक मानवता</div></main><script>const C=[['🇮🇳','भारत',1476625576,.87],['🇨🇳','चीन',1412914089,-.22],['🇺🇸','संयुक्त राज्य',349035494,.51],['🇮🇩','इंडोनेशिया',287886782,.76],['🇵🇰','पाकिस्तान',259299791,1.6],['🇳🇬','नाइजीरिया',242431832,2.06],['🇧🇷','ब्राज़ील',213562666,.35],['🇧🇩','बांग्लादेश',177818044,1.21],['🇷🇺','रूस',143394458,-.42],['🇪🇹','इथियोपिया',138902185,2.53],['🇲🇽','मेक्सिको',132997658,.8],['🇯🇵','जापान',122427731,-.55],['🇪🇬','मिस्र',120101175,1.47],['🇵🇭','फिलीपींस',117724471,.8],['🇨🇩','डीआर कांगो' untime-down');if(old!==undefined&&n>old){e.classList.add('runtime-up');if(name)name.classList.add('runtime-up')}else if(old!==undefined&&n<old){e.classList.add('runtime-down');if(name)name.classList.add('runtime-down')}previous.set(i,n)});document.getElementById('clock').textContent=new Date().toLocaleTimeString('hi-IN',{hour12:false})}render();update();setInterval(update,1000);</script></body></html>
