<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101010"><title>Souls On Earth — Top 24 Live Population</title><style>*{box-sizing:border-box}:root{--bg:#101010;--panel:#101010;--alt:#191919;--text:#f4f4f4;--muted:#9a9a9a;--line:#303030;--growth:#36c866;--death:#ef4545}html[data-theme=light]{--bg:#fff;--panel:#fff;--alt:#f7f7f7;--text:#181818;--muted:#777;--line:#ddd;--growth:#159447;--death:#d52b2b}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}.app{width:100%;max-width:1100px;height:100dvh;margin:auto;display:flex;flex-direction:column;background:var(--panel)}header{display:flex;align-items:center;padding:7px 16px;border-bottom:1px solid var(--line);flex-shrink:0}.brand-wrap{flex:1;min-width:0}.brand{font-size:15px;font-weight:900;letter-spacing:.5px}.sub{font-size:9px;color:var(--muted);margin-top:2px}.controls{display:flex;gap:7px;margin-left:10px}.ctrl{width:38px;height:38px;border:1px solid var(--line);border-radius:11px;background:var(--alt);color:var(--text);cursor:pointer;font-size:20px;line-height:1}.hero{text-align:center;padding:5px 10px 6px;border-bottom:1px solid var(--line);flex-shrink:0}.label{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:1px}.population{font-size:clamp(34px,6vw,58px);font-weight:900;line-height:1;margin:3px 0;font-variant-numeric:tabular-nums}.live{font-size:10px;font-weight:800}.dot{display:inline-block;width:7px;height:7px;background:#f33;border-radius:50%;margin-right:4px}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:4px 10px;flex-shrink:0}.card{text-align:center;background:var(--alt);border:1px solid var(--line);border-radius:8px;padding:3px}.v{font-size:14px;font-weight:900;font-variant-numeric:tabular-nums}.k{font-size:7px;color:var(--muted);margin-top:1px}.up{color:var(--growth)}.down{color:var(--death)}.info{text-align:center;color:var(--muted);font-size:7px;padding:1px 8px 3px;flex-shrink:0}.head{display:grid;grid-template-columns:48px 1fr 150px;gap:8px;padding:6px 18px;background:var(--alt);border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--muted);font-size:9px;font-weight:800}.head span:last-child{text-align:right}.rows{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(12,minmax(0,1fr));grid-auto-flow:column;column-gap:20px;padding:3px 18px 6px;overflow:hidden}.row{display:grid;grid-template-columns:28px 32px minmax(0,1fr) 150px;gap:6px;align-items:center;min-width:0;border-bottom:1px solid var(--line)}.rank{font-size:10px;color:var(--muted);text-align:right}.flag{font-size:24px;text-align:center;line-height:1}.name{font-size:14px;font-weight:800;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.name.runtime-up{color:var(--growth)}.name.runtime-down{color:var(--death)}.num{font-size:13px;font-weight:900;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.num.runtime-up{color:var(--growth)}.num.runtime-down{color:var(--death)}.foot{height:11px;text-align:center;color:var(--muted);font-size:7px}@media(max-width:600px){header{padding:5px 9px}.brand{font-size:12px}.sub{font-size:7px}.controls{gap:5px;margin-left:7px}.ctrl{width:34px;height:34px;border-radius:10px;font-size:18px}.hero{padding:4px 5px 5px}.label{font-size:10px}.population{font-size:31px;margin:2px 0}.live{font-size:9px}.details{padding:3px 7px;gap:3px}.card{padding:3px 2px}.v{font-size:11px}.k{font-size:6px}.info{font-size:6px;padding-bottom:2px}.head{grid-template-columns:24px 1fr 88px;padding:5px 9px;font-size:8px;gap:5px}.rows{column-gap:10px;padding:2px 8px 4px}.row{grid-template-columns:16px 27px minmax(0,1fr) 84px;gap:3px}.flag{font-size:22px}.name{font-size:11.5px}.num{font-size:9.5px}.rank{font-size:8px}}@media(max-width:400px){header{padding-left:7px;padding-right:7px}.brand{font-size:11.5px}.sub{font-size:6.5px}.ctrl{width:32px;height:32px;font-size:17px}.population{font-size:29px}.head{grid-template-columns:21px 1fr 84px;padding-left:7px;padding-right:7px}.rows{column-gap:7px;padding-left:6px;padding-right:6px}.row{grid-template-columns:14px 25px minmax(0,1fr) 80px;gap:3px}.flag{font-size:20px}.name{font-size:11px}.num{font-size:9px}}</style></head><body><main class="app"><header><div class="brand-wrap"><div class="brand">SOULS ON EARTH</div><div class="sub">TOP 24 COUNTRIES · LIVE ESTIMATE</div></div><div class="controls"><button class="ctrl" id="theme" aria-label="Change theme">🎨</button><button class="ctrl" id="music" aria-label="Toggle music">♫</button></div></header><section class="hero"><div class="label">TOP 24 WORLD POPULATION</div><div id="population" class="population">Loading…</div><div class="live"><span class="dot"></span>LIVE ESTIMATE</div></section><section class="details"><div class="card"><div id="births" class="v up">—</div><div class="k">BIRTHS / SEC</div></div><div class="card"><div id="deaths" class="v down">—</div><div class="k">DEATHS / SEC</div></div><div class="card"><div id="net" class="v up">—</div><div class="k">NET GROWTH / SEC</div></div></section><div class="info">LIVE ESTIMATE · POPULATION UPDATES CONTINUOUSLY</div><div class="head"><span>RANK</span><span>COUNTRY</span><span>POPULATION</span></div><div id="rows" class="rows"></div><div class="foot">Top 24 live population</div></main><audio id="audio" preload="auto" playsinline webkit-playsinline></audio><script>const C=[['🇮🇳','India',1476625576,.87],['🇨🇳','China',1412914089,-.22],['🇺🇸','U.S.A.',349035494,.51],['🇮🇩','Indonesia',287886782,.76],['🇵🇰','Pakistan',259299791,1.6],['🇳🇬','Nigeria',242431832,2.06],['🇧🇷','Brazil',213562666,.35],['🇧🇩','Bangladesh',177818044,1.21],['🇷🇺','Russia',143394458,-.42],['🇪🇹','Ethiopia',138902185,2.53],['🇲🇽','Mexico',132997658,.8],['🇯🇵','Japan',122427731,-.55],['🇪🇬','Egypt',120101175,1.47],['🇵🇭','Philippines',117724471,.8],['🇨🇩','DR Congo',116452162,3.21],['🇻🇳','Vietnam',102177431,.57],['🇮🇷','Iran',93168497,.81],['🇹🇷','Turkey',87926082,.27],['🇩🇪','Germany',83644258,-.51],['🇹🇿','Tanzania',72563780,2.86],['🇹🇭','Thailand',71559614,-.08],['🇬🇧','U.K.',69931528,.55],['🇫🇷','France',66746401,.14],['🇿🇦','South Africa',65453084,1.09]];const anchor=Date.UTC(2026,6,1),YEAR=365.25*86400,WORLD=8300678395,BIRTH=132503469/YEAR,DEATH=63637314/YEAR,NET=BIRTH-DEATH,fmt=n=>new Intl.NumberFormat('en-US').format(Math.floor(n)),elapsed=()=>Math.max(0,(Date.now()-anchor)/1000);function pop(c){return c[2]*Math.pow(1+c[3]/100,elapsed()/YEAR)}let previous=new Map();function render(){const order=C.map((_,i)=>i).sort((a,b)=>pop(C[b])-pop(C[a]));rows.innerHTML=order.map((i,r)=>`<div class="row"><span class="rank">${r+1}</span><span class="flag">${C[i][0]}</span><span class="name" data-i="${i}">${C[i][1]}</span><span class="num" data-i="${i}">${fmt(pop(C[i]))}</span></div>`).join('')}function update(){const t=Date.now(),s=(t-new Date(new Date(t).setHours(0,0,0,0)).getTime())/1000;population.textContent=fmt(WORLD+elapsed()*NET);births.textContent=fmt(s*BIRTH);deaths.textContent=fmt(s*DEATH);net.textContent=fmt(s*NET);document.querySelectorAll('.num').forEach(e=>{const i=+e.dataset.i,n=Math.floor(pop(C[i])),old=previous.get(i);e.textContent=fmt(n);e.classList.remove('runtime-up','runtime-down');const name=document.querySelector(`.name[data-i="${i}"]`);if(name)name.classList.remove('runtime-up','runtime-down');if(old!==undefined&&n>old){e.classList.add('runtime-up');if(name)name.classList.add('runtime-up')}else if(old!==undefined&&n<old){e.classList.add('runtime-down');if(name)name.classList.add('runtime-down')}previous.set(i,n)})}render();update();setInterval(update,1000);const themes=['light','dark'],saved=localStorage.getItem('top24-theme');let themeIndex=themes.indexOf(saved);if(themeIndex<0)themeIndex=1;function applyTheme(){document.documentElement.removeAttribute('data-theme');if(themes[themeIndex]==='light')document.documentElement.dataset.theme='light'}theme.onclick=()=>{themeIndex=(themeIndex+1)%themes.length;applyTheme();localStorage.setItem('top24-theme',themes[themeIndex])};applyTheme();const audio=document.getElementById('audio'),musicButton=document.getElementById('music');audio.src='./Cathedral%20of%20Stars.mp3';audio.loop=true;audio.volume=.25;async function startMusic(){try{audio.currentTime=audio.currentTime||0;await audio.play();musicButton.textContent='🔊'}catch(e){musicButton.textContent='⚠️';setTimeout(()=>{musicButton.textContent='♫'},1500)}}musicButton.addEventListener('click',async e=>{e.preventDefault();if(audio.paused)await startMusic();else{audio.pause();musicButton.textContent='♫'}});audio.addEventListener('ended',()=>musicButton.textContent='♫');audio.addEventListener('error',()=>musicButton.textContent='⚠️');</script><script src="./js/flag-fix.js"></script></body></html>
