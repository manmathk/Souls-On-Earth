<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Souls On Earth — Human History Clock</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#222}.app{width:100%;height:100%;max-width:900px;margin:auto;display:flex;flex-direction:column;overflow:hidden}.channel{height:68px;display:flex;align-items:center;padding:7px 12px;border-bottom:1px solid #e7e7e7;gap:10px;flex-shrink:0}.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid #eee}.channel-info{flex:1;min-width:0}.channel-name{font-size:16px;font-weight:800;white-space:nowrap}.channel-sub{font-size:12px;color:#777;margin-top:2px}.links{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.links a{color:#777;text-decoration:none;margin-left:6px}.hero{min-height:196px;text-align:center;padding:17px 10px 12px;border-bottom:1px solid #eee}.eyebrow{font-size:12px;font-weight:800;color:#777;text-transform:uppercase;letter-spacing:.8px}.hero-title{font-size:26px;color:#555;margin:7px 0 5px}.hero-time{font-size:clamp(31px,7vw,58px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-1px}.hero-sub{font-size:12px;color:#777;margin-top:8px}.comment{height:38px;background:#ff0808;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0}.section-head{min-height:40px;background:#fafafa;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;font-weight:800;color:#777;padding:6px 10px;text-transform:uppercase}.timeline{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}.col{min-width:0;min-height:0;display:grid;grid-template-rows:repeat(6,minmax(0,1fr));overflow:hidden}.col:first-child{border-right:1px solid #ee </style></head><body><div class="app"><div class="channel"><img class="avatar" src="channels4_profile.jpg" alt="History Warrior"><div class="channel-info"><div class="channel-name">History Warrior</div><div class="channel-sub">🔴 ♙ 6629 &nbsp; 👍 820</div></div><div class="links"><a href="index.html">WORLD</a><a href="cities.html">CITIES</a><a href="births.html">BIRTHS</a><a href="deaths.html">DEATHS</a><a href="growth.html">GROWTH</a></div></div><div class="hero"><div class="eyebrow">HUMAN HISTORY CLOCK</div><div class="hero-title">Current Historical Date</div><div class="hero-time" id="clock">—</div><div class="hero-sub">Every second, the present advances through recorded history.</div><div class="utc" id="utc">—</div></div><div class="comment">👇 WATCH HISTORY MOVE IN REAL TIME 👇</div><div class="section-head">HOW LONG AGO WERE THESE MILESTONES?</div><div class="timeline"><div class="col" id="left"></div><div class="col" id="right"></div></div></div><script>const events=[['🌾','Agriculture','10,000 BCE',-10000],['🏙️','First Cities','3500 BCE',-3500],['🪧','First Writing','3200 BCE',-3200],['🏛️','Roman Empire begins','27 BCE',-27],['🧭','Age of Exploration begins','1400s',1400],['📰','Printing Revolution','1450',1450],['⚔️','French Revolution','1789',1789],['🚂','Industrial Revolution','1760',1760],['💡','Electric Age','1879',1879],['🌐','World Wide Web','1989',1989],['📱','Smartphone era','2007',2007],['🤖','Generative AI era','2022',2022]];const msYear=365.2425*86400000;function startOfYear(y){return Date.UTC(y,0,1)}function ageText(y){const now=Date.now();let t=startOfYear(y);if(y<=0){t=startOfYear(y+1);const years=(now-t)/msYear;return years<1?`${Math.max(0,Math.floor(years*365.2425))} days ago`:`${Math.floor(years).toLocaleString()} years ago`}const years=(now-t)/msYear;return years<1?`${Math.max(0,Math.floor(years*365.2425))} days ago`:`${Math.floor(years).toLocaleString()} years ago`}function render(){const now=new Date();document.getElementById('clock').textContent=now.toLocaleString('en-US',{year:'numeric',month:'long',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});document.getElementById('utc').textContent=now.toISOString().replace('T',' ').slice(0,19)+' UTC';const ranked=[...events].sort((a,b)=>b[3]-a[3]);const half=Math.ceil(ranked.length/2);const html=(e)=>`<div class="event"><div class="event-icon">${e[0]}</div><div><div class="event-name">${e[1]}</div><div class="event-years">${e[2]}</div><div class="event-age">${e[3]<0?'≈ ':''}${ageText(e[3])}</div></div><div class="event-bar"><i style="width:${12+Math.min(88,Math.max(2,(Date.now()%86400000)/86400000*88))}%"></i></div></div>`;document.getElementById('left').innerHTML=ranked.slice(0,half).map(html).join('');document.getElementById('right').innerHTML=ranked.slice(half).map(html).join('')}render();setInterval(render,1000);</script><script type="module" src="js/ambient-ui.js"></script></body></html>
