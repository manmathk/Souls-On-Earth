name: Restyle India population counter
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: contains(github.event.head_commit.message, 'Restyle India population counter') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update UI and India total counter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('india-states-live.html')
          s=p.read_text()
          css='''<style>
          body{background:radial-gradient(circle at 12% 0%,#ff3d68 0,transparent 28%),radial-gradient(circle at 88% 8%,#7c3cff 0,transparent 30%),linear-gradient(135deg,#07112f 0%,#081a42 48%,#12082f 100%)!important}
          .live,.total,.hero,.audio,.india-total,.stat,.card{background:linear-gradient(145deg,rgba(17,32,72,.97),rgba(7,11,34,.97))!important}
          .live{border-color:#ff315a!important;box-shadow:0 0 18px rgba(255,49,90,.25)!important}
          .live b{color:#ff3d68!important;text-shadow:0 0 12px #ff315a}
          .hero{border-color:#7b5cff!important;box-shadow:0 0 20px rgba(123,92,255,.2)!important}
          .kicker{color:#35e7ff!important}
          .title span{color:#ffd21f!important;text-shadow:0 0 14px rgba(255,210,31,.28)}
          .total{border-color:#24e0a5!important}.total strong{color:#31e8ff!important}
          .stat{border-color:#244c86!important}.birth strong{color:#37ff9b!important;text-shadow:0 0 9px rgba(55,255,155,.3)}.death strong{color:#ff5570!important;text-shadow:0 0 9px rgba(255,85,112,.3)}.net strong{color:#38dcff!important;text-shadow:0 0 9px rgba(56,220,255,.3)}
          .india-total{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:4px 0;padding:5px 10px;border:1px solid #ffb52e;border-radius:10px;box-shadow:0 0 22px rgba(255,181,46,.18),inset 0 0 18px rgba(255,70,90,.06);text-align:center}
          .india-total .label{font-size:7px;font-weight:1000;letter-spacing:1.5px;color:#ffb52e;text-align:left}.india-total .india-pop{font-size:21px;font-weight:1000;line-height:1;color:#fff05a;font-variant-numeric:tabular-nums;text-shadow:0 0 14px rgba(255,240,90,.25)}.india-total .meta{font-size:6px;color:#7ce9ff;text-align:right}.india-total .meta b{color:#45ffab}
          .card{border-color:#275b91!important;box-shadow:inset 0 0 16px rgba(0,200,255,.04)!important}.card:nth-child(4n+1){border-color:#16d9ff!important}.card:nth-child(4n+2){border-color:#8b5cff!important}.card:nth-child(4n+3){border-color:#ff3d83!important}.card:nth-child(4n){border-color:#20e6a2!important}.pop{color:#ffe83d!important;text-shadow:0 0 9px rgba(255,232,61,.2)}.bar i{background:linear-gradient(90deg,#ff2f78,#ffd21f,#21e6ff)!important}.rate{color:#7d9fc7!important}.audio{border-color:#ffcf33!important;box-shadow:0 0 15px rgba(255,207,51,.18)!important}
          @media(max-width:850px){.india-total{margin:2px 0;padding:4px 6px;gap:4px}.india-total .label{font-size:5px}.india-total .india-pop{font-size:14px}.india-total .meta{font-size:4.5px}}
          @media(max-width:430px){.india-total{padding:3px 4px;border-radius:7px}.india-total .label{font-size:4px;letter-spacing:.7px}.india-total .india-pop{font-size:11px}.india-total .meta{font-size:3.5px}}
          </style>'''
          if 'class="india-total"' not in s:
              s=s.replace('</style></head>', '</style>'+css+'</head>')
              s=s.replace('</header><section class="stats">', '</header><section class="india-total"><div class="label">🇮🇳 INDIA TOTAL POPULATION</div><div class="india-pop" id="indiaTotal">—</div><div class="meta">CONTINUOUS MODEL<br><b>+0.857% / YEAR</b></div></section><section class="stats">')
          old="const YEAR=365.2425*86400000,BASE=Date.parse('2026-07-01T00:00:00Z'),DEATH_RATE=.0067,fmt=n=>new Intl.NumberFormat('en-IN').format(Math.floor(n));"
          new=old+"\nconst INDIA_BASE=1476625576,INDIA_NET_YEAR=12659731;"
          if 'const INDIA_BASE=' not in s:
              s=s.replace(old,new)
          marker="document.getElementById('net').textContent=(b-d).toFixed(2);"
          replacement=marker+"document.getElementById('indiaTotal').textContent=fmt(INDIA_BASE+INDIA_NET_YEAR*Math.max(0,now-BASE)/YEAR);"
          if 'indiaTotal' not in s[s.find('function update'):s.find('const facts')]:
              s=s.replace(marker,replacement)
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add india-states-live.html .github/workflows/update-india-ui.yml
          git commit -m "Restyle India population counter [skip ci]"
          git push