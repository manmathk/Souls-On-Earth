name: Windows compatible flags
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add flag compatibility script to every HTML page
        run: |
          python3 <<'PY'
          from pathlib import Path
          script = '<script src="./js/flag-fix.js"></script>'
          changed = []
          for p in Path('.').glob('*.html'):
              text = p.read_text(encoding='utf-8')
              if script not in text and '</body>' in text:
                  p.write_text(text.replace('</body>', script + '</body>', 1), encoding='utf-8')
                  changed.append(p.name)
          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit HTML changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          git diff --cached --quiet && exit 0
          git commit -m 'Fix country flags on Windows'
          git push