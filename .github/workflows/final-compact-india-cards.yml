name: Final Compact India Cards
on:
  push:
    branches: [main]
jobs:
  compact:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compact all responsive cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('india-states-live.html')
          s=p.read_text()
          s=re.sub(r'height:calc\\(\\(100vh - [0-9]+px\\)/7\\);min-height:[0-9]+px', 'height:82px;min-height:0', s)
          s=s.replace('.grid{gap:2px}', '.grid{gap:2px;align-content:start}')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add india-states-live.html .github/workflows/final-compact-india-cards.yml
          git commit -m 'Compact all India state cards' || exit 0
          git rm .github/workflows/final-compact-india-cards.yml
          git commit -m 'Remove temporary final compact workflow'
          git push