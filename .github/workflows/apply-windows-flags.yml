name: Apply Windows-compatible flags
on:
  workflow_dispatch:
  push:
    paths:
      - 'js/flag-fix.js'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add flag compatibility script to every HTML page
        shell: bash
        run: |
          set -e
          changed=0
          while IFS= read -r -d '' file; do
            if ! grep -q 'js/flag-fix.js' "$file"; then
              python - "$file" <<'PY'
import pathlib,sys
p=pathlib.Path(sys.argv[1])
s=p.read_text(encoding='utf-8')
if 'js/flag-fix.js' not in s and '</body>' in s:
    s=s.replace('</body>','<script src="./js/flag-fix.js"></script></body>',1)
    p.write_text(s,encoding='utf-8')
PY
              changed=1
            fi
          done < <(find . -type f -name '*.html' -not -path './.git/*' -print0)
          if [ "$changed" -eq 0 ]; then echo 'No HTML files needed changes.'; fi
      - name: Commit changes and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Use Windows-compatible country flags across HTML pages'
          git push
          rm -f .github/workflows/apply-windows-flags.yml
          git add .github/workflows/apply-windows-flags.yml
          git commit -m 'Remove temporary flag migration workflow'
          git push
