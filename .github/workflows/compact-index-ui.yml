name: Compact index UI
on:
  push:
    paths:
      - '.github/workflows/compact-index-ui.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compact mobile dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index-new.html')
          s=p.read_text()
          s=s.replace('.hero{min-height:128px;', '.hero{min-height:112px;')
          s=s.replace('.metric-panel{border-radius:18px;padding:9px;', '.metric-panel{border-radius:14px;padding:6px;')
          s=s.replace('.metric{border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:7px;', '.metric{border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:5px;')
          s=s.replace('.metric .v{font-size:14px;', '.metric .v{font-size:12px;')
          s=s.replace('@media(max-width:720px){.top{height:48px;', '@media(max-width:720px){.top{height:44px;')
          s=s.replace('.hero{min-height:105px;padding:11px 14px}', '.hero{min-height:88px;padding:9px 12px}')
          s=s.replace('.world{font-size:clamp(29px,8.5vw,44px);', '.world{font-size:clamp(27px,8vw,40px);')
          s=s.replace('.metric-panel{min-height:78px;padding:6px;gap:5px}', '.metric-panel{min-height:56px;padding:4px;gap:4px}')
          s=s.replace('.metric{padding:6px 8px}', '.metric{padding:4px 7px}')
          s=s.replace('.metric .v{font-size:12px}', '.metric .v{font-size:10px}')
          s=s.replace('.metric .k{font-size:6px}', '.metric .k{font-size:5px}')
          s=s.replace('.dashboard{grid-template-columns:1fr;gap:6px;padding:6px}', '.dashboard{grid-template-columns:1fr;gap:4px;padding:4px}')
          s=s.replace('.toolbar{padding:2px 9px 4px}', '.toolbar{padding:2px 8px 3px}')
          s=s.replace('.list{margin:0 7px 5px;', '.list{margin:0 6px 4px;')
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-new.html
          git commit -m 'Compact dashboard to prioritize country data' || true
          git push
          rm .github/workflows/compact-index-ui.yml
          git add .github/workflows/compact-index-ui.yml
          git commit -m 'Remove temporary UI patch workflow'
          git push
