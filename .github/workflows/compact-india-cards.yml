name: Compact India State Cards
on:
  push:
    branches: [main]
jobs:
  compact:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compact cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('india-states-live.html')
          s=p.read_text()
          s=s.replace('.card{position:relative;min-width:0;height:calc((100vh - 142px)/7);min-height:62px;padding:6px 7px;', '.card{position:relative;min-width:0;height:82px;min-height:0;padding:6px 7px;')
          s=s.replace('.card{height:calc((100vh - 108px)/7);min-height:52px;padding:4px 5px;', '.card{height:82px;min-height:0;padding:4px 5px;')
          s=s.replace('.card{height:calc((100vh - 94px)/7);min-height:45px;padding:3px 4px;', '.card{height:72px;min-height:0;padding:3px 4px;')
          s=s.replace('.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}', '.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;align-content:start}')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add india-states-live.html .github/workflows/compact-india-cards.yml
          git commit -m 'Compact India state cards' || exit 0
          git rm .github/workflows/compact-india-cards.yml
          git commit -m 'Remove temporary compact workflow'
          git push