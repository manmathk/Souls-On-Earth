name: Patch phase1
on:
  push:
    paths:
      - '.github/workflows/patch-phase1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path: 'js/phase1-counters.js', ref: context.sha});
            const content = Buffer.from(r.data.content, 'base64').toString('utf8');
            const start = content.indexOf('async function fetchCountries(');
            const end = content.indexOf('function countryProjected', start);
            if(start < 0 || end < 0) throw new Error('fetchCountries markers not found');
            const replacement = `async function fetchCountries(force=false){if(!force&&state.countries.length&&Date.now()-state.lastCountryRefresh<3600000)return state.countries;if(state.loading)return state.countries;state.loading=true;try{const [p,b,d]=await Promise.all([fetchIndicator('SP.POP.TOTL'),fetchIndicator('SP.DYN.CBRT.IN'),fetchIndicator('SP.DYN.CDRT.IN')]);const real=new Set();for(const x of p[1]||[]){if(typeof x.value!=='number'||!x.country)continue;const code=String(x.countryiso3code||x.country.id||'').toUpperCase();const iso2=String(x.country.iso2Code||'').toUpperCase();const regionId=String(x.country.region?.id??'').toUpperCase();const regionValue=String(x.country.region?.value??'').toLowerCase();const name=String(x.country.value||'').toLowerCase();if(!/^[A-Z]{3}$/.test(code)||!/^[A-Z]{2}$/.test(iso2))continue;if(regionId==='NA'||regionValue==='aggregates'||name==='world'||/^(high|upper middle|lower middle|low) income/.test(name)||/^(ida|ibrd)/.test(name))continue;real.add(code);}if(real.size<150)throw new Error('Population dataset returned only '+real.size+' real countries');const pm=latestByCountry(p,real),bm=latestByCountry(b,real),dm=latestByCountry(d,real),out=[];for(const [code,pv] of pm){if(!pv.value||pv.value<=0)continue;const bv=bm.get(code),dv=dm.get(code);if(!bv||!dv||typeof bv.value!=='number'||typeof dv.value!=='number')continue;out.push({code,name:pv.name||code,flag:flagFor(code),p:pv.value,pYear:pv.year,b:bv.value,bYear:bv.year,d:dv.value,dYear:dv.year});}if(out.length<150)throw new Error('Only '+out.length+' real countries returned');state.countries=out;state.lastCountryRefresh=Date.now();return out;}finally{state.loading=false;}}\n`;
            const updated = content.slice(0,start) + replacement + content.slice(end);
            await github.rest.repos.createOrUpdateFileContents({owner: context.repo.owner, repo: context.repo.repo, path:'js/phase1-counters.js', message:'Fix phase1 country discovery', content:Buffer.from(updated).toString('base64'), sha:r.data.sha, branch:'main'});
