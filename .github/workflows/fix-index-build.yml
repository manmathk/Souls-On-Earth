name: Fix index build declaration
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix broken build declaration
        shell: bash
        run: |
          if grep -q 'build=()=>{order=ranking();render()};build();' index.html; then
            sed -i 's/build=()=>{order=ranking();render()};build();/function build(){order=ranking();render()};build();/' index.html
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Fix index build function declaration'
            git push
          else
            echo 'index.html is already fixed'
          fi
