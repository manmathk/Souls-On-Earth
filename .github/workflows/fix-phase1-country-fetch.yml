name: Fix phase1 country fetch
on:
  push:
    paths:
      - '.github/workflows/fix-phase1-country-fetch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch phase1 country discovery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/phase1-counters.js')
          s = p.read_text()
          start = s.index('async function fetchCountries(')
          end = s.index('function countryProjected', start)
          new = r'''async function fetchCountries(force=false){if(!force&&state.countries.length&&Date.now()-state.lastCountryRefresh<3600000)return state.countries;if(state.loading)return state.countries;state.loading=true;try{const [p,b,d]=await Promise.all([fetchIndicator('SP.POP.TOTL'),fetchIndicator('SP.DYN.CBRT.IN'),fetchIndicator('SP.DYN.CDRT.IN')]);const real=new Set();for(const x of p[1]||[]){if(typeof x.value!=='number'||!x.countryiso3code||!x.country)continue;const code=String(x.countryiso3code).toUpperCase();const iso2=String(x.country.iso2Code||'').toUpperCase();const regionId=String(x.country.region?.id??'').toUpperCase();const regionValue=String(x.country.region?.value??'').toLowerCase();const name=String(x.country.value||'').toLowerCase();if(!/^[A-Z]{3}$/.test(code)||!/^[A-Z]{2}$/.test(iso2))continue;if(regionId==='NA'||regionValue==='aggregates'||name==='world'||/^(high|upper middle|lower middle|low) income/.test(name)||/^(ida|ibrd)/.test(name))continue;real.add(code);}if(real.size<150)throw new Error('Population dataset returned only '+real.size+' real countries');const pm=latestByCountry(p,real),bm=latestByCountry(b,real),dm=latestByCountry(d,real),out=[];for(const [code,pv] of pm){if(!pv.value||pv.value<=0)continue;const bv=bm.get(code),dv=dm.get(code);if(!bv||!dv||typeof bv.value!=='number'||typeof dv.value!=='number')continue;out.push({code,name:pv.name||code,flag:flagFor(code),p:pv.value,pYear:pv.year,b:bv.value,bYear:bv.year,d:dv.value,dYear:dv.year});}if(out.length<150)throw new Error('Only '+out.length+' real countries returned');state.countries=out;state.lastCountryRefresh=Date.now();return out;}finally{state.loading=false;}}
'''
          p.write_text(s[:start] + new + s[end:])
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/phase1-counters.js
          git commit -m 'Fix phase1 real country discovery' || exit 0
          git push
