name: Fix all HTML flags
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject flag fixer
        run: python3 -c "from pathlib import Path; files=list(Path('.').glob('*.html')); changed=0; [((lambda p,s: (p.write_text(s.replace('</body>','<script src=\"./js/flag-fix.js\"></script></body>',1),'utf-8'), globals().__setitem__('changed',changed+1)))(p,p.read_text('utf-8')) if 'js/flag-fix.js' not in p.read_text('utf-8') and '</body>' in p.read_text('utf-8') else None) for p in files]; print('HTML files:',len(files),'changed:',changed)"
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          git commit -m 'Use Windows-compatible country flags' || exit 0
          git push
