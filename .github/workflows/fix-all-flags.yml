name: Fix all HTML flags
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Windows-compatible flag renderer
        shell: bash
        run: |
          set -e
          changed=0
          for file in *.html; do
            [ -f "$file" ] || continue
            if ! grep -q 'js/flag-fix.js' "$file"; then
              python3 - "$file" <<'PY'
from pathlib import Path
import sys
p=Path(sys.argv[1])
s=p.read_text(encoding='utf-8')
needle='<script src="./js/flag-fix.js"></script>'
if needle not in s and '</body>' in s:
    p.write_text(s.replace('</body>', needle+'</body>', 1), encoding='utf-8')
PY
              changed=$((changed+1))
            fi
          done
          echo "HTML files updated: $changed"
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then
            echo 'No HTML changes needed'
            exit 0
          fi
          git commit -m 'Use Windows-compatible country flags'
          git push
