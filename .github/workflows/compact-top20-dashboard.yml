name: Compact Top20 dashboard
on:
  push:
    paths:
      - '.github/workflows/compact-top20-dashboard.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact upper stats and give country table more room
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('top20-standalone.html')
          s=p.read_text()
          reps={
            '.hero{text-align:center;padding:10px;border-bottom:1px solid var(--line);flex-shrink:0}':'.hero{text-align:center;padding:6px 10px;border-bottom:1px solid var(--line);flex-shrink:0}',
            '.population{font-size:clamp(38px,7vw,66px);font-weight:900;line-height:1;margin:5px 0;font-variant-numeric:tabular-nums}':'.population{font-size:clamp(34px,6vw,60px);font-weight:900;line-height:1;margin:3px 0;font-variant-numeric:tabular-nums}',
            '.details{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:7px 12px;flex-shrink:0}':'.details{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:4px 10px;flex-shrink:0}',
            '.card{text-align:center;background:var(--alt);border:1px solid var(--line);border-radius:9px;padding:7px}':'.card{text-align:center;background:var(--alt);border:1px solid var(--line);border-radius:8px;padding:4px}',
            '.v{font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}':'.v{font-size:14px;font-weight:900;font-variant-numeric:tabular-nums}',
            '.k{font-size:8px;color:var(--muted);margin-top:3px}':'.k{font-size:7px;color:var(--muted);margin-top:1px}',
            '.info{text-align:center;color:var(--muted);font-size:9px;padding:2px 10px 5px;flex-shrink:0}':'.info{text-align:center;color:var(--muted);font-size:8px;padding:1px 8px 3px;flex-shrink:0}',
            '@media(max-width:600px){header{padding:7px 9px}.brand{font-size:12px}.sub{font-size:7px}.ctrl{width:28px;height:28px}.hero{padding:7px}.population{font-size:35px}.details{padding:5px 7px;gap:4px}.card{padding:5px 2px}.v{font-size:14px}.k{font-size:7px}.info{font-size:7px;padding-bottom:3px}': '@media(max-width:600px){header{padding:6px 9px}.brand{font-size:12px}.sub{font-size:7px}.ctrl{width:28px;height:28px}.hero{padding:5px}.population{font-size:32px}.details{padding:3px 7px;gap:3px}.card{padding:3px 2px}.v{font-size:11px}.k{font-size:6px}.info{font-size:6px;padding-bottom:2px}',
            '.rows{column-gap:7px;padding:3px 8px 6px}':'.rows{column-gap:7px;padding:2px 8px 5px}'
          }
          for a,b in reps.items():
              if a not in s: print('MISSING',a)
              s=s.replace(a,b)
          p.write_text(s)
          PY
      - name: Commit changes and remove temporary workflow
        run: |
          rm -f .github/workflows/compact-top20-dashboard.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add top20-standalone.html .github/workflows/compact-top20-dashboard.yml
          git diff --cached --quiet || git commit -m "Compact top20 stats for live chat space"
          git push