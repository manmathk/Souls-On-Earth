name: Repair index population data safety
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'function countryPopulation(c){return Math.floor(c[2]*Math.pow(1+c[3]/100,elapsed()/SECS_PER_YEAR))}'
          new = '''function countryPopulation(c){
            if(!Array.isArray(c)||c.length<4) return 0;
            const pop=Number(c[2]), rate=Number(c[3]);
            if(!Number.isFinite(pop)||!Number.isFinite(rate)) return 0;
            return Math.floor(pop*Math.pow(1+rate/100,elapsed()/SECS_PER_YEAR));
          }'''
          if old in s:
              s = s.replace(old, new)
          old2 = 'function ranking(){const live=data.countries.map(countryPopulation);return data.countries.map((c,i)=>i).sort((a,b)=>live[b]-live[a]).slice(0,SHOW)}'
          new2 = '''function ranking(){
            const valid=data.countries.map((c,i)=>Array.isArray(c)&&c.length>=4?i:-1).filter(i=>i>=0);
            const live=data.countries.map(countryPopulation);
            return valid.sort((a,b)=>live[b]-live[a]).slice(0,SHOW);
          }'''
          if old2 in s:
              s = s.replace(old2, new2)
          p.write_text(s)
          PY
          if git diff --quiet -- index.html; then
            echo 'No repair needed'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Fix index population runtime safety'
            git push
          fi
