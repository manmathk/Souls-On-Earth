name: Fix index-new layout
on:
  push:
    paths:
      - '.github/workflows/fix-index-new-layout.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix country grid height
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index-new.html')
          s=p.read_text()
          old='.rows{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(12,minmax(0,1fr));min-height:0;flex:1}'
          new='.rows{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr;min-height:0;flex:1}'
          if old not in s:
              raise SystemExit('expected CSS not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index-new.html
          git commit -m 'Fix index-new country grid layout'
          git push
