<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>World Population Prospects — Live Population Table</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#eee;font-family:Arial,Helvetica,sans-serif}body{min-height:100vh}.app{width:min(100%,720px);margin:0 auto;background:#000;min-height:100vh}.top{padding:7px 9px 5px;border-bottom:1px solid #383838}.select{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:700;line-height:1.1;margin-bottom:4px}.sub{font-size:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center}.tabs{display:flex;align-items:center;gap:0;padding:5px 8px 4px;border-bottom:1px solid #333}.tab{padding:7px 10px;font-size:14px;color:#8f8f8f;border:1px solid transparent}.tab.active{color:#fff;border-color:#444;background:#242424}.tools{display:flex;align-items:center;justify-content:space-between;padding:8px 9px;border-bottom:1px solid #222}.slider{display:flex;align-items:center;gap:10px;flex:1}.play{width:25px;height:25px;border-radius:50%;border:2px solid #ddd;background:#000;color:#fff;font-size:11px}.track{height:3px;background:#303030;flex:1;position:relative}.track i{position:absolute;left:45%;top:-5px;width:13px;height:13px;border-radius:50%;background:#44a8e8}.year{display:flex;align-items:center;gap:11px;font-size:16px;font-weight:700}.live{display:flex;align-items:center;gap:7px;font-size:16px;font-weight:700}.live input{appearance:none;width:20px;height:20px;border-radius:3px;background:#5b57ef;position:relative}.live input:checked:after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:900;font-size:15px}.filterbar{display:flex;align-items:center;justify-content:space-between;padding:7px 9px 5px;border-bottom:1px solid #222;font-size:15px}.worldtag{display:flex;gap:10px;align-items:center;font-weight:700}.sort{font-size:22px}.summary{padding:9px 10px 7px;display:flex;justify-content:space-between;font-weight:700;font-size:16px;border-bottom:1px solid #292929}.rows{display:block}.row{display:grid;grid-template-columns:42px 1fr minmax(110px,160px);gap:7px;align-items:center;min-height:39px;padding:4px 9px;border-bottom:1px solid #333}.flag{font-size:23px;line-height:1}.name{font-size:15px;line-height:1.1}.num{font-size:15px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.row.world{grid-template-columns:1fr auto;padding-top:6px;padding-bottom:6px;border-bottom:1px solid #444}.row.world .name{font-size:16px}.row.world .num{font-size:16px;font-weight:700}.row.up .num{color:#63e39b}.row.down .num{color:#ff7182}.foot{padding:10px 12px 15px;color:#777;font-size:10px;line-height:1.35}.search{background:#101010;color:#fff;border:0;border-bottom:1px solid #666;outline:0;width:100%;padding:5px 0;font-size:14px}.hidden{display:none!important}@media(max-width:480px){.select{font-size:15px}.sub{font-size:11px}.row{grid-template-columns:31px 1fr minmax(98px,43vw);gap:5px;min-height:42px;padding:4px 7px}.flag{font-size:20px}.name{font-size:14px}.num{font-size:14px}.summary{font-size:15px;padding:8px 8px}.row.world .name,.row.world .num{font-size:15px}.tools{padding:7px}.tabs{padding-left:6px}.tab{padding:7px 9px;font-size:13px}.foot{font-size:9px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="select"><span>World Population Prospects 2024 Med...</span><span>▾</span></div>
  <div class="sub"><span>Total Population as of 1 January</span><span>⌄ &nbsp;⌕</span></div>
</header>
<div class="tabs"><div class="tab active">Table</div><div class="tab">Map</div><div class="tab">Chart</div></div>
<div class="tools">
  <div class="slider"><button class="play" id="play">▶</button><div class="track"><i></i></div></div>
  <label class="live"><input id="live" type="checkbox" checked>Live</label>
  <div class="year"><span>‹</span><span id="year">2026</span><span>›</span></div>
</div>
<div class="filterbar"><div class="worldtag"><span>ＡŻ</span><span>⚑ World</span></div><div class="sort">☷</div></div>
<div class="rows" id="rows"></div>
<div class="foot">Continuous values are modeled from the displayed 2026 baseline and annual growth rates. They are estimates for visualization, not official real-time population registrations.</div>
</div>
<script>
const data=[
['🇮🇳','India',1479199731,.00857],['🇨🇳','China',1412286004,-.0021],['🇺🇸','United States of America',349384191,.0028],['🇮🇩','Indonesia',288320505,.0092],['🇵🇰','Pakistan',260138918,.0215],['🇳🇬','Nigeria',243433896,.0230],['🇧🇷','Brazil',213709288,.0050],['🇧🇩','Bangladesh',178249724,.0110],['🇷🇺','Russian Federation',143327332,-.0042],['🇪🇹','Ethiopia',139602709,.0248],['🇲🇽','Mexico',133208097,.0090],['🇯🇵','Japan',122287705,-.0052],['🇪🇬','Egypt',120453875,.0160],['🇵🇭','Philippines',117914319,.0152],['🇨🇩','Democratic Republic of the Congo',117193758,.0320],['🇻🇳','Viet Nam',102291484,.0060],['🇮🇷','Iran',93312390,.0070],['🇹🇷','Türkiye',87979422,.0055],['🇩🇪','Germany',83604823,-.0025],['🇹🇿','United Republic of Tanzania',72976205,.0300],['🇹🇭','Thailand',71546073,-.0010],['🇬🇧','United Kingdom of Great Britain and Northern Ireland',70005624,.0022],['🇫🇷','France',66764980,.0020],['🇿🇦','South Africa',65593358,.0120],['🇮🇹','Italy',58879090,-.0040],['🇰🇪','Kenya',58861226,.0200],['🇲🇲','Myanmar',55251197,-.0015],['🇨🇴','Colombia',54037071,.0060],['🇸🇩','Sudan',53611215,.0200],['🇺🇬','Uganda',53041978,.0320],['🇰🇷','Republic of Korea',51585513,-.0020],['🇮🇶','Iraq',48207524,.0220]
];
const worldBase=8314681242,worldGrowth=.00857,base=Date.parse('2026-01-01T00:00:00Z'),yearMs=365.2425*86400000,rows=document.getElementById('rows'),live=document.getElementById('live'),yearEl=document.getElementById('year');
let paused=false,year=2026;
function val(x,now=Date.now()){return x[2]*Math.pow(1+x[3],Math.max(0,now-base)/yearMs)}
function world(now=Date.now()){return worldBase*Math.pow(1+worldGrowth,Math.max(0,now-base)/yearMs)}
function render(){rows.innerHTML='<div class="summary"><span>World</span><strong id="world">—</strong></div>'+data.map((d,i)=>`<div class="row ${d[3]>=0?'up':'down'}" data-i="${i}"><div class="flag">${d[0]}</div><div class="name">${d[1]}</div><div class="num" id="n${i}">${d[2].toLocaleString('en-US')}</div></div>`).join('')}
function update(){if(paused)return;const now=Date.now();document.getElementById('world').textContent=Math.floor(world(now)).toLocaleString('en-US');data.forEach((d,i)=>document.getElementById('n'+i).textContent=Math.floor(val(d,now)).toLocaleString('en-US'));yearEl.textContent=year}
function toggle(){paused=!live.checked;}
live.addEventListener('change',toggle);document.getElementById('play').addEventListener('click',()=>{live.checked=!live.checked;paused=!live.checked;document.getElementById('play').textContent=paused?'▶':'Ⅱ'});
render();update();setInterval(update,250);
</script>
</body>
</html>
