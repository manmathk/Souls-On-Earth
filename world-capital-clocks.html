<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>World Capital Clocks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@500;600;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --obsidian: #0a0807;
      --obsidian-2: #140f0c;
      --ember: #ff6a2b;
      --ember-hot: #ffc257;
      --gold: #e8b86d;
      --bone: #f4ecdb;
      --smoke: #6b6459;
      --panel: rgba(18, 12, 10, 0.62);
      --panel-border: rgba(232, 184, 109, 0.25);
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: var(--bone);
      font-family: 'JetBrains Mono', monospace;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 120%, rgba(255, 106, 43, 0.18), transparent 30%),
        radial-gradient(circle at 20% 0%, rgba(232, 184, 109, 0.10), transparent 30%),
        linear-gradient(180deg, #050505 0%, #0a0807 100%);
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100dvh;
      max-width: calc(100dvh * 0.5625);
      max-height: 100dvh;
      aspect-ratio: 9 / 16;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(20, 15, 12, 0.96) 0%, rgba(8, 8, 8, 0.98) 100%);
      border: 1px solid rgba(232, 184, 109, 0.12);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
    }

    .fault {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.5;
      background-image:
        linear-gradient(118deg, transparent 46%, rgba(255, 140, 60, 0.08) 47%, transparent 48%),
        linear-gradient(122deg, transparent 49%, rgba(255, 255, 255, 0.03) 50%, transparent 51%),
        linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.015) 100%);
      mix-blend-mode: screen;
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 140px 40px rgba(0, 0, 0, 0.78);
    }

    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 0px) + 12px) 14px 0;
      z-index: 2;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--bone);
      background: rgba(10, 8, 7, 0.65);
      border: 1px solid rgba(232, 184, 109, 0.22);
      border-radius: 999px;
    }

    .tag .dot {
      width: 8px;
      height: 8px;
      background: var(--ember);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255, 106, 43, 0.8);
    }

    .global-clock {
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 11px;
      background: rgba(8, 6, 5, 0.72);
      border: 1px solid rgba(232, 184, 109, 0.15);
      color: var(--gold);
      letter-spacing: 0.12em;
    }

    .hero {
      position: absolute;
      top: 38px;
      left: 0;
      right: 0;
      z-index: 2;
      text-align: center;
      padding: 0 16px;
    }

    .eyebrow {
      font-family: 'Cinzel', serif;
      color: var(--gold);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 10px;
      opacity: 0.88;
    }

    h1 {
      margin: 6px 0 0;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 0.08em;
      font-size: clamp(34px, 7vw, 52px);
      line-height: 0.94;
      font-weight: 400;
    }

    .grid-wrap {
      position: absolute;
      inset: 108px 10px 16px 10px;
      z-index: 2;
      overflow: hidden;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      width: 100%;
      height: 100%;
      align-content: start;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      min-height: 0;
      padding: 6px 6px 4px 6px;
      background: rgba(17, 11, 8, 0.28);
      border: 1px solid rgba(232, 184, 109, 0.12);
      border-radius: 14px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02), 0 10px 18px rgba(0,0,0,0.18);
    }

    .flag {
      position: relative;
      width: 100%;
      aspect-ratio: 1.05;
      border-radius: 12px;
      overflow: hidden;
      background: var(--flag-bg);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: inset 0 0 18px rgba(0,0,0,0.18);
    }

    .flag::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(0,0,0,0.14));
      pointer-events: none;
    }

    .clock-face {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 60%;
      height: 60%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(9, 10, 12, 0.22);
      border: 2px solid rgba(255,255,255,0.72);
      box-shadow:
        inset 0 0 0 2px rgba(0,0,0,0.15),
        0 0 18px rgba(255,255,255,0.10),
        inset 0 0 28px rgba(0,0,0,0.22);
      backdrop-filter: blur(0.5px);
    }

    .clock-face::before {
      content: "";
      position: absolute;
      inset: 9%;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.15);
      background: radial-gradient(circle, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.05) 58%, rgba(0,0,0,0.16) 75%, transparent 76%);
    }

    .tick {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 2px;
      height: 11%;
      margin-left: -1px;
      margin-top: -5.5%;
      border-radius: 999px;
      background: rgba(255,255,255,0.65);
      transform-origin: center 200%;
      transform: translate(-50%, -50%) rotate(var(--angle));
      box-shadow: 0 0 4px rgba(255,255,255,0.15);
      opacity: 0.9;
    }

    .hand {
      position: absolute;
      left: 50%;
      bottom: 50%;
      transform-origin: 50% 100%;
      border-radius: 999px;
      transform: translateX(-50%) rotate(var(--rotation));
      box-shadow: 0 0 4px rgba(0,0,0,0.18);
    }

    .hour {
      width: 4px;
      height: 25%;
      background: rgba(17, 17, 18, 0.96);
      border: 1px solid rgba(255,255,255,0.22);
    }

    .minute {
      width: 3px;
      height: 34%;
      background: rgba(17, 17, 18, 0.9);
      border: 1px solid rgba(255,255,255,0.18);
    }

    .second {
      width: 2px;
      height: 40%;
      background: rgba(255, 205, 118, 0.95);
      box-shadow: 0 0 8px rgba(255, 205, 118, 0.5);
    }

    .center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 10px;
      height: 10px;
      margin-left: -5px;
      margin-top: -5px;
      border-radius: 50%;
      background: rgba(17, 17, 18, 0.95);
      border: 1px solid rgba(255,255,255,0.5);
      box-shadow: 0 0 8px rgba(255,255,255,0.18);
    }

    .meta {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      text-align: center;
      padding: 0 4px 3px;
    }

    .city {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(18px, 3vw, 22px);
      line-height: 1;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--bone);
    }

    .country {
      font-size: 8px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.8;
      color: var(--gold);
    }

    @media (max-width: 360px) {
      .grid { gap: 8px; }
      .tag { letter-spacing: 0.15em; }
      .country { letter-spacing: 0.1em; }
    }
  </style>
</head>
<body>
  <div class="stage" aria-label="World capital clocks">
    <div class="fault"></div>
    <div class="vignette"></div>

    <header class="topbar">
      <div class="tag"><span class="dot"></span> Live</div>
      <div class="global-clock" id="globalClock">--:--:--</div>
    </header>

    <div class="hero">
      <div class="eyebrow">Souls on Earth</div>
      <h1>WORLD CAPITALS</h1>
    </div>

    <div class="grid-wrap">
      <div class="grid" id="cardGrid"></div>
    </div>
  </div>

  <script>
    const capitals = [
      { city: 'London', country: 'UK', zone: 'Europe/London', flag: 'linear-gradient(90deg, #012169 0 32%, #fff 32% 68%, #c8102e 68% 100%)' },
      { city: 'Paris', country: 'France', zone: 'Europe/Paris', flag: 'linear-gradient(90deg, #0055a4 0 34%, #fff 34% 66%, #ef4135 66% 100%)' },
      { city: 'Berlin', country: 'Germany', zone: 'Europe/Berlin', flag: 'linear-gradient(180deg, #000 0 33%, #dd0000 33% 66%, #ffce00 66% 100%)' },
      { city: 'Cairo', country: 'Egypt', zone: 'Africa/Cairo', flag: 'linear-gradient(90deg, #ce1126 0 100%)' },
      { city: 'Dubai', country: 'UAE', zone: 'Asia/Dubai', flag: 'linear-gradient(90deg, #00732f 0 100%)' },
      { city: 'Delhi', country: 'India', zone: 'Asia/Kolkata', flag: 'linear-gradient(90deg, #ff9933 0 33%, #fff 33% 67%, #138808 67% 100%)' },
      { city: 'Beijing', country: 'China', zone: 'Asia/Shanghai', flag: 'linear-gradient(180deg, #de2910 0 100%)' },
      { city: 'Tokyo', country: 'Japan', zone: 'Asia/Tokyo', flag: 'linear-gradient(180deg, #fff 0 100%)' },
      { city: 'New York', country: 'USA', zone: 'America/New_York', flag: 'linear-gradient(180deg, #b22234 0 14%, #fff 14% 28%, #b22234 28% 42%, #fff 42% 58%, #b22234 58% 72%, #fff 72% 86%, #b22234 86% 100%)' },
      { city: 'Brasilia', country: 'Brazil', zone: 'America/Sao_Paulo', flag: 'linear-gradient(180deg, #009b3a 0 33%, #ffdf00 33% 66%, #002776 66% 100%)' },
      { city: 'Johannesburg', country: 'RSA', zone: 'Africa/Johannesburg', flag: 'linear-gradient(180deg, #007a4d 0 20%, #fff 20% 40%, #007a4d 40% 60%, #fff 60% 80%, #007a4d 80% 100%)' },
      { city: 'Sydney', country: 'AUS', zone: 'Australia/Sydney', flag: 'linear-gradient(180deg, #012169 0 100%)' }
    ];

    const grid = document.getElementById('cardGrid');
    const globalClock = document.getElementById('globalClock');

    function makeTickMarks() {
      const marks = [];
      for (let i = 0; i < 12; i += 1) {
        const tick = document.createElement('span');
        tick.className = 'tick';
        tick.style.setProperty('--angle', `${i * 30}deg`);
        marks.push(tick);
      }
      return marks;
    }

    function timeParts(zone) {
      const parts = new Intl.DateTimeFormat('en-US', {
        timeZone: zone,
        hour12: false,
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      }).formatToParts(new Date());

      const values = {};
      for (const part of parts) {
        if (part.type !== 'literal') values[part.type] = part.value;
      }

      return {
        hour: Number(values.hour),
        minute: Number(values.minute),
        second: Number(values.second)
      };
    }

    function buildCard(item) {
      const article = document.createElement('article');
      article.className = 'card';

      const flag = document.createElement('div');
      flag.className = 'flag';
      flag.style.setProperty('--flag-bg', item.flag);

      const clockFace = document.createElement('div');
      clockFace.className = 'clock-face';
      makeTickMarks().forEach((mark) => clockFace.appendChild(mark));

      const hour = document.createElement('span');
      hour.className = 'hand hour';
      hour.style.setProperty('--rotation', '0deg');

      const minute = document.createElement('span');
      minute.className = 'hand minute';
      minute.style.setProperty('--rotation', '0deg');

      const second = document.createElement('span');
      second.className = 'hand second';
      second.style.setProperty('--rotation', '0deg');

      const center = document.createElement('span');
      center.className = 'center';

      clockFace.append(hour, minute, second, center);
      flag.appendChild(clockFace);

      const meta = document.createElement('div');
      meta.className = 'meta';

      const city = document.createElement('div');
      city.className = 'city';
      city.textContent = item.city;

      const country = document.createElement('div');
      country.className = 'country';
      country.textContent = item.country;

      meta.append(city, country);
      article.append(flag, meta);

      article._zone = item.zone;
      article._hands = { hour, minute, second };
      return article;
    }

    function updateCard(card) {
      const { hour, minute, second } = timeParts(card._zone);
      const hourRotation = ((hour % 12) + minute / 60 + second / 3600) * 30;
      const minuteRotation = (minute + second / 60) * 6;
      const secondRotation = second * 6;

      card._hands.hour.style.setProperty('--rotation', `${hourRotation}deg`);
      card._hands.minute.style.setProperty('--rotation', `${minuteRotation}deg`);
      card._hands.second.style.setProperty('--rotation', `${secondRotation}deg`);
    }

    function formatUtcTime() {
      const now = new Date();
      return now.toLocaleTimeString('en-US', { hour12: false });
    }

    function render() {
      globalClock.textContent = formatUtcTime();
      for (const card of grid.children) {
        updateCard(card);
      }
    }

    capitals.forEach((item) => {
      grid.appendChild(buildCard(item));
    });

    render();
    setInterval(render, 1000);
  </script>
</body>
</html>
