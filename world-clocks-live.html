<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>Souls On Earth — World Clock Live</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#07090d;--panel:#10141b;--panel2:#151b24;--text:#f7f3ea;--muted:#9aa4b2;
  --gold:#f2c36b;--gold2:#ffe3a4;--line:rgba(255,255,255,.11);--glass:rgba(10,13,18,.68)
}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{display:flex;justify-content:center}
.app{width:100%;height:100dvh;max-width:1200px;display:flex;flex-direction:column;overflow:hidden;background:
  radial-gradient(circle at 50% -10%,rgba(242,195,107,.13),transparent 28%),
  linear-gradient(180deg,#0a0d12 0%,#06080b 100%)}
header{height:58px;flex:0 0 58px;display:flex;align-items:center;justify-content:space-between;padding:7px 13px;border-bottom:1px solid var(--line)}
.brand{font-size:16px;font-weight:900;letter-spacing:1px}
.sub{margin-top:2px;font-size:8px;color:var(--muted);letter-spacing:.9px;text-transform:uppercase}
.utc{font-size:13px;font-weight:900;color:var(--gold2);font-variant-numeric:tabular-nums;white-space:nowrap}
.hero{flex:0 0 auto;text-align:center;padding:7px 12px 8px;border-bottom:1px solid rgba(255,255,255,.07)}
.kicker{font-size:8px;font-weight:900;color:var(--gold);letter-spacing:1.8px;text-transform:uppercase}
h1{margin:4px 0 3px;font-size:clamp(27px,5vw,54px);line-height:.88;letter-spacing:3px}
.hero-meta{font-size:8px;color:var(--muted);letter-spacing:.9px;text-transform:uppercase}
.grid{
  flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  grid-template-rows:repeat(4,minmax(0,1fr));gap:6px;padding:7px;overflow:hidden
}
.card{
  position:relative;min-width:0;min-height:0;overflow:hidden;border:1px solid rgba(255,255,255,.13);border-radius:11px;
  background:linear-gradient(145deg,#171d27,#0b0e13 70%);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 8px 20px rgba(0,0,0,.23)
}
.card:before{
  content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 25% 20%,rgba(255,255,255,.07),transparent 28%),
  linear-gradient(180deg,rgba(255,255,255,.035),transparent 30%,rgba(0,0,0,.18) 100%)
}
.watermark{position:absolute;right:-6px;bottom:-10px;font-size:clamp(70px,15vw,145px);opacity:.09;filter:grayscale(1);transform:rotate(-8deg)}
.content{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;padding:7px}
.top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.rank{font-size:7px;font-weight:900;color:var(--gold);letter-spacing:1px}
.badges{display:flex;gap:4px;align-items:center}
.badge{padding:3px 6px;border:1px solid rgba(255,255,255,.13);border-radius:999px;background:rgba(0,0,0,.23);font-size:6px;color:#e9edf2;letter-spacing:.7px;text-transform:uppercase}
.flag-badge{font-size:14px;line-height:1;padding:1px 3px;border:1px solid rgba(255,255,255,.13);border-radius:6px;background:rgba(0,0,0,.25)}
.clock{
  width:min(58%,190px);aspect-ratio:1;position:relative;margin:auto;border-radius:50%;
  border:2px solid rgba(255,255,255,.88);
  background:radial-gradient(circle at 36% 30%,rgba(255,255,255,.2),rgba(16,20,27,.72) 55%,rgba(3,5,8,.96) 100%);
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.18),inset 0 0 25px rgba(0,0,0,.4),0 0 18px rgba(255,255,255,.06)
}
.clock:before{content:"";position:absolute;inset:9%;border:1px solid rgba(255,255,255,.16);border-radius:50%}
.num{position:absolute;font-size:clamp(7px,1vw,11px);font-weight:900;color:rgba(255,255,255,.72);transform:translate(-50%,-50%)}
.n12{left:50%;top:10%}.n3{left:90%;top:50%}.n6{left:50%;top:90%}.n9{left:10%;top:50%}
.tick{position:absolute;left:50%;top:50%;width:2px;height:8%;border-radius:2px;background:rgba(255,255,255,.72);transform-origin:50% 200%;transform:translate(-50%,-50%) rotate(var(--a))}
.hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;transform:translateX(-50%) rotate(var(--r));border-radius:99px}
.hr{width:4px;height:25%;background:#101216;border:1px solid rgba(255,255,255,.24)}
.mn{width:3px;height:34%;background:#0d1014;border:1px solid rgba(255,255,255,.2)}
.sc{width:2px;height:40%;background:var(--gold2);box-shadow:0 0 9px rgba(255,211,122,.65)}
.pin{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:#11151a;border:1px solid rgba(255,255,255,.68)}
.bottom{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:end}
.city{font-size:clamp(15px,2.7vw,28px);font-weight:900;line-height:.95;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.country{margin-top:3px;color:var(--gold);font-size:6px;font-weight:800;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timebox{text-align:right}
.time{font-size:clamp(16px,3vw,31px);font-weight:900;line-height:.95;font-variant-numeric:tabular-nums;white-space:nowrap}
.day{margin-top:3px;color:#c6cdd6;font-size:6px;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.offset{margin-top:2px;color:var(--muted);font-size:6px;white-space:nowrap}
.controls{position:relative;flex:0 0 auto;height:31px;border-top:1px solid rgba(255,255,255,.06);padding:0 9px;display:flex;align-items:center;justify-content:space-between}
.next{font-size:6px;color:var(--muted);letter-spacing:.7px;text-transform:uppercase}
.progress{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.06)}
.progress i{display:block;height:100%;width:100%;background:var(--gold);transform-origin:left center}
.music{border:1px solid var(--line);background:#11161e;color:var(--text);border-radius:7px;width:27px;height:23px;font-size:13px;cursor:pointer}
.swap{animation:swapIn .45s ease both}
@keyframes swapIn{from{opacity:0;transform:scale(.985) translateY(6px)}to{opacity:1;transform:none}}
@media (min-aspect-ratio:1.1/1){
  .grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){
  header{height:51px;flex-basis:51px;padding:6px 9px}.brand{font-size:13px}.sub{font-size:6.5px}.utc{font-size:10px}
  .hero{padding:6px 8px 7px}.kicker{font-size:7px;letter-spacing:1.4px}h1{font-size:28px;letter-spacing:2px}.hero-meta{font-size:6.5px}
  .grid{gap:4px;padding:4px}.card{border-radius:8px}.content{padding:5px}.clock{width:58%}
  .city{font-size:clamp(13px,4.2vw,18px)}.country{font-size:5.5px}.time{font-size:clamp(13px,4vw,18px)}.day,.offset,.rank,.badge{font-size:5px}.flag-badge{font-size:12px}
  .controls{height:27px}.music{width:25px;height:21px;font-size:12px}
}
@media (max-width:390px){
  .grid{gap:3px;padding:3px}.content{padding:4px}.clock{width:60%}.city{font-size:12px}.time{font-size:13px}.hero-meta{font-size:6px}
}
@media (prefers-reduced-motion:reduce){.swap{animation:none}}
</style>
</head>
<body>
<main class="app">
<header>
  <div><div class="brand">SOULS ON EARTH</div><div class="sub">WORLD CLOCK • 8 CITIES PER SET</div></div>
  <div class="utc" id="utc">UTC --:--:--</div>
</header>
<section class="hero">
  <div class="kicker" id="iteration">SET 01 / 15</div>

</section>
<section class="grid" id="grid" aria-label="Eight live world clocks"></section>
<div class="controls">
  <div class="next" id="next">NEXT SET IN 10s</div>
  <button class="music" id="music" type="button" aria-label="Toggle background music">♫</button>
  <div class="progress"><i id="progress"></i></div>
</div>
</main>

let setIndex=0,remaining=10;

function ticks(){const out=[];for(let i=0;i<12;i++){const t=document.createElement('span');t.className='tick';t.style.setProperty('--a',i*30+'deg');out.push(t)}return out}
function getParts(zone){
  const f=new Intl.DateTimeFormat('en-US',{timeZone:zone,hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true,weekday:'short',month:'short',day:'numeric',timeZoneName:'shortOffset'});
  const p={};for(const x of f.formatToParts(new Date()))if(x.type!=='literal')p[x.type]=x.value;
  return {h12:+p.hour,m:+p.minute,s:+p.second,ampm:p.dayPeriod||'',weekday:p.weekday||'',month:p.month||'',day:p.day||'',offset:p.timeZoneName||''};
}
function getHour24(zone){
  const f=new Intl.DateTimeFormat('en-GB',{timeZone:zone,hour:'2-digit',hourCycle:'h23'});
  return +f.format(new Date());
}
function buildCity(c,i){
  const card=document.createElement('article');card.className='card swap';
  card.innerHTML='<div class="watermark">'+c.flag+'</div><div class="content"><div class="top"><div class="rank">'+String(i+1).padStart(2,'0')+'</div><div class="badges"><span class="flag-badge">'+c.flag+'</span><span class="badge" data-state>LOCAL</span></div></div><div class="clock"><span class="num n12">12</span><span class="num n3">3</span><span class="num n6">6</span><span class="num n9">9</span></div><div class="bottom"><div><div class="city">'+c.city+'</div><div class="country">'+c.country+'</div></div><div class="timebox"><div class="time">--:--:-- --</div><div class="day">---</div><div class="offset">---</div></div></div></div>';
  const clock=card.querySelector('.clock');ticks().forEach(t=>clock.appendChild(t));
  ['hr','mn','sc'].forEach(cls=>{const x=document.createElement('span');x.className='hand '+cls;x.style.setProperty('--r','0deg');clock.appendChild(x);});
  const pin=document.createElement('span');pin.className='pin';clock.appendChild(pin);
  card._zone=c.zone;card._hr=clock.querySelector('.hr');card._mn=clock.querySelector('.mn');card._sc=clock.querySelector('.sc');
  card._time=card.querySelector('.time');card._day=card.querySelector('.day');card._offset=card.querySelector('.offset');card._state=card.querySelector('[data-state]');
  return card;
}

function update(){
  const now=new Date();

    const hourRot=((h24%12)+p.m/60+p.s/3600)*30;
    const minRot=(p.m+p.s/60)*6;
    const secRot=p.s*6;
    card._hr.style.setProperty('--r',hourRot+'deg');card._mn.style.setProperty('--r',minRot+'deg');card._sc.style.setProperty('--r',secRot+'deg');
    card._time.textContent=String(p.h12).padStart(2,'0')+':'+String(p.m).padStart(2,'0')+':'+String(p.s).padStart(2,'0')+' '+p.ampm;
    card._day.textContent=p.weekday+' • '+p.month+' '+p.day;
    card._offset.textContent=p.offset||card._zone;
    card._state.textContent=(h24<6||h24>=18)?'NIGHT':'DAY';
  }
  next.textContent='NEXT SET IN '+remaining+'s';
  progress.style.width=(remaining/10*100)+'%';
}
renderSet();update();
setInterval(()=>{update();remaining--;if(remaining<=0){setIndex=(setIndex+1)%sets.length;renderSet()}},1000);

const audio=document.getElementById('audio'),music=document.getElementById('music');
audio.src=new URL('./Cathedral%20of%20Stars.mp3',document.baseURI).href;audio.volume=.16;
function playMusic(){audio.play().then(()=>music.textContent='🔊').catch(()=>music.textContent='♫')}
music.addEventListener('click',()=>{if(audio.paused)playMusic();else{audio.pause();music.textContent='♫'}});
document.addEventListener('pointerdown',()=>{if(localStorage.getItem('world-clock-music')!=='off')playMusic()},{once:true});
audio.addEventListener('play',()=>{try{localStorage.setItem('world-clock-music','on')}catch(e){}music.textContent='🔊'});
audio.addEventListener('pause',()=>music.textContent='♫');
</script>
