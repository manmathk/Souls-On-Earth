<style>
*{box-sizing:border-box}
:root{--bg:#050607;--panel:#0b0d10;--panel2:#111419;--text:#f6f0e4;--muted:#9e968a;--gold:#e8b86d;--hot:#ffd37a;--line:rgba(232,184,109,.18)}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{display:flex;justify-content:center}
.app{width:100%;max-width:1100px;height:100dvh;background:linear-gradient(180deg,#0b0d10,#050607);display:flex;flex-direction:column;overflow:hidden}
header{height:64px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--line)}
.brand{font-size:17px;font-weight:900;letter-spacing:1px}
.sub{font-size:9px;color:var(--muted);margin-top:3px;letter-spacing:.8px}
.utc{font-variant-numeric:tabular-nums;color:var(--hot);font-weight:800;font-size:13px}
.hero{text-align:center;flex-shrink:0;padding:8px 12px 7px;border-bottom:1px solid rgba(255,255,255,.06)}
.kicker{font-size:9px;letter-spacing:2px;color:var(--gold);font-weight:800}
h1{margin:4px 0 2px;font-size:clamp(29px,5vw,52px);line-height:.95;letter-spacing:2px}
.hero-meta{font-size:8px;color:var(--muted);letter-spacing:1px}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:7px;padding:8px;overflow:hidden}
.card{position:relative;min-width:0;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:linear-gradient(180deg,rgba(20,22,27,.96),rgba(7,8,10,.98));box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 12px 24px rgba(0,0,0,.2)}
.flag{position:absolute;inset:0;background:var(--flag);opacity:.56}
.flag:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.1),transparent 35%,rgba(0,0,0,.35));}
.content{position:absolute;inset:0;display:flex;flex-direction:column;z-index:2;padding:7px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:7px;color:#ddd;text-transform:uppercase;letter-spacing:.7px}
.rank{color:var(--gold)}
.night{padding:3px 5px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(0,0,0,.2)}
.clock{width:min(58%,180px);aspect-ratio:1;border-radius:50%;margin:auto;position:relative;border:2px solid rgba(255,255,255,.78);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.2),rgba(0,0,0,.22) 60%,rgba(0,0,0,.45));box-shadow:inset 0 0 0 3px rgba(0,0,0,.16),inset 0 0 24px rgba(0,0,0,.3),0 0 18px rgba(255,255,255,.07)}
.clock:before{content:"";position:absolute;inset:9%;border:1px solid rgba(255,255,255,.17);border-radius:50%}
.tick{position:absolute;left:50%;top:50%;width:2px;height:9%;background:rgba(255,255,255,.7);transform-origin:50% 200%;transform:translate(-50%,-50%) rotate(var(--a));border-radius:2px}
.hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;transform:translateX(-50%) rotate(var(--r));border-radius:99px}
.hr{width:4px;height:25%;background:#101113;border:1px solid rgba(255,255,255,.23)}
.min{width:3px;height:34%;background:#101113;border:1px solid rgba(255,255,255,.18)}
.sec{width:2px;height:40%;background:var(--hot);box-shadow:0 0 8px rgba(255,211,122,.55)}
.center{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:#111317;border:1px solid rgba(255,255,255,.55)}
.bottom{display:flex;justify-content:space-between;gap:6px;align-items:end}
.city{font-size:clamp(16px,2.1vw,24px);font-weight:900;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.country{font-size:7px;color:var(--gold);margin-top:2px;text-transform:uppercase;letter-spacing:.8px}
.time{text-align:right;font-size:clamp(13px,1.8vw,20px);font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.zone{font-size:6px;color:var(--muted);margin-top:2px}
footer{height:26px;flex-shrink:0;border-top:1px solid rgba(255,255,255,.05);display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:7px;color:var(--muted);letter-spacing:.5px}
footer strong{color:var(--gold)}
@media(max-width:760px){
header{height:54px;padding:6px 9px}.brand{font-size:13px}.sub{font-size:7px}.utc{font-size:10px}
.hero{padding:6px 8px}.kicker{font-size:7px;letter-spacing:1.4px}h1{font-size:29px}.hero-meta{font-size:7px}
.grid{gap:5px;padding:5px}.card{border-radius:8px}.content{padding:5px}.clock{width:61%}.city{font-size:clamp(12px,4.2vw,18px)}.time{font-size:clamp(10px,3.5vw,15px)}.country{font-size:6px}.zone{font-size:5.5px}.top{font-size:6px}.night{padding:2px 4px}
footer{height:20px;font-size:6px;padding:0 8px}
}
@media(max-width:390px){h1{font-size:25px}.grid{gap:4px;padding:4px}.content{padding:4px}.clock{width:63%}.city{font-size:12px}.time{font-size:10px}}
</style>
</head>

 const r=document.createElement('span');r.className='rank';r.textContent=String(i+1).padStart(2,'0');
 const n=document.createElement('span');n.className='night';n.textContent='LOCAL TIME';
 top.append(r,n);
 const clock=document.createElement('div');clock.className='clock';ticks().forEach(t=>clock.append(t));
 const hr=document.createElement('span');hr.className='hand hr';hr.style.setProperty('--r','0deg');
 const mi=document.createElement('span');mi.className='hand min';mi.style.setProperty('--r','0deg');
 const se=document.createElement('span');se.className='hand sec';se.style.setProperty('--r','0deg');
 const ce=document.createElement('span');ce.className='center';clock.append(hr,mi,se,ce);
 const bottom=document.createElement('div');bottom.className='bottom';
 const left=document.createElement('div');const city=document.createElement('div');city.className='city';city.textContent=c.city;
 const country=document.createElement('div');country.className='country';country.textContent=c.country;left.append(city,country);
 const right=document.createElement('div');right.className='time';const tm=document.createElement('div');tm.textContent='--:--:--';const zone=document.createElement('div');zone.className='zone';zone.textContent=c.zone;right.append(tm,zone);
 bottom.append(left,right);content.append(top,clock,bottom);el.append(bg,content);
 el._zone=c.zone;el._h=hr;el._m=mi;el._s=se;el._tm=tm;el._zoneEl=zone;el._night=n;
 return el;
}
function renderSet(){
 const set=sets[setIndex];grid.innerHTML='';
 set.forEach((c,i)=>grid.append(build(c,i)));
 iteration.textContent='ITERATION '+String(setIndex+1).padStart(2,'0')+' / '+String(sets.length).padStart(2,'0');
 range.textContent=set.map(x=>x.city).join(' • ');
 remaining=10;
}
function update(){
 const now=new Date();
 const utcParts=new Intl.DateTimeFormat('en-GB',{timeZone:'UTC',hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(now);
 document.getElementById('utc').textContent='UTC '+utcParts;
 for(const el of grid.children){
   const p=parts(el._zone);
   el._h.style.setProperty('--r',(((p.h%12)+p.m/60+p.s/3600)*30)+'deg');
   el._m.style.setProperty('--r',((p.m+p.s/60)*6)+'deg');
   el._s.style.setProperty('--r',(p.s*6)+'deg');
   el._tm.textContent=String(p.h).padStart(2,'0')+':'+String(p.m).padStart(2,'0')+':'+String(p.s).padStart(2,'0');
   el._zoneEl.textContent=el._zone;
   el._night.textContent=(p.h<6||p.h>=18)?'NIGHT':'DAY';
 }
 next.textContent='NEXT SET IN '+remaining+'s';
}
renderSet();update();
setInterval(()=>{update();remaining--;if(remaining<0){setIndex=(setIndex+1)%sets.length;renderSet();update()}},1000);
</script>
