<style>

body{overflow:hidden}.app{width:100%;height:100%;max-width:1080px;margin:auto;display:flex;flex-direction:column;overflow:hidden;background:var(--panel)}

.grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;background:var(--panel)}.col{min-width:0;min-height:0;overflow:auto;scrollbar-width:none;background:var(--panel)}.col::-webkit-scrollbar{display:none}.col:first-child{border-right:1px solid var(--line)}
.card{min-height:72px;display:grid;grid-template-columns:62px minmax(0,1fr);gap:9px;align-items:center;padding:5px 9px;border-bottom:1px solid var(--line);position:relative;overflow:hidden;cursor:pointer;transition:background .16s ease}.card:hover{background:var(--cardHover)}.card.active{background:linear-gradient(90deg,rgba(183,123,24,.13),rgba(183,123,24,.03));box-shadow:inset 3px 0 0 var(--gold)}.icon{width:62px;height:58px;border-radius:9px;overflow:hidden;position:relative;background:linear-gradient(135deg,var(--panel2),#d9d9d9);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}.icon img{width:100%;height:100%;object-fit:cover;display:block}.icon:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 38%,rgba(0,0,0,.34));pointer-events:none}.badge{position:absolute;left:4px;top:4px;max-width:calc(100% - 8px);padding:3px 5px;border-radius:5px;background:rgba(0,0,0,.58);color:#fff5e8;font-size:6.5px;font-weight:950;letter-spacing:.6px;z-index:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fallback{width:100%;height:100%;display:grid;place-items:center;font-size:28px}.name{font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:12px}.origin{font-size:8.5px;color:var(--gold);margin-top:2px}.age{font-size:10px;font-weight:900;color:var(--text);margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:.05px}.meta{font-size:7px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}.arrow{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--muted)}.empty{padding:30px 15px;color:var(--muted);text-align:center;font-size:11px}
@media(max-width:700px){.channel{height:55px;padding:6px 7px}.avatar{width:36px;height:36px}.channel-name{font-size:12px}.channel-sub{font-size:8px}.links{gap:1px}.links a{font-size:6.5px;padding:5px 4px}.theme-btn{width:31px;height:31px;font-size:14px}.hero{padding:10px 7px 8px}.hero-title{font-size:17px}.hero-name{font-size:13px}.hero-age{font-size:clamp(27px,7.8vw,42px);letter-spacing:-.8px}.hero-note{font-size:8px}.utc{font-size:8px;margin-top:4px}.hero-details{gap:4px;margin-top:6px}.detail{padding:5px 6px}.detail-k{font-size:5.5px}.detail-v{font-size:7.5px}.hero-desc{font-size:7.3px;margin-top:5px;min-height:20px}.comment{height:29px;font-size:8px}.toolbar{min-height:40px;padding:5px 6px}.search,.sort{padding:7px 8px;font-size:9px}.count{font-size:8px}.card{min-height:64px;grid-template-columns:46px minmax(0,1fr);gap:7px;padding:4px 7px}.icon{width:46px;height:50px}.badge{font-size:5.2px;padding:2px 3px}.name{font-size:9.5px}.origin{font-size:6.8px}.age{font-size:8px}.meta{display:none}.arrow{display:none}}
@media(max-width:430px){.links a:nth-child(2),.links a:nth-child(3){display:none}.channel-info{max-width:42%}.theme-btn{width:29px;height:29px}.hero-details{grid-template-columns:repeat(3,minmax(0,1fr))}.detail{padding:4px 5px}.detail-v{font-size:6.7px}.hero-desc{font-size:6.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card{grid-template-columns:40px minmax(0,1fr);gap:6px}.icon{width:40px;height:44px}.fallback{font-size:24px}.name{font-size:8.8px}.origin{font-size:6.3px}.age{font-size:7.4px}.hero-age{font-size:27px}}
</style>

<body>
<div class="app">
<header class="channel"><img class="avatar" src="channels4_profile.jpg" alt="History Warrior"><div class="channel-info"><div class="channel-name">History Warrior</div><div class="channel-sub">🌍 ⏳ 6629 &nbsp; 🔥 820</div></div><nav class="links" aria-label="Sections"><a href="index.html">WORLD</a><a href="historical-clock.html">CLOCK</a><a href="historical-events.html">EVENTS</a><a href="civilizations.html" aria-current="page">CIVS</a></nav><button class="theme-btn" id="themeBtn" type="button" aria-label="Change theme" title="Change theme">◐</button></header>
<section class="hero"><div class="eyebrow">LIVE CIVILIZATION AGE</div><div class="hero-title">How old is this civilization?</div><div class="hero-name" id="heroName">—</div><div class="hero-age" id="heroAge">—</div><div class="hero-note">30 civilizations & empires · approximate historical start dates · calculated live</div><div class="hero-details"><div class="detail"><div class="detail-k">Region</div><div class="detail-v" id="heroRegion">—</div></div><div class="detail"><div class="detail-k">Founded / Began</div><div class="detail-v" id="heroOrigin">—</div></div><div class="detail"><div class="detail-k">Era</div><div class="detail-v" id="heroEra">—</div></div></div><div class="hero-desc" id="heroDesc">—</div><div class="utc" id="utc">—</div></section>

<div class="toolbar"><input id="search" class="search" type="search" placeholder="Search civilization or region…" autocomplete="off"><select id="sort" class="sort" aria-label="Sort civilizations"><option value="oldest">Oldest first</option><option value="newest">Newest first</option><option value="name">A–Z</option></select><span class="count" id="count"></span></div>
<main class="grid"><section class="col" id="left" aria-label="Civilizations 1"></section><section class="col" id="right" aria-label="Civilizations 2"></section></main>
</div>
<script>
const imageAPI='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrlimit=5&prop=imageinfo&iiprop=url&iiurlwidth=420&format=json&origin=*';
const civs=[
{icon:'🏺',name:'Sumer',origin:'c. 3500 BCE',year:-3500,region:'Mesopotamia',era:'Bronze Age',q:'Sumer ziggurat Ur',desc:'One of the earliest urban civilizations, known for city-states, writing, irrigation and monumental architecture.'},
{icon:'🏞️',name:'Indus Valley Civilization',origin:'c. 3300 BCE',year:-3300,region:'South Asia',era:'Bronze Age',q:'Indus Valley Mohenjo-daro',desc:'A vast urban culture of the Indus region, noted for planned cities, drainage systems, trade and distinctive seals.'},
{icon:'🏛️',name:'Ancient Egypt',origin:'c. 3100 BCE',year:-3100,region:'North Africa',era:'Early Dynastic',q:'Ancient Egypt pyramids Giza',desc:'A long-lived Nile civilization famous for centralized kingship, temples, writing, engineering and monumental tombs.'},
{icon:'🐂',name:'Minoan Civilization',origin:'c. 3000 BCE',year:-3000,region:'Aegean',era:'Bronze Age',q:'Minoan civilization Knossos',desc:'A major Bronze Age Aegean culture centered on Crete, with palatial complexes, maritime trade and vibrant art.'},
{icon:'🗿',name:'Akkadian Empire',origin:'c. 2334 BCE',year:-2334,region:'Mesopotamia',era:'Bronze Age',q:'Akkadian Empire artifact',desc:'Often regarded as one of the first territorial empires, associated with Sargon of Akkad and a wider Mesopotamian realm.'},
{icon:'🏺',name:'Babylonian Civilization',origin:'c. 1894 BCE',year:-1894,region:'Mesopotamia',era:'Bronze Age',q:'Babylon Ishtar Gate',desc:'Mesopotamian civilization centered on Babylon, remembered for royal scholarship, monumental architecture and law traditions.'},
{icon:'🏯',name:'Shang Dynasty',origin:'c. 1600 BCE',year:-1600,region:'China',era:'Bronze Age',q:'Shang dynasty bronze',desc:'Early Chinese dynasty known for bronze casting, oracle-bone inscriptions, walled settlements and ritual culture.'},
{icon:'🗿',name:'Olmec',origin:'c. 1500 BCE',year:-1500,region:'Mesoamerica',era:'Formative Period',q:'Olmec colossal head',desc:'Foundational Mesoamerican culture associated with colossal heads, ceremonial centers, jade art and long-distance exchange.'},
{icon:'⛵',name:'Phoenician Civilization',origin:'c. 1500 BCE',year:-1500,region:'Eastern Mediterranean',era:'Iron Age',q:'Phoenician ancient artifact',desc:'Seafaring city-states known for Mediterranean trade networks, colonization, crafts and the spread of an alphabetic script.'},
{icon:'🐉',name:'Zhou Dynasty',origin:'1046 BCE',year:-1046,region:'China',era:'Iron Age',q:'Zhou dynasty bronze',desc:'Long-ruling Chinese dynasty associated with the Mandate of Heaven, feudal structures and major philosophical traditions.'},
{icon:'🏛️',name:'Ancient Greece',origin:'c. 800 BCE',year:-800,region:'Aegean',era:'Archaic & Classical',q:'Ancient Greece Parthenon',desc:'Greek-speaking world of independent poleis that shaped philosophy, politics, science, literature and monumental art.'},
{icon:'🦁',name:'Achaemenid Persian Empire',origin:'c. 550 BCE',year:-550,region:'Persia',era:'Classical Antiquity',q:'Persepolis Achaemenid',desc:'A vast Persian empire built under Cyrus the Great and successors, spanning regions from Central Asia to the Mediterranean.'},
{icon:'🦁',name:'Maurya Empire',origin:'322 BCE',year:-322,region:'South Asia',era:'Classical Antiquity',q:'Maurya Empire Ashoka lion',desc:'Major South Asian empire founded by Chandragupta Maurya and later ruled by Ashoka, known for administration and inscriptions.'},
{icon:'🦅',name:'Roman Civilization',origin:'27 BCE',year:-27,region:'Mediterranean',era:'Imperial Rome',q:'Roman Colosseum',desc:'Mediterranean civilization whose institutions, engineering, law, language and culture profoundly shaped Europe and beyond.'},
{icon:'🐉',name:'Han Dynasty',origin:'206 BCE',year:-206,region:'China',era:'Classical China',q:'Han dynasty terracotta',desc:'A foundational Chinese dynasty known for bureaucracy, Confucian statecraft, trade routes and technological development.'},
{icon:'🐎',name:'Kushan Empire',origin:'c. 30 CE',year:30,region:'Central & South Asia',era:'Late Antiquity',q:'Kushan Empire sculpture',desc:'Crossroads empire connecting Central and South Asia, important for Silk Road exchange and the spread of Buddhism.'},
{icon:'🛕',name:'Aksumite Empire',origin:'c. 100 CE',year:100,region:'East Africa',era:'Late Antiquity',q:'Aksum obelisk Ethiopia',desc:'Powerful Red Sea civilization centered in present-day northern Ethiopia and Eritrea, known for trade and monumental stelae.'},
{icon:'🪷',name:'Gupta Empire',origin:'c. 320 CE',year:320,region:'South Asia',era:'Classical India',q:'Gupta period Buddha',desc:'Influential South Asian empire associated with advances in mathematics, astronomy, literature, art and temple traditions.'},
{icon:'🏛️',name:'Byzantine Empire',origin:'330 CE',year:330,region:'Eastern Mediterranean',era:'Late Antiquity',q:'Byzantine Hagia Sophia',desc:'The eastern Roman imperial tradition centered on Constantinople, preserving Roman institutions alongside Greek Christian culture.'},
{icon:'🛕',name:'Chola Dynasty',origin:'c. 300 BCE',year:-300,region:'South India',era:'Classical to Medieval',q:'Chola dynasty temple',desc:'South Indian dynasty celebrated for temple architecture, inscriptions, administration and Indian Ocean maritime influence.'},
{icon:'🐉',name:'Tang Dynasty',origin:'618 CE',year:618,region:'China',era:'Medieval China',q:'Tang dynasty art',desc:'Cosmopolitan Chinese dynasty remembered for urban culture, poetry, trade, statecraft and a flourishing Silk Road world.'},
{icon:'🛕',name:'Khmer Empire',origin:'802 CE',year:802,region:'Southeast Asia',era:'Medieval Southeast Asia',q:'Angkor Wat Khmer Empire',desc:'Powerful mainland Southeast Asian empire centered at Angkor, renowned for hydraulic works and monumental temple complexes.'},
{icon:'🌊',name:'Srivijaya',origin:'c. 650 CE',year:650,region:'Southeast Asia',era:'Maritime Asia',q:'Srivijaya inscription',desc:'Maritime polity centered in island Southeast Asia that prospered through control of strategic sea lanes and trade.'},
{icon:'📜',name:'Islamic Golden Age',origin:'c. 750 CE',year:750,region:'Islamic World',era:'Abbasid Era',q:'Islamic Golden Age astrolabe',desc:'Period of major intellectual activity across the Islamic world, spanning advances in mathematics, medicine, astronomy and philosophy.'},
{icon:'🕌',name:'Mali Empire',origin:'c. 1235 CE',year:1235,region:'West Africa',era:'Medieval West Africa',q:'Mali Empire Timbuktu manuscript',desc:'West African empire enriched by trans-Saharan trade and famous for centers of scholarship such as Timbuktu.'},
{icon:'🕌',name:'Majapahit Empire',origin:'1293 CE',year:1293,region:'Southeast Asia',era:'Medieval Indonesia',q:'Majapahit temple',desc:'Major Javanese thalassocratic empire that influenced large parts of the Indonesian archipelago through trade and state networks.'},
{icon:'🌙',name:'Ottoman Empire',origin:'c. 1299 CE',year:1299,region:'Anatolia & Balkans',era:'Early Modern',q:'Ottoman Empire mosque',desc:'Long-lived empire spanning Southeast Europe, West Asia and North Africa, centered on Istanbul after 1453.'},
{icon:'☀️',name:'Aztec Empire',origin:'1428 CE',year:1428,region:'Mesoamerica',era:'Late Postclassic',q:'Aztec Templo Mayor',desc:'Triple Alliance state centered on Tenochtitlan, known for intensive agriculture, tribute networks and monumental temples.'},
{icon:'🐍',name:'Songhai Empire',origin:'c. 1430 CE',year:1430,region:'West Africa',era:'Late Medieval',q:'Songhai Empire Timbuktu',desc:'One of the largest empires of West Africa, with major centers of trade and learning along the Niger River.'},
{icon:'🌄',name:'Inca Empire',origin:'c. 1438 CE',year:1438,region:'Andes',era:'Late Postclassic',q:'Inca Machu Picchu',desc:'Largest empire in pre-Columbian South America, known for roads, terraces, administration and monumental architecture.'}
];
const DAY=86400000,Y=365.2425*DAY;
const $=id=>document.getElementById(id);const heroName=$('heroName'),heroAge=$('heroAge'),heroRegion=$('heroRegion'),heroOrigin=$('heroOrigin'),heroEra=$('heroEra'),heroDesc=$('heroDesc'),utc=$('utc'),left=$('left'),right=$('right'),count=$('count'),search=$('search'),sort=$('sort'),themeBtn=$('themeBtn');
let selected=0,sortMode='oldest',query='';
function ageParts(year){const start=year<=0?Date.UTC(year+1,0,1):Date.UTC(year,0,1),ms=Math.max(0,Date.now()-start),years=Math.floor(ms/Y),days=Math.floor((ms-years*Y)/DAY),hours=Math.floor((ms-years*Y-days*DAY)/3600000),mins=Math.floor((ms-years*Y-days*DAY-hours*3600000)/60000),secs=Math.floor((ms-years*Y-days*DAY-hours*3600000-mins*60000)/1000);return `${years.toLocaleString()}y ${days}d ${String(hours).padStart(2,'0')}h ${String(mins).padStart(2,'0')}m ${String(secs).padStart(2,'0')}s`}
function list(){let x=[...civs];if(query)x=x.filter(c=>(c.name+' '+c.region+' '+c.origin+' '+c.era).toLowerCase().includes(query));if(sortMode==='newest')x.sort((a,b)=>b.year-a.year);else if(sortMode==='name')x.sort((a,b)=>a.name.localeCompare(b.name));else x.sort((a,b)=>a.year-b.year||a.name.localeCompare(b.name));return x}
function renderHero(){const c=civs[selected]||civs[0];heroName.textContent=c.name;heroAge.textContent=ageParts(c.year);heroRegion.textContent=c.region;heroOrigin.textContent=c.origin;heroEra.textContent=c.era;heroDesc.textContent=c.desc;utc.textContent=new Date().toISOString().replace('T',' ').slice(0,19)+' UTC'}
function card(c){const i=civs.indexOf(c);return `<article class="card ${i===selected?'active':''}" data-name="${c.name.replaceAll('"','&quot;')}" tabindex="0"><div class="icon"><span class="badge">${c.region}</span><span class="fallback">${c.icon}</span><img data-q="${encodeURIComponent(c.q)}" loading="lazy" alt="${c.name}" hidden></div><div><div class="name">${c.name}</div><div class="origin">${c.origin}</div><div class="age">${ageParts(c.year)}</div><div class="meta">LIVE AGE · HISTORICAL START</div></div><div class="arrow">›</div></article>`}
async function loadImage(img){try{const url=imageAPI+'&gsrsearch='+img.dataset.q;const res=await fetch(url);if(!res.ok)return;const data=await res.json();const pages=Object.values(data.query?.pages||{});const info=pages.find(p=>p.imageinfo?.[0]?.thumburl||p.imageinfo?.[0]?.url);const src=info?.imageinfo?.[0]?.thumburl||info?.imageinfo?.[0]?.url;if(src){img.src=src;img.hidden=false;const fb=img.parentElement.querySelector('.fallback');if(fb)fb.remove()}}catch(e){}}
function bindCards(){document.querySelectorAll('.card').forEach(el=>{const choose=()=>{selected=civs.findIndex(c=>c.name===el.dataset.name);render()};el.addEventListener('click',choose);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose()}});const img=el.querySelector('img');if(img)loadImage(img)})}
function renderCards(){const x=list(),h=Math.ceil(x.length/2);left.innerHTML=x.length?x.slice(0,h).map(card).join(''):'<div class="empty">No civilizations found.</div>';right.innerHTML=x.length?x.slice(h).map(card).join(''):'';count.textContent=`${x.length}/${civs.length}`;bindCards()}
const themes=['light','dark','ocean','sunset'];const themeGlyph={light:'☀',dark:'☾',ocean:'◉',sunset:'◒'};
function setTheme(t){document.documentElement.dataset.theme=t;themeBtn.textContent=themeGlyph[t];localStorage.setItem('civs-theme',t);themeBtn.title='Theme: '+t;themeBtn.setAttribute('aria-label','Theme: '+t)}
let theme=localStorage.getItem('civs-theme')||'light';if(!themes.includes(theme))theme='light';setTheme(theme);themeBtn.addEventListener('click',()=>{theme=themes[(themes.indexOf(theme)+1)%themes.length];setTheme(theme)});
function render(){renderHero();renderCards()}
search.addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();renderCards()});sort.addEventListener('change',e=>{sortMode=e.target.value;renderCards()});render();setInterval(()=>{renderHero();document.querySelectorAll('.age').forEach((el,i)=>{const x=list();if(x[i])el.textContent=ageParts(x[i].year)})},1000);
</script>
