function loadHeroImage(c){const nonce=++heroNonce;heroImage.style.visibility='hidden';heroFallback.hidden=false;heroFallback.textContent=c.icon;fetch(imageAPI+'&gsrsearch='+encodeURIComponent(c.q)).then(r=>r.ok?r.json():null).then(data=>{if(nonce!==heroNonce)return;const pages=Object.values(data?.query?.pages||{});const p=pages.find(x=>x.imageinfo?.[0]?.thumburl||x.imageinfo?.[0]?.url);const src=p?.imageinfo?.[0]?.thumburl||p?.imageinfo?.[0]?.url;if(src){heroImage.src=src;heroImage.alt=c.name;heroImage.onload=()=>{heroImage.style.visibility='visible';heroFallback.hidden=true};heroImage.onerror=()=>{heroImage.style.visibility='hidden';heroFallback.hidden=false}}}).catch(()=>{})}
function renderHero(){const c=civs[selected]||civs[0];heroName.textContent=c.name;heroAge.textContent=ageParts(c.year);heroOrigin.textContent='START '+c.origin;heroRegion.textContent=c.region;heroEra.textContent=c.era;heroDescription.textContent=c.description;heroCount.textContent=`${selected+1} / ${civs.length}`;utc.textContent=new Date().toISOString().replace('T',' ').slice(0,19)+' UTC';loadHeroImage(c);heroDots.innerHTML=civs.map((x,i)=>`<button class="hero-dot ${i===selected?'active':''}" type="button" aria-label="Show ${x.name}" data-i="${i}"></button>`).join('');heroDots.querySelectorAll('.hero-dot').forEach(b=>b.addEventListener('click',()=>{selected=Number(b.dataset.i);renderHero();renderCards();resetCarousel()}))}
function nextHero(){selected=(selected+1)%civs.length;renderHero();renderCards()}
function resetCarousel(){clearInterval(heroTimer);heroTimer=setInterval(nextHero,6500)}
function card(c){const i=civs.indexOf(c);return `<article class="card ${i===selected?'active':''}" data-name="${c.name.replaceAll('"','&quot;')}" tabindex="0"><div class="icon"><span class="badge">${c.region}</span><span class="fallback">${c.icon}</span><img data-q="${encodeURIComponent(c.q)}" loading="lazy" alt="${c.name}" hidden></div><div><div class="name">${c.name}</div><div class="origin">${c.origin}</div><div class="age">${ageParts(c.year)}</div><div class="meta">LIVE AGE · ${c.era}</div></div><div class="arrow">›</div></article>`}
async function loadImage(img){try{const res=await fetch(imageAPI+'&gsrsearch='+img.dataset.q);if(!res.ok)return;const data=await res.json();const pages=Object.values(data.query?.pages||{});const info=pages.find(p=>p.imageinfo?.[0]?.thumburl||p.imageinfo?.[0]?.url);const src=info?.imageinfo?.[0]?.thumburl||info?.imageinfo?.[0]?.url;if(src){img.src=src;img.hidden=false;const fb=img.parentElement.querySelector('.fallback');if(fb)fb.remove()}}catch(e){}}
function bindCards(){document.querySelectorAll('.card').forEach(el=>{el.addEventListener('click',()=>{selected=civs.findIndex(c=>c.name===el.dataset.name);renderHero();renderCards();resetCarousel()});el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selected=civs.findIndex(c=>c.name===el.dataset.name);renderHero();renderCards();resetCarousel()}});const img=el.querySelector('img');if(img)loadImage(img)})}
function renderCards(){const x=list(),h=Math.ceil(x.length/2);left.innerHTML=x.length?x.slice(0,h).map(card).join(''):'<div class="empty">No civilizations found.</div>';right.innerHTML=x.length?x.slice(h).map(card).join(''):'';count.textContent=`${x.length}/${civs.length}`;bindCards()}
const themes=['light','dark','ocean','sunset'];const themeGlyph={light:'☀',dark:'☾',ocean:'◉',sunset:'◒'};function setTheme(t){document.documentElement.dataset.theme=t;themeBtn.textContent=themeGlyph[t];localStorage.setItem('civs-theme',t);themeBtn.title='Theme: '+t;themeBtn.setAttribute('aria-label','Theme: '+t)}
let theme=localStorage.getItem('civs-theme')||'light';if(!themes.includes(theme))theme='light';setTheme(theme);themeBtn.addEventListener('click',()=>{theme=themes[(themes.indexOf(theme)+1)%themes.length];setTheme(theme)});heroNext.addEventListener('click',()=>{nextHero();resetCarousel()});
function render(){renderHero();renderCards()}
search.addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();renderCards()});sort.addEventListener('change',e=>{sortMode=e.target.value;renderCards()});render();resetCarousel();setInterval(()=>{heroAge.textContent=ageParts(civs[selected].year);utc.textContent=new Date().toISOString().replace('T',' ').slice(0,19)+' UTC';document.querySelectorAll('.age').forEach((el,i)=>{const x=list();if(x[i])el.textContent=ageParts(x[i].year)})},1000);
</script>
